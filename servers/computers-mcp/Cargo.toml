[package]
name = "veoveo-computers-mcp"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
veoveo-computers-transport = { path = "../../platform/computers/transport" }
anyhow.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["ws"] }
chrono.workspace = true
futures.workspace = true
schemars.workspace = true
rustls.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
veoveo-computers = { path = "../../platform/computers" }
veoveo-computers-runtime = { path = "../../platform/runtimes/computers" }
veoveo-task-runtime = { path = "../../platform/task-runtime" }
veoveo-platform-store = { path = "../../platform/store" }
veoveo-mcp-contract.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
veoveo-mcp-conformance = { path = "../../mcp/conformance" }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
base64.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "rustls-no-provider"] }
nix = { workspace = true, features = ["fs", "user", "mount"] }
tokio = { workspace = true, features = ["process"] }
tokio-rustls.workspace = true
sha2.workspace = true
hex.workspace = true
rcgen.workspace = true
surrealdb = { version = "=3.2.4", default-features = false, features = ["protocol-ws", "rustls"] }
