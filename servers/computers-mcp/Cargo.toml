[package]
name = "veoveo-computers-mcp"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["mcp"]
contract = [
    "dep:veoveo-computers-contract",
]
runtime = [
    "contract",
    "dep:veoveo-artifact-contract",
    "dep:sha2",
    "dep:hex",
    "dep:base64",
    "dep:veoveo-computer-execution",
    "dep:veoveo-computers-transport",
    "dep:anyhow",
    "dep:chrono",
    "dep:futures",
    "dep:schemars",
    "dep:rmcp",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tonic",
    "dep:tracing",
    "dep:uuid",
    "dep:zeroize",
    "dep:url",
    "dep:veoveo-computers",
    "dep:veoveo-computers-runtime",
    "dep:veoveo-task-runtime",
    "dep:veoveo-platform-store",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-artifact-client",
    "dep:veoveo-types",
]
mcp = [
    "runtime",
    "dep:clap",
    "dep:axum",
    "dep:rustls",
]

[dependencies]
veoveo-artifact-contract = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
veoveo-computer-execution = { path = "../../platform/computers/execution", optional = true }
veoveo-computers-transport = { path = "../../platform/computers/transport", optional = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"], optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-computers = { path = "../../platform/computers", optional = true }
veoveo-computers-runtime = { path = "../../platform/runtimes/computers", optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-types = { workspace = true, optional = true }

veoveo-computers-contract = { path = "../../platform/computers/contract", optional = true }

[dev-dependencies]
veoveo-artifact-service = { path = "../../platform/artifacts/service" }
tokio-tungstenite.workspace = true
veoveo-mcp-conformance = { path = "../../mcp/conformance" }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls-no-provider"] }
nix = { workspace = true, features = ["fs", "user", "mount"] }
tokio = { workspace = true, features = ["process"] }
tokio-rustls.workspace = true
rcgen.workspace = true
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"] }

[[bin]]
name = "computers-mcp"
path = "src/bin/computers-mcp.rs"
required-features = ["mcp"]

[[test]]
name = "application"
required-features = ["mcp"]

[[test]]
name = "http"
required-features = ["mcp"]

[[test]]
name = "native_commands"
required-features = ["mcp"]

[[test]]
name = "native_files"
required-features = ["mcp"]

[[test]]
name = "native_maintenance"
required-features = ["mcp"]

[[test]]
name = "native_worker"
required-features = ["mcp"]

[[test]]
name = "service"
required-features = ["mcp"]
