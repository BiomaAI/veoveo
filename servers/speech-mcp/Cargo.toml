[package]
name = "veoveo-speech-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.veoveo]
image-asset-inputs = ["servers/speech-mcp/runner", "servers/speech-mcp/Dockerfile", "servers/speech-mcp/Dockerfile.dependencies"]

[features]
default = ["mcp"]
contract = [
    "dep:veoveo-speech-contract",
]
runtime = [
    "dep:veoveo-audit",
    "contract",
    "dep:veoveo-types",
    "dep:veoveo-artifact-contract",
    "dep:anyhow",
    "dep:chrono",
    "dep:futures",
    "dep:hex",
    "dep:rmcp",
    "dep:secrecy",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:uuid",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]
mcp = [
    "runtime",
    "dep:axum",
    "dep:clap",
    "dep:rustls",
]

[dependencies]
veoveo-audit = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-speech-contract = { path = "contract", optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
secrecy = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
veoveo-mcp-conformance = { path = "../../mcp/conformance" }
base64.workspace = true
rcgen.workspace = true
veoveo-artifact-service = { path = "../../platform/artifacts/service" }
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "speech-mcp"
path = "src/bin/speech-mcp.rs"
required-features = ["mcp"]

[[test]]
name = "native_gpu"
required-features = ["runtime"]

[[test]]
name = "native_tasks"
required-features = ["mcp"]
