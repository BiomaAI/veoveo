[package]
name = "veoveo-time-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_time_mcp"
path = "src/lib.rs"

[[bin]]
name = "time-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "resource_contract"
required-features = ["contract"]

[[test]]
name = "numeric_contract"
required-features = ["contract"]

[[test]]
name = "digest_contract"
required-features = ["contract"]

[[test]]
name = "metadata_versions"
required-features = ["contract"]

[[test]]
name = "instant_contract"
required-features = ["contract"]

[features]
default = ["mcp"]
contract = [
    "dep:chrono",
    "dep:hex",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:veoveo-types",
]
runtime = [
    "contract",
    "chrono/clock",
    "dep:anyhow",
    "dep:futures",
    "dep:flate2",
    "dep:hifitime",
    "dep:jiff",
    "dep:rangemap",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tokio-util",
    "dep:thiserror",
    "dep:surrealdb",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]
mcp = [
    "runtime",
    "dep:axum",
    "dep:clap",
    "dep:dotenvy",
    "dep:rmcp",
    "dep:secrecy",
    "dep:tower-http",
    "dep:veoveo-mcp-apps-extension",
]

[dependencies]
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# Match the workspace Chrono pin; contract consumers only need its date/time wire types.
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hifitime = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
rangemap = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, features = ["chrono04"], optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

# Match Store's qualified driver types; upgrade together in foundations Phase 4.
surrealdb = { version = "=3.2.4", default-features = false, optional = true }

[dev-dependencies]
iri-string.workspace = true
serde_json.workspace = true
tempfile = "3"
tower = { workspace = true, features = ["util"] }
