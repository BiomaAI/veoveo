[package]
name = "veoveo-recording-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_recording_mcp"
path = "src/lib.rs"

[[bin]]
name = "recording-mcp"
path = "src/bin/server.rs"
required-features = ["redap"]

[[test]]
name = "catalog_queries"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[features]
gateway = ["veoveo-recording-contract/policy", "dep:veoveo-gateway-contract", "contract", "dep:veoveo-mcp-gateway", "dep:veoveo-mcp-contract", "dep:veoveo-types", "dep:anyhow", "dep:axum", "dep:prost", "dep:veoveo-recording-protocol", "dep:chrono", "dep:secrecy", "dep:reqwest", "dep:parking_lot", "dep:futures", "dep:tokio", "dep:serde", "dep:serde_json", "dep:url", "dep:tracing", "dep:bytes", "chrono/clock", "dep:sha2"]
schema = ["dep:veoveo-recording-store", "veoveo-recording-store/schema", "dep:veoveo-modules", "dep:veoveo-types", "dep:serde", "dep:schemars"]
default = ["mcp"]
contract = ["dep:veoveo-recording-contract"]
runtime = [
    "veoveo-recording-store/persistence",
    "schema",
    "dep:veoveo-gateway-contract",
    "contract",
    "dep:chrono",
    "dep:hex",
    "dep:veoveo-types",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
    "dep:veoveo-artifact-contract",
    "dep:anyhow",
    "dep:bytes",
    "chrono/clock",
    "dep:futures",
    "dep:fs4",
    "dep:notify",
    "dep:re_build_info",
    "dep:re_chunk",
    "dep:re_log_encoding",
    "dep:re_log_types",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tempfile",
    "dep:url",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-recording-hub",
    "dep:veoveo-rrd",
    "dep:veoveo-recording-reader",
    "dep:re_sdk",
    "dep:re_sdk_types",
]
mcp = [
    "runtime",
    "dep:rmcp",
    "dep:axum",
    "dep:clap",
    "dep:rustls",
    "dep:secrecy",
    "dep:tracing-subscriber",
    "dep:veoveo-mcp-apps-extension",
]
redap = [
    "mcp",
    "dep:async-stream",
    "dep:base64",
    "dep:re_auth",
    "dep:re_protos",
    "dep:re_server",
    "dep:re_tuid",
    "dep:re_uri",
    "dep:tonic",
    "dep:tonic-web",
]
redap-conformance = ["redap", "dep:re_redap_tests"]

[dependencies]
veoveo-recording-store = { workspace = true, default-features = false, optional = true }
veoveo-gateway-contract = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
veoveo-recording-protocol = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"], optional = true }
parking_lot = { workspace = true, optional = true }
veoveo-mcp-gateway = { path = "../../platform/gateway", optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }
veoveo-recording-contract = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-stream = { version = "=0.3.6", optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
fs4 = { version = "=1.1.0", optional = true }
hex = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
re_build_info = { workspace = true, optional = true }
re_auth = { workspace = true, optional = true }
re_chunk = { workspace = true, optional = true }
re_log_encoding = { workspace = true, optional = true }
re_log_types = { workspace = true, optional = true }
re_protos = { workspace = true, optional = true }
re_redap_tests = { workspace = true, optional = true }
re_server = { workspace = true, optional = true }
re_tuid = { workspace = true, optional = true }
re_uri = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "sync", "time"], optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }
tonic = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tempfile = { version = "=3.27.0", optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v7"], optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-recording-hub = { path = "../../platform/recordings/hub", optional = true }
veoveo-rrd = { workspace = true, optional = true }
veoveo-recording-reader = { workspace = true, optional = true }
re_sdk = { workspace = true, optional = true }
re_sdk_types = { workspace = true, optional = true }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-mcp-contract = { workspace = true, features = ["testing"] }
veoveo-gateway-catalog.workspace = true
serde.workspace = true
veoveo-platform-store.workspace = true
veoveo-audit-contract.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
