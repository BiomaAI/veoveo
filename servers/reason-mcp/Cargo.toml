[package]
name = "veoveo-reason-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.veoveo]
image-asset-inputs = ["servers/reason-mcp/runner"]

[lib]
name = "veoveo_reason_mcp"
path = "src/lib.rs"

[[bin]]
name = "reason-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "installed_knowledge"
required-features = ["mcp"]

[[test]]
name = "gateway_source_conformance"
required-features = ["mcp"]

[features]
default = ["mcp"]
contract = [
    "dep:veoveo-recording-mcp",
    "dep:base64",
    "dep:chrono",
    "dep:uuid",
    "dep:veoveo-types",
    "dep:anyhow",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:veoveo-artifact-contract",
    "dep:veoveo-recording-video",
    "dep:veoveo-stream-mcp",
]
knowledge = ["contract", "dep:veoveo-mcp-knowledge-extension"]
runtime = [
    "contract",
    "chrono/clock",
    "veoveo-recording-video/runtime",
    "dep:tempfile",
    "dep:tokio",
    "dep:re_sdk",
    "dep:re_sdk_types",
    "dep:re_log_types",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
]
mcp = [
    "runtime",
    "knowledge",
    "veoveo-mcp-knowledge-extension/mcp",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:tokio-util",
    "dep:tracing",
    "dep:veoveo-mcp-apps-extension",
    "dep:veoveo-platform-store",
    "dep:veoveo-artifact-mcp",
    "dep:veoveo-recording-reader",
    "dep:veoveo-task-runtime",
]

[dependencies]
veoveo-recording-mcp = { path = "../recording-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-stream-mcp = { path = "../stream-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# Match the qualified release while keeping clocks out of contract consumers.
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full", "process"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Match the qualified native identity release; Reason admits UUIDv7 only.
uuid = { version = "=1.25.0", default-features = false, features = ["std", "v7"], optional = true }

re_sdk = { workspace = true, optional = true }
re_sdk_types = { workspace = true, optional = true }
re_log_types = { workspace = true, optional = true }

veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-recording-reader = { workspace = true, optional = true }
veoveo-recording-video = { path = "../../platform/recordings/video", default-features = false, features = ["contract"], optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

veoveo-artifact-mcp = { path = "../artifact-mcp", default-features = false, features = ["knowledge"], optional = true }
veoveo-mcp-knowledge-extension = { workspace = true, features = ["contract"], optional = true }

[dev-dependencies]
veoveo-gateway-contract.workspace = true
veoveo-gateway-catalog.workspace = true
axum.workspace = true
veoveo-deploy-contract.workspace = true
veoveo-embedding-contract.workspace = true
veoveo-knowledge-mcp = { path = "../knowledge-mcp", default-features = false, features = ["contract"] }
veoveo-mcp-conformance = { path = "../../mcp/conformance" }
veoveo-artifact-service = { path = "../../platform/artifacts/service" }
object_store.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
