[project]
name = "reason-runner"
version = "0.1.0"
description = "Veoveo reason world-model runner: the typed per-task boundary over the image's vLLM runtime"
requires-python = ">=3.12"
# vllm is supplied by the deployable image and is deliberately not declared;
# installing it from PyPI here would shadow the image's CUDA-matched build.
dependencies = [
    "av==18.1.0",
    "num2words==0.5.14",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Veoveo's CUDA RGB/DLPack decoder needs 2.2.2. vLLM 0.30.0 pins 2.0.4 for
# its own video loader, which Reason does not call. See ../DESIGN.md.
gpu = ["pynvvideocodec==2.2.2"]

[project.scripts]
reason-runner = "reason_runner.main:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reason_runner"]
