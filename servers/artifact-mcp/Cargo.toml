[package]
name = "veoveo-artifact-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_artifact_mcp"
path = "src/lib.rs"

[[bin]]
name = "artifact-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "gateway_source_conformance"
required-features = ["mcp"]

[[test]]
name = "gateway_sharing"
required-features = ["mcp"]

[features]
default = ["mcp"]
contract = [
    "dep:veoveo-artifact-contract",
    "dep:veoveo-types",
    "dep:chrono",
    "dep:schemars",
    "dep:serde",
]
knowledge = [
    "contract",
    "dep:anyhow",
    "dep:serde_json",
    "dep:veoveo-mcp-knowledge-extension",
]
runtime = [
    "knowledge",
    "chrono/clock",
    "contract",
    "dep:anyhow",
    "dep:base64",
    "dep:futures",
    "dep:secrecy",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-mcp-knowledge-extension",
    "dep:veoveo-platform-store",
]
mcp = [
    "runtime",
    "dep:clap",
    "dep:dotenvy",
    "dep:rmcp",
    "dep:rustls",
    "dep:veoveo-mcp-apps-extension",
    "veoveo-mcp-knowledge-extension/mcp",
]

[dependencies]
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, default-features = false, optional = true }
veoveo-mcp-knowledge-extension = { workspace = true, features = ["contract"], optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
serde_json.workspace = true
veoveo-gateway-contract.workspace = true
axum.workspace = true
object_store.workspace = true
rcgen.workspace = true
uuid.workspace = true
veoveo-artifact-service = { path = "../../platform/artifacts/service" }
veoveo-deploy-contract.workspace = true
veoveo-mcp-conformance = { path = "../../mcp/conformance" }
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
