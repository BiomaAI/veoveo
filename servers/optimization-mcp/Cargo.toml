[package]
name = "veoveo-optimization-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_optimization_mcp"
path = "src/lib.rs"

[[bin]]
name = "optimization-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "usage_contract"
required-features = ["contract"]

[[test]]
name = "contract_schema"
required-features = ["contract"]

[[test]]
name = "usage"
required-features = ["mcp"]

[[test]]
name = "cuopt_gpu"
required-features = ["runtime"]

[[test]]
name = "startup"
required-features = ["mcp"]

[[test]]
name = "reads"
required-features = ["mcp"]

[[test]]
name = "index_contract"
required-features = ["contract"]

[[test]]
name = "resources"
required-features = ["contract"]

[[test]]
name = "map_travel_model"
required-features = ["contract"]

[features]
default = ["mcp"]
schema = ["dep:veoveo-modules"]
contract = [
    "dep:hex",
    "dep:sha2",
    "dep:veoveo-map-mcp",
    "dep:base64",
    "dep:chrono",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:uuid",
    "dep:veoveo-types",
    "dep:veoveo-artifact-contract",
]
runtime = [
    "veoveo-modules/runner",
    "dep:tracing",
    "schema",
    "dep:surrealdb",
    "contract",
    "dep:anyhow",
    "dep:hex",
    "dep:reqwest",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]
mcp = [
    "runtime",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:rustls",
    "dep:rmcp",
    "dep:secrecy",
    "dep:tracing",
    "dep:veoveo-mcp-apps-extension",
]

[dependencies]
veoveo-modules = { workspace = true, optional = true }
veoveo-map-mcp = { path = "../map-mcp", default-features = false, features = ["contract"], optional = true }
# Matches the qualified Store driver; upstream stable verified at https://github.com/surrealdb/surrealdb/releases/tag/v3.3.0.
surrealdb = { version = "=3.3.0", default-features = false, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { features = ["runtime"], workspace = true, optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
veoveo-deploy-contract.workspace = true
veoveo-mcp-contract = { workspace = true, features = ["runtime", "testing"] }
veoveo-platform-store = { path = "../../platform/store", features = ["schema"] }
veoveo-modules = { workspace = true, features = ["runner"] }
# Qualified RFC 6570 expansion, matching the foundation's exact 0.7.14 pin.
iri-string.workspace = true
tempfile = "3"
veoveo-testing-support = { path = "../../testing/support" }
