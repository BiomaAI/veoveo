[package]
name = "veoveo-view-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_view_mcp"
path = "src/lib.rs"

[[bin]]
name = "view-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[features]
default = ["mcp"]
contract = [
    "dep:chrono",
    "dep:glam",
    "dep:hex",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:uuid",
    "dep:veoveo-artifact-contract",
    "dep:veoveo-frames-mcp",
    "dep:veoveo-map-mcp",
    "dep:veoveo-recording-contract",
    "dep:veoveo-types",
]
runtime = [
    "contract",
    "dep:ash",
    "dep:cudarc",
    "dep:libloading",
    "dep:libc",
    "dep:wgpu",
    "dep:anyhow",
    "dep:base64",
    "dep:bevy",
    "dep:draco-gltf",
    "dep:futures",
    "dep:gltf",
    "dep:image",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:secrecy",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
]
mcp = [
    "runtime",
    "dep:clap",
    "dep:dotenvy",
    "dep:rmcp",
    "dep:rustls",
    "dep:veoveo-mcp-apps-extension",
    "dep:veoveo-task-runtime",
    "dep:veoveo-platform-store",
]

[dependencies]
ash = { version = "=0.38.0", optional = true }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-13030"] }
libloading = { version = "=0.9.0", optional = true }
libc = { version = "=0.2.189", optional = true }
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
veoveo-frames-mcp = { optional = true, path = "../frames-mcp", default-features = false, features = ["contract"] }
veoveo-map-mcp = { optional = true, path = "../map-mcp", default-features = false, features = ["contract"] }
veoveo-recording-contract = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bevy = { optional = true, workspace = true, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "default_app",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
] }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
draco-gltf = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
gltf = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
image = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { optional = true, workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { optional = true, workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { optional = true, workspace = true, features = ["full"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-artifact-client = { optional = true, path = "../../platform/artifacts/client" }
veoveo-mcp-apps-extension = { optional = true, path = "../../mcp/apps-extension" }
veoveo-mcp-contract = { features = ["runtime"], workspace = true, optional = true }
veoveo-task-runtime = { optional = true, path = "../../platform/task-runtime" }
# Native hosted-server fixtures need Store; contract-only tests must not build it.
veoveo-platform-store = { optional = true, path = "../../platform/store" }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
rustls.workspace = true
veoveo-mcp-contract = { workspace = true, features = ["runtime", "testing"] }
veoveo-gateway-catalog.workspace = true
approx = "0.5.1"
jsonschema.workspace = true
tempfile = "3"
