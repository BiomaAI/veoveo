<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Composer</title>
<style>
:root{--paper:#fffdf8;--surface:#f6f3ec;--raised:#fffdf8;--ink:#201e1a;--muted:#6f6a5f;--line:#ddd8cc;--strong:#c7c0af;--accent:#201e1a;--on:#fffdf8;--good:#3f7354;--bad:#96423b;--warn:#8a6430;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme="dark"]{--paper:#101012;--surface:#161618;--raised:#1b1b1e;--ink:#eae6dc;--muted:#918c82;--line:#2b2a2d;--strong:#3e3c38;--accent:#e8e3d8;--on:#131315;--good:#74a184;--bad:#c96f67;--warn:#bd8443;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{min-height:52px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface)}h1{margin:0;font-size:16px}.top p{margin:0;color:var(--muted)}.spacer{flex:1}.status{padding:3px 7px;border:1px solid var(--line);font:11px/16px ui-monospace,monospace;color:var(--muted)}.status.good{color:var(--good);border-color:var(--good)}.status.bad{color:var(--bad);border-color:var(--bad)}.workspace{min-height:0;display:grid;grid-template-columns:minmax(310px,390px) minmax(0,1fr)}.editor{overflow:auto;padding:12px;border-right:1px solid var(--line);background:var(--surface)}.panel{margin-bottom:10px;border:1px solid var(--line);background:var(--raised)}.panel>header{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.field{display:grid;gap:4px;min-width:0}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:0;background:var(--paper);padding:7px 8px}.field textarea{min-height:150px;resize:vertical;font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.actions{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border-top:1px solid var(--line)}button{min-height:32px;padding:6px 10px;border:1px solid var(--strong);border-radius:0;background:var(--raised)}button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}button:disabled{cursor:wait;opacity:.55}.preview{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--paper)}.tabs{display:flex;align-items:center;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}.tabs button{min-height:30px;border-color:transparent;background:transparent}.tabs button.active{border-color:var(--strong);background:var(--raised)}.canvas{min-height:420px;display:grid;place-items:center;padding:18px;overflow:auto}.canvas img{display:block;max-width:100%;max-height:72vh;object-fit:contain;background:#fff}.empty{max-width:420px;color:var(--muted);text-align:center}.diagnostics{align-self:stretch;width:100%;margin:0;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--raised);color:var(--ink);font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.message{margin:0;padding:8px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.message.bad{color:var(--bad)}.message.good{color:var(--good)}
@media(max-width:820px){.workspace{grid-template-columns:1fr}.editor{border-right:0;border-bottom:1px solid var(--line)}.canvas{min-height:330px}.top p{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><h1>Composer</h1><p>Author, validate, compile, and render a Flint chart.</p><span class="spacer"></span><span id="status" class="status">connecting</span></header>
  <main class="workspace">
    <form id="editor" class="editor">
      <section class="panel"><header>Chart</header><div class="fields">
        <div class="field"><label for="backend">Backend</label><select id="backend"><option value="vegalite">Vega-Lite</option><option value="echarts">ECharts</option><option value="chartjs">Chart.js</option></select></div>
        <div class="field"><label for="chart-type">Chart type</label><select id="chart-type"><option>Bar Chart</option></select></div>
        <div class="field full"><label for="title">Title</label><input id="title" value="Revenue by region" maxlength="200"></div>
        <div class="field full"><label for="subtitle">Subtitle</label><input id="subtitle" value="Editable inline dataset" maxlength="300"></div>
        <div class="field"><label for="x-field">X field</label><select id="x-field"></select></div>
        <div class="field"><label for="y-field">Y field</label><select id="y-field"></select></div>
        <div class="field"><label for="width">Width</label><input id="width" type="number" min="160" max="1800" value="640"></div>
        <div class="field"><label for="height">Height</label><input id="height" type="number" min="120" max="1200" value="380"></div>
        <div class="field full"><label for="theme">Theme</label><select id="theme"><option value="">Default</option></select></div>
      </div></section>
      <section class="panel"><header>Inline data</header><div class="fields"><div class="field full"><label for="data">JSON array · bounded by the server contract</label><textarea id="data" maxlength="524288">[
  {"region":"North","revenue":120},
  {"region":"South","revenue":90},
  {"region":"East","revenue":150},
  {"region":"West","revenue":110}
]</textarea></div></div><div class="actions"><button id="format-data" type="button">Format JSON</button><button id="copy-spec" type="button">Copy input</button><span class="spacer"></span><button id="validate" type="button">Validate</button><button id="render" class="primary" type="submit">Render</button></div><p id="message" class="message">The direct-launch draft is ready to render.</p></section>
    </form>
    <section class="preview">
      <nav class="tabs" aria-label="Chart output"><button id="preview-tab" class="active" type="button">Preview</button><button id="compiled-tab" type="button">Compiled spec</button><span class="spacer"></span><button id="copy-output" type="button" disabled>Copy output</button></nav>
      <div id="canvas" class="canvas"><div class="empty">Connecting to the Charts MCP server…</div></div>
    </section>
  </main>
</div>
<script>
const pending=new Map(),listeners=new Map();let nextId=1,rendered=null,compiled=null,activeTab="preview",validateTimer;
const el=id=>document.getElementById(id);
const bridge={post(message){parent.postMessage(message,"*")},request(method,params){const id=nextId++;this.post({jsonrpc:"2.0",id,method,params});return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}))},notify(method,params){this.post({jsonrpc:"2.0",method,params})},on(method,handler){listeners.set(method,handler)}};
addEventListener("message",event=>{if(event.source!==parent||!event.data||event.data.jsonrpc!=="2.0")return;const message=event.data;if(message.id!==undefined&&pending.has(message.id)){const entry=pending.get(message.id);pending.delete(message.id);message.error?entry.reject(new Error(message.error.message||"MCP App request failed")):entry.resolve(message.result);return}if(message.method)listeners.get(message.method)?.(message.params,message.id)});
function setStatus(text,kind=""){el("status").textContent=text;el("status").className=`status ${kind}`.trim()}
function setMessage(text,kind=""){el("message").textContent=text;el("message").className=`message ${kind}`.trim()}
function structured(result){return result&&(result.structuredContent||result.structured_content)||result}
function errorText(result,name){const item=(result?.content||[]).find(entry=>entry?.type==="text"&&typeof entry.text==="string");return item?.text||`${name} failed`}
async function tool(name,args){const result=await bridge.request("tools/call",{name,arguments:args});if(result&&(result.isError||result.is_error))throw new Error(errorText(result,name));return result}
function applyTheme(context){const theme=context?.theme;if(theme==="dark"||theme==="light")document.documentElement.dataset.theme=theme}
function parseRows(){const rows=JSON.parse(el("data").value);if(!Array.isArray(rows)||rows.length===0)throw new Error("Inline data must be a non-empty JSON array.");if(rows.length>5000)throw new Error("Composer drafts are limited to 5,000 inline rows.");if(!rows.every(row=>row&&typeof row==="object"&&!Array.isArray(row)))throw new Error("Every data row must be a JSON object.");return rows}
function columns(rows){return [...new Set(rows.flatMap(row=>Object.keys(row)))].sort()}
function syncFields(){try{const rows=parseRows(),names=columns(rows);for(const [id,preferred] of [["x-field","region"],["y-field","revenue"]]){const select=el(id),current=select.value||preferred;select.replaceChildren(...names.map(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;return option}));select.value=names.includes(current)?current:names[id==="x-field"?0:Math.min(1,names.length-1)]||""}}catch{}}
function input(){const rows=parseRows(),x=el("x-field").value,y=el("y-field").value;if(!x||!y)throw new Error("Choose both X and Y fields.");const semantic={};for(const field of columns(rows)){const sample=rows.find(row=>row[field]!==null&&row[field]!==undefined)?.[field];semantic[field]=typeof sample==="number"?"Quantity":"Category"}const chart_spec={chartType:el("chart-type").value,encodings:{x:{field:x},y:{field:y}},baseSize:{width:Number(el("width").value),height:Number(el("height").value)}};if(el("title").value.trim())chart_spec.title=el("title").value.trim();if(el("subtitle").value.trim())chart_spec.subtitle=el("subtitle").value.trim();const value={data:{values:rows},semantic_types:semantic,chart_spec};if(el("theme").value)value.theme_spec=el("theme").value;return value}
function applyInput(value){if(!value?.chart_spec||!Array.isArray(value?.data?.values))return;el("data").value=JSON.stringify(value.data.values,null,2);el("title").value=value.chart_spec.title||"";el("subtitle").value=value.chart_spec.subtitle||"";el("width").value=value.chart_spec.baseSize?.width||640;el("height").value=value.chart_spec.baseSize?.height||380;if(value.theme_spec&&typeof value.theme_spec==="string")el("theme").value=value.theme_spec;syncFields();const enc=value.chart_spec.encodings||{};if(enc.x?.field)el("x-field").value=enc.x.field;if(enc.y?.field)el("y-field").value=enc.y.field;if(value.chart_spec.chartType)el("chart-type").value=value.chart_spec.chartType;void render()}
function show(){const canvas=el("canvas");canvas.replaceChildren();el("preview-tab").classList.toggle("active",activeTab==="preview");el("compiled-tab").classList.toggle("active",activeTab==="compiled");if(activeTab==="compiled"){const pre=document.createElement("pre");pre.className="diagnostics";pre.textContent=compiled?JSON.stringify(compiled,null,2):"Compile the current draft to inspect its backend-native specification.";canvas.append(pre);return}if(!rendered){const empty=document.createElement("div");empty.className="empty";empty.textContent="Render the current draft to create a chart preview.";canvas.append(empty);return}const image=document.createElement("img");image.alt=el("title").value.trim()||"Rendered chart";image.src=rendered.url;canvas.append(image)}
async function validate(silent=false){clearTimeout(validateTimer);try{const value=input(),backend=el("backend").value;setStatus("validating");const result=structured(await tool("validate_chart",{...value,backend}));if(result.valid){setStatus("valid","good");if(!silent)setMessage(`${backend} accepts ${result.chartType}.`,"good")}else{const errors=(result.errors||[]).map(item=>item.message).join("; ")||"Chart input is invalid.";setStatus("invalid","bad");setMessage(errors,"bad")}return result}catch(error){setStatus("invalid","bad");setMessage(error.message,"bad");if(!silent)throw error}}
async function compile(){const value=input(),backend=el("backend").value;const result=structured(await tool("compile_chart",{...value,backend}));compiled=result;return result}
async function render(){const button=el("render");button.disabled=true;try{const value=input(),backend=el("backend").value;setStatus("rendering");const result=await tool("render_chart",{...value,backend,format:backend==="chartjs"?"png":"svg",scale:1});const image=(result.content||[]).find(item=>item?.type==="image");const svg=(result.content||[]).find(item=>item?.type==="text"&&typeof item.text==="string"&&item.text.trim().startsWith("<svg"));if(image)rendered={url:`data:${image.mimeType};base64,${image.data}`,copy:image.data,mime:image.mimeType};else if(svg)rendered={url:`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg.text)}`,copy:svg.text,mime:"image/svg+xml"};else throw new Error("The renderer returned no image output.");await compile();activeTab="preview";show();el("copy-output").disabled=false;setStatus("rendered","good");setMessage(`${backend} rendered the current draft.`,"good")}catch(error){setStatus("failed","bad");setMessage(error.message,"bad")}finally{button.disabled=false;reportSize()}}
async function copyText(text,label){try{await navigator.clipboard.writeText(text);setMessage(`${label} copied.`,"good")}catch{const area=document.createElement("textarea");area.value=text;document.body.append(area);area.select();document.execCommand("copy");area.remove();setMessage(`${label} copied.`,"good")}}
function reportSize(){bridge.notify("ui/notifications/size-changed",{height:Math.ceil(document.documentElement.getBoundingClientRect().height)})}
async function loadCatalog(){const backend=el("backend").value;const [typesResult,themesResult]=await Promise.all([tool("list_chart_types",{backend}),tool("list_themes",{})]);const types=structured(typesResult)?.backends?.[0]?.chartTypes||[];const current=el("chart-type").value;el("chart-type").replaceChildren(...types.map(item=>{const option=document.createElement("option");option.value=item.chartType;option.textContent=item.chartType;return option}));if(types.some(item=>item.chartType===current))el("chart-type").value=current;else if(types.some(item=>item.chartType==="Bar Chart"))el("chart-type").value="Bar Chart";const themes=structured(themesResult)?.themes||[];const prior=el("theme").value;el("theme").replaceChildren(new Option("Default",""),...themes.map(item=>new Option(item.label||item.name||item.id,item.id||item.name)));el("theme").value=prior}
bridge.on("ui/notifications/host-context-changed",params=>applyTheme(params?.hostContext||params));bridge.on("ui/notifications/tool-input",params=>{if(params?.arguments)applyInput(params.arguments)});bridge.on("ui/notifications/tool-result",params=>{const value=structured(params?.result||params)?.input;if(value)applyInput(value)});bridge.on("ui/resource-teardown",(_params,id)=>{clearTimeout(validateTimer);if(id!==undefined)bridge.post({jsonrpc:"2.0",id,result:{}})});
el("editor").addEventListener("submit",event=>{event.preventDefault();void render()});el("validate").addEventListener("click",()=>void validate());el("format-data").addEventListener("click",()=>{try{el("data").value=JSON.stringify(parseRows(),null,2);syncFields();setMessage("Inline data formatted.","good")}catch(error){setMessage(error.message,"bad")}});el("copy-spec").addEventListener("click",()=>{try{void copyText(JSON.stringify(input(),null,2),"Chart input")}catch(error){setMessage(error.message,"bad")}});el("copy-output").addEventListener("click",()=>{if(rendered)void copyText(rendered.copy,rendered.mime==="image/svg+xml"?"SVG":"PNG base64")});el("preview-tab").addEventListener("click",()=>{activeTab="preview";show()});el("compiled-tab").addEventListener("click",async()=>{activeTab="compiled";try{await compile()}catch(error){compiled={error:error.message}}show()});el("backend").addEventListener("change",async()=>{try{await loadCatalog();await validate(true)}catch(error){setMessage(error.message,"bad")}});el("data").addEventListener("input",syncFields);for(const node of document.querySelectorAll("input,select,textarea"))node.addEventListener("input",()=>{clearTimeout(validateTimer);validateTimer=setTimeout(()=>void validate(true),550)});
(async()=>{try{const initialized=await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"charts-composer",version:"1.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});bridge.notify("ui/notifications/initialized",{});applyTheme(initialized?.hostContext);syncFields();await loadCatalog();setStatus("ready","good");await render()}catch(error){setStatus("unavailable","bad");setMessage(`Composer initialization failed: ${error.message}`,"bad");show()}finally{reportSize()}})();
</script>
</body>
</html>
