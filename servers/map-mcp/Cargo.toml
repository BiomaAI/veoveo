[package]
name = "veoveo-map-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.veoveo]
image-asset-inputs = ["servers/map-mcp/assets/workspace-app.html", "servers/map-mcp/app"]

[lib]
name = "veoveo_map_mcp"
path = "src/lib.rs"

[[bin]]
name = "map-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "metadata_contract"
required-features = ["contract"]

[[test]]
name = "travel_model_compatibility"
required-features = ["contract"]

[[test]]
name = "coordinate_contract"
required-features = ["contract"]

[features]
default = ["mcp"]
contract = [
    "dep:chrono",
    "dep:geo",
    "dep:geo-types",
    "dep:hex",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:uuid",
    "dep:veoveo-artifact-contract",
    "dep:veoveo-types",
]
runtime = [
    "contract",
    "chrono/clock",
    "dep:anyhow",
    "dep:base64",
    "dep:duckdb",
    "dep:flate2",
    "dep:futures",
    "dep:geographiclib-rs",
    "dep:geojson",
    "dep:jsonschema",
    "dep:nix",
    "dep:petgraph",
    "dep:polyline",
    "dep:proj",
    "dep:rayon",
    "dep:reqwest",
    "dep:rstar",
    "dep:rustls",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:veoveo-artifact-client",
    "dep:veoveo-duckdb-runtime",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]
mcp = [
    "runtime",
    "dep:axum",
    "dep:clap",
    "dep:dotenvy",
    "dep:rmcp",
    "dep:secrecy",
    "dep:tower-http",
    "dep:veoveo-mcp-apps-extension",
]

[dependencies]
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
# Match the workspace geo profile required by SurrealDB; contract validation needs no parallel engine.
geo = { version = "=0.32.0", default-features = false, features = ["serde"], optional = true }
geo-types = { workspace = true, optional = true }
geographiclib-rs = { workspace = true, optional = true }
geojson = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
polyline = { workspace = true, optional = true }
proj = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rstar = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Preserve the qualified lockfile version while isolating the contract's UUID features.
uuid = { version = "=1.25.0", default-features = false, features = ["serde", "std", "v5", "v7"], optional = true }
veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-duckdb-runtime = { path = "../../platform/runtimes/duckdb", optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
veoveo-optimization-mcp = { path = "../optimization-mcp", default-features = false, features = ["contract"] }
