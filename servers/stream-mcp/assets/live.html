<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>
<style>
:root{color-scheme:dark;--bg:#101012;--panel:#161618;--panel2:#1b1b1e;--ink:#eae6dc;--muted:#918c82;--cyan:#c2a15c;--green:#74a184;--amber:#bd8443;--red:#b5584f;--line:#2b2a2d;--hover:#5a564e;--mono:"SFMono-Regular",Consolas,"Liberation Mono",ui-monospace,monospace}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f4ef;--panel:#fffdf8;--panel2:#f6f3ec;--ink:#201e1a;--muted:#6f6a5f;--cyan:#8a6d2f;--green:#3f7354;--amber:#8a6430;--red:#96423b;--line:#ddd8cc;--hover:#c7c0af}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}#app{background:var(--panel)}
header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:15px;font-weight:600}.spacer{flex:1}.chip{border:1px solid var(--line);border-radius:0;padding:3px 8px;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}.chip.live{color:var(--green);border-color:#42594b}.chip.warn{color:var(--amber);border-color:#674b2b}
#controls{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1fr) auto auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}button,select{border:1px solid var(--line);border-radius:0;background:var(--panel2);color:var(--ink);padding:6px 8px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--hover)}button:disabled{opacity:.55;cursor:not-allowed}
#stage{position:relative;min-height:360px;aspect-ratio:16/9;background:#101012;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}#empty[hidden]{display:none}.hud{position:absolute;z-index:2;left:9px;right:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap}.hud span{background:#101012df;border:1px solid #3e3c38;border-radius:0;padding:3px 7px;color:#eae6dc;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
#detections{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}.metric{background:var(--panel2);padding:10px 12px}.metric b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}#error{margin:10px 12px;padding:9px;border:1px solid #573530;border-radius:0;background:#211416ed;color:#cf8b85}:root[data-theme="light"] #error{background:#f7ebe9;border-color:#dcbab4;color:#8a3a33}footer{padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:640px){#controls{grid-template-columns:1fr 1fr}#stage{min-height:240px}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Stream</h1><span id="status" class="chip">discovering</span><span id="decode" class="chip">H.264 decode —</span><span class="spacer"></span><span id="freshness" class="chip">frame age —</span></header>
  <section id="controls"><select id="pipeline" aria-label="Pipeline"></select><select id="sessions" aria-label="Live stream session"></select><button id="start" type="button">Start live session</button><button id="stop" type="button" disabled>Stop</button></section>
  <main id="stage"><canvas id="video"></canvas><canvas id="overlay"></canvas><div id="empty">Start or select a live Stream session.</div><div class="hud"><span id="session">no session</span><span id="ingress">ingress —</span><span id="recording">recording route off</span></div></main>
  <section id="detections"><div class="metric"><b id="frames">0</b><span>processed frames</span></div><div class="metric"><b id="objects">0</b><span>latest detections</span></div><div class="metric"><b id="dropped">0</b><span>dropped result frames</span></div></section>
  <div id="error" hidden></div><footer>Encoded video preview and typed overlays are owned by the selected Stream session.</footer>
</div>
<script>
"use strict";
const el=(id)=>document.getElementById(id);
const bridge=(()=>{let next=1;const pending=new Map(),handlers=new Map(),post=(message)=>parent.postMessage(message,"*");window.addEventListener("message",(event)=>{const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&(message.result!==undefined||message.error!==undefined)){const waiter=pending.get(message.id);if(!waiter)return;pending.delete(message.id);message.error?waiter.reject(new Error(message.error.message||"host error")):waiter.resolve(message.result);return;}const handler=handlers.get(message.method);if(handler)handler(message.params,message.id);});return{request:(method,params)=>new Promise((resolve,reject)=>{const id=next++;pending.set(id,{resolve,reject});post({jsonrpc:"2.0",id,method,params});}),notify:(method,params)=>post({jsonrpc:"2.0",method,params}),on:(method,handler)=>handlers.set(method,handler),post};})();
let sessions=[],selected=null,timer=null,lastHeight=0,tearingDown=false,decoder=null,decoderSession=null,decoderGeneration=0,lastSequence=-1,waitingForKeyframe=true,decodedFrames=0,refreshPromise=null,refreshAgain=false;
function structured(result){if(result&&(result.isError||result.is_error)){const content=Array.isArray(result.content)?result.content:[];throw new Error((content.find((item)=>item.type==="text")||{}).text||"tool failed");}return result&&(result.structuredContent||result.structured_content)||result;}
async function readJson(uri){const result=await bridge.request("resources/read",{uri}),content=result?.contents?.[0];if(!content||typeof content.text!=="string")throw new Error(`${uri} returned no JSON`);return JSON.parse(content.text);}
async function tool(name,args){return structured(await bridge.request("tools/call",{name,arguments:args}));}
function error(cause){el("error").textContent=cause instanceof Error?cause.message:String(cause);el("error").hidden=false;}function clear(){el("error").hidden=true;}
function status(text,kind=""){el("status").textContent=text;el("status").className=`chip ${kind}`;}
function report(){requestAnimationFrame(()=>{const height=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(height-lastHeight)<2)return;lastHeight=height;bridge.notify("ui/notifications/size-changed",{height});});}
function idOf(item){return item?.session_id??item?.sessionId??null;}function field(item,snake,camel){return item?.[snake]??item?.[camel];}
function updateSessionSelector(){const selector=el("sessions"),selectedId=idOf(selected);selector.replaceChildren(...sessions.map((item)=>new Option(`${item.pipeline_id||item.pipelineId} · ${item.lifecycle} · ${idOf(item).slice(-8)}`,idOf(item),false,idOf(item)===selectedId)));selector.disabled=sessions.length===0;}
function draw(results,preview={}){const canvas=el("overlay"),box=canvas.getBoundingClientRect(),scale=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(box.width*scale));canvas.height=Math.max(1,Math.round(box.height*scale));const context=canvas.getContext("2d");context.clearRect(0,0,canvas.width,canvas.height);const frame=results.frames.at(-1),detections=frame?.detections||[],width=selected?.video?.width||640,height=selected?.video?.height||480;context.lineWidth=2*scale;context.font=`${12*scale}px ui-sans-serif`;for(const item of detections){const x=item.bounds.x/width*canvas.width,y=item.bounds.y/height*canvas.height,w=item.bounds.width/width*canvas.width,h=item.bounds.height/height*canvas.height;context.strokeStyle="#c2a15c";context.fillStyle="#c2a15c";context.strokeRect(x,y,w,h);context.fillText(`${item.label}${item.confidence==null?"":` ${Math.round(item.confidence*100)}%`}`,x+3*scale,Math.max(14*scale,y-4*scale));}el("objects").textContent=String(detections.length);const processed=field(results,"processed_frames","processedFrames")||0,received=field(preview,"received_video_frames","receivedVideoFrames")||0;el("frames").textContent=String(processed);el("dropped").textContent=String(field(results,"dropped_result_frames","droppedResultFrames")||0);const observed=field(frame,"observed_at","observedAt");canvas.dataset.observedAt=observed||"";if(observed){const age=Math.max(0,Date.now()-Date.parse(observed));el("freshness").textContent=`frame age ${age} ms`;}else el("freshness").textContent=received?"streaming":"frame age —";}
function bytes(value){const raw=atob(value),output=new Uint8Array(raw.length);for(let index=0;index<raw.length;index++)output[index]=raw.charCodeAt(index);return output;}
function closeDecoder(){const current=decoder;decoder=null;if(current){try{current.close();}catch(_){}}}
function resetDecoder(sessionId){decoderGeneration+=1;closeDecoder();decoderSession=sessionId;lastSequence=-1;waitingForKeyframe=true;decodedFrames=0;const canvas=el("video"),context=canvas.getContext("2d");canvas.dataset.decodedFrames="0";context.clearRect(0,0,canvas.width,canvas.height);}
function recoverDecoder(cause,generation){if(generation!==decoderGeneration)return;decoderGeneration+=1;closeDecoder();lastSequence=-1;waitingForKeyframe=true;error(cause);status("decoder recovering","warn");}
async function configureDecoder(preview){if(typeof VideoDecoder==="undefined")throw new Error("WebCodecs H.264 decoding is required");const id=idOf(preview),generation=decoderGeneration,video=preview.video,bitrate=field(video,"expected_bitrate_bps","expectedBitrateBps"),framerate=field(video,"frame_rate","frameRate");const media=await navigator.mediaCapabilities.decodingInfo({type:"file",video:{contentType:`video/mp4; codecs="${video.codec}"`,width:video.width,height:video.height,bitrate,framerate}});if(!media.supported||!media.smooth)throw new Error("Supported, smooth H.264 decoding is required");const acceleration=media.powerEfficient?"prefer-hardware":"prefer-software",config={codec:video.codec,codedWidth:video.width,codedHeight:video.height,hardwareAcceleration:acceleration,optimizeForLatency:true};const support=await VideoDecoder.isConfigSupported(config);if(!support.supported)throw new Error(`H.264 ${video.codec} is not supported with ${acceleration}`);if(generation!==decoderGeneration||id!==decoderSession)return false;el("decode").textContent=media.powerEfficient?"hardware H.264 decode":"software H.264 decode";const canvas=el("video");canvas.width=video.width;canvas.height=video.height;canvas.dataset.codec=video.codec;canvas.dataset.sourceWidth=String(video.width);canvas.dataset.sourceHeight=String(video.height);canvas.dataset.expectedBitrateBps=String(bitrate);canvas.dataset.frameRate=String(framerate);canvas.dataset.hardwareAcceleration=acceleration;const next=new VideoDecoder({output:(frame)=>{try{if(generation!==decoderGeneration)return;canvas.getContext("2d").drawImage(frame,0,0,canvas.width,canvas.height);decodedFrames+=1;canvas.dataset.decodedFrames=String(decodedFrames);canvas.dataset.lastFrameAt=new Date().toISOString();el("empty").hidden=true;clear();status(selected?.lifecycle||"running",selected?.lifecycle==="running"?"live":"warn");}finally{frame.close();}},error:(cause)=>recoverDecoder(cause,generation)});if(generation!==decoderGeneration||id!==decoderSession){next.close();return false;}decoder=next;decoder.configure(config);return true;}
async function decodePreview(preview){const id=idOf(preview);if(decoderSession!==id)resetDecoder(id);if(!decoder&&!(await configureDecoder(preview)))return;const generation=decoderGeneration;for(const chunk of preview.chunks){if(chunk.sequence<=lastSequence)continue;if(lastSequence>=0&&chunk.sequence>lastSequence+1)waitingForKeyframe=true;if(waitingForKeyframe&&!chunk.keyframe)continue;try{decoder.decode(new EncodedVideoChunk({type:chunk.keyframe?"key":"delta",timestamp:chunk.timestamp_us,data:bytes(chunk.data_base64)}));lastSequence=chunk.sequence;waitingForKeyframe=false;}catch(cause){recoverDecoder(cause,generation);return;}}}
async function refresh(){if(tearingDown)return;try{sessions=await readJson("stream://sessions");const selectedId=idOf(selected);selected=sessions.find((item)=>idOf(item)===selectedId)||sessions.find((item)=>item.lifecycle==="running")||sessions.at(-1)||null;updateSessionSelector();if(!selected){status("waiting","warn");draw({frames:[]});return;}const id=idOf(selected),[results,preview]=await Promise.all([readJson(`stream://session/${id}/results`),readJson(`stream://session/${id}/preview`)]);el("session").textContent=`${id} · ${selected.lifecycle}`;const ingress=selected.ingress;el("ingress").textContent=`${ingress.host}:${ingress.port} · RTP/H.264`;const route=field(selected,"recording_output","recordingOutput");el("recording").textContent=route?`recording ${route.lifecycle} · ${field(route,"forwarded_video_frames","forwardedVideoFrames")} frames`:"recording route off";el("stop").disabled=selected.lifecycle!=="running";status(selected.lifecycle,selected.lifecycle==="running"?"live":"warn");await decodePreview(preview);draw(results,preview);}catch(cause){error(cause);status("unavailable","warn");}}
function scheduleRefresh(){if(tearingDown)return Promise.resolve();if(refreshPromise){refreshAgain=true;return refreshPromise;}refreshPromise=(async()=>{do{refreshAgain=false;await refresh();}while(refreshAgain&&!tearingDown);})().finally(()=>{refreshPromise=null;});return refreshPromise;}
async function loadPipelines(){const pipelines=await readJson("stream://pipelines");el("pipeline").replaceChildren(...pipelines.filter((item)=>item.supportsLiveInput||item.supports_live_input).map((item)=>new Option(item.title,item.id)));}
el("start").addEventListener("click",async()=>{try{clear();const output=await tool("start_live_session",{pipeline_id:el("pipeline").value});selected={session_id:idOf(output),lifecycle:"running"};await scheduleRefresh();}catch(cause){error(cause);}});
el("sessions").addEventListener("change",()=>{selected=sessions.find((item)=>idOf(item)===el("sessions").value)||null;resetDecoder(idOf(selected));void scheduleRefresh();});
el("stop").addEventListener("click",async()=>{if(!selected)return;try{clear();await tool("stop_live_session",{session_id:idOf(selected)});await scheduleRefresh();}catch(cause){error(cause);}});
bridge.on("ui/notifications/tool-result",()=>void scheduleRefresh());bridge.on("ui/notifications/host-context-changed",(params)=>{const value=params?.hostContext||params;if(value&&(value.theme==="light"||value.theme==="dark"))document.documentElement.dataset.theme=value.theme;});bridge.on("ui/resource-teardown",(_params,id)=>{tearingDown=true;clearInterval(timer);resetDecoder(null);if(id!==undefined)bridge.post({jsonrpc:"2.0",id,result:{}});});
new ResizeObserver(report).observe(el("app"));window.addEventListener("resize",()=>{report();void scheduleRefresh();});
(async()=>{try{await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"stream-live",version:"1.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});bridge.notify("ui/notifications/initialized",{});if(!navigator.mediaCapabilities?.decodingInfo)throw new Error("Media Capabilities H.264 verification is required");await loadPipelines();await scheduleRefresh();timer=setInterval(()=>void scheduleRefresh(),250);report();}catch(cause){error(cause);status("failed","warn");}})();
</script>
</body>
</html>
