[package]
name = "veoveo-stream-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.veoveo]
image-asset-inputs = ["servers/stream-mcp/assets/live.html"]

[lib]
name = "veoveo_stream_mcp"
path = "src/lib.rs"

[[bin]]
name = "stream-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[features]
schema = ["dep:veoveo-modules"]
default = ["mcp"]
contract = [
    "dep:thiserror",
    "dep:veoveo-recording-mcp",
    "dep:base64",
    "dep:chrono",
    "dep:uuid",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:veoveo-artifact-contract",
    "dep:veoveo-recording-video",
    "dep:veoveo-types",
]
runtime = [
    "contract",
    "veoveo-recording-video/runtime",
    "dep:anyhow",
    "chrono/clock",
    "dep:tempfile",
    "dep:tokio",
    "dep:re_sdk",
    "dep:re_sdk_types",
    "dep:re_log_types",
    "dep:veoveo-artifact-client",
    "dep:veoveo-mcp-contract",
]
mcp = [
    "schema",
    "dep:surrealdb",
    "runtime",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:tokio-util",
    "dep:tracing",
    "dep:veoveo-mcp-apps-extension",
    "dep:veoveo-platform-store",
    "dep:veoveo-recording-reader",
    "dep:veoveo-task-runtime",
]

[dependencies]
veoveo-modules = { workspace = true, optional = true }
surrealdb = { version = "=3.3.0", default-features = false, optional = true }
thiserror = { workspace = true, optional = true }
veoveo-recording-mcp = { path = "../recording-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full", "process"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

re_sdk = { workspace = true, optional = true }
re_sdk_types = { workspace = true, optional = true }
re_log_types = { workspace = true, optional = true }

veoveo-artifact-client = { path = "../../platform/artifacts/client", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-recording-reader = { workspace = true, optional = true }
veoveo-recording-video = { path = "../../platform/recordings/video", default-features = false, features = ["contract"], optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-mcp-contract = { workspace = true, features = ["testing"] }
veoveo-gateway-catalog.workspace = true
rmcp = { workspace = true, features = ["client"] }
