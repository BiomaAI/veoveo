<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Monitor</title>
<style>
:root{color-scheme:dark;--bg:#101012;--panel:#161618;--panel2:#1b1b1e;--ink:#eae6dc;--muted:#918c82;--cyan:#c2a15c;--green:#74a184;--amber:#bd8443;--red:#c96f67;--line:#2b2a2d;--hover:#5a564e;--mono:"SFMono-Regular",Consolas,"Liberation Mono",ui-monospace,monospace}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f4ef;--panel:#fffdf8;--panel2:#f6f3ec;--ink:#201e1a;--muted:#6f6a5f;--cyan:#8a6d2f;--green:#3f7354;--amber:#8a6430;--red:#96423b;--line:#ddd8cc;--hover:#c7c0af}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}#app{background:var(--panel)}
header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:15px;font-weight:600}.spacer{flex:1}.chip{border:1px solid var(--line);border-radius:0;padding:3px 8px;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}.chip.live{color:var(--green);border-color:#42594b}.chip.warn{color:var(--amber);border-color:#674b2b}
#controls{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1fr) auto auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}button,select{border:1px solid var(--line);border-radius:0;background:var(--panel2);color:var(--ink);padding:6px 8px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--hover)}button:disabled{opacity:.55;cursor:not-allowed}
.paging{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}.paging span{color:var(--muted)}
#stage{position:relative;min-height:360px;aspect-ratio:16/9;background:#101012;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}#empty[hidden]{display:none}.hud{position:absolute;z-index:2;left:9px;right:9px;top:9px;display:flex;gap:6px;flex-wrap:wrap}.hud span{background:#101012df;border:1px solid #3e3c38;border-radius:0;padding:3px 7px;color:#eae6dc;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
#detections{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}.metric{background:var(--panel2);padding:10px 12px}.metric b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}#error{margin:10px 12px;padding:9px;border:1px solid #573530;border-radius:0;background:#211416ed;color:#cf8b85}:root[data-theme="light"] #error{background:#f7ebe9;border-color:#dcbab4;color:#8a3a33}footer{padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:640px){#controls{grid-template-columns:1fr 1fr}#stage{min-height:240px}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Live Monitor</h1><span id="status" class="chip">discovering</span><span id="decode" class="chip">H.264 decode —</span><span class="spacer"></span><span id="freshness" class="chip">frame age —</span></header>
  <section id="controls"><select id="pipeline" aria-label="Pipeline"></select><select id="sessions" aria-label="Live stream session"></select><button id="start" type="button" disabled>Start live session</button><button id="stop" type="button" disabled>Stop</button></section>
  <nav class="paging" aria-label="Session pages"><button id="page-newer" type="button" disabled>Newer sessions</button><span id="page-status" aria-live="polite">Page 1</span><button id="page-older" type="button" disabled>Older sessions</button></nav>
  <main id="stage"><canvas id="video"></canvas><canvas id="overlay"></canvas><div id="empty">Start or select a live Stream session.</div><div class="hud"><span id="session">no session</span><span id="ingress">input —</span><span id="recording">recording route off</span></div></main>
  <section id="detections"><div class="metric"><b id="frames">0</b><span>processed frames</span></div><div class="metric"><b id="objects">0</b><span>latest detections</span></div><div class="metric"><b id="dropped">0</b><span>dropped result frames</span></div></section>
  <div id="error" hidden></div><footer>Video and detection overlays come from the selected Stream session.</footer>
</div>
<script>/*__VEOVEO_APP_BUNDLE__*/</script>
</body>
</html>
