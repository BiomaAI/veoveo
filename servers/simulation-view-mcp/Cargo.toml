[package]
name = "veoveo-simulation-view-mcp"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "veoveo_simulation_view_mcp"
path = "src/lib.rs"

[[bin]]
name = "simulation-view-mcp"
path = "src/bin/server.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension" }
veoveo-mcp-contract.workspace = true
veoveo-simulation-pose.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tower = { workspace = true, features = ["util"] }
