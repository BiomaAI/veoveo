[package]
name = "veoveo-uav-sim-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_uav_sim_mcp"
path = "src/lib.rs"

[[bin]]
name = "uav-sim-mcp"
path = "src/bin/server.rs"
required-features = ["mcp"]

[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "control_plane_registration"
required-features = ["mcp"]

[features]
schema = ["dep:veoveo-modules", "dep:veoveo-types", "dep:serde", "dep:schemars"]
default = ["mcp"]
contract = [
    "dep:veoveo-recording-contract",
    "dep:chrono",
    "dep:hex",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
    "dep:veoveo-types",
    "dep:veoveo-map-mcp",
    "dep:veoveo-frames-mcp",
]
runtime = ["dep:veoveo-recording-store",
    "dep:veoveo-agent-runtime",
    "schema",
    "contract",
    "chrono/clock",
    "dep:anyhow",
    "dep:reqwest",
    "dep:secrecy",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:veoveo-platform-store",
    "dep:veoveo-mcp-contract",
]
mcp = [
    "dep:veoveo-audit",
    "runtime",
    "dep:base64",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:getrandom",
    "dep:rmcp",
    "dep:rustls",
    "dep:sha2",
    "dep:subtle",
    "dep:surrealdb",
    "dep:tokio-util",
    "dep:veoveo-mcp-apps-extension",
    "dep:veoveo-task-runtime",
]

[dependencies]
veoveo-recording-store = { workspace = true, default-features = false, features = ["persistence"], optional = true }
veoveo-agent-runtime = { workspace = true, default-features = false, features = ["schema"], optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }
veoveo-audit = { workspace = true, optional = true }
veoveo-recording-contract = { workspace = true, optional = true }
veoveo-map-mcp = { path = "../map-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-frames-mcp = { path = "../frames-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"], optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
surrealdb = { version = "=3.3.0", default-features = false, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
veoveo-agent-runtime = { workspace = true, default-features = false, features = ["persistence"] }
veoveo-map-mcp = { path = "../map-mcp", default-features = false, features = ["schema", "contract"] }
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-mcp-contract = { workspace = true, features = ["testing"] }
veoveo-gateway-catalog.workspace = true
veoveo-gateway-contract.workspace = true
axum.workspace = true
