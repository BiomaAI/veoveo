[package]
name = "veoveo-uav-sim-mcp"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "veoveo_uav_sim_mcp"
path = "src/lib.rs"

[[bin]]
name = "uav-sim-mcp"
path = "src/bin/server.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
rustls.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb = { version = "=3.2.1", default-features = false }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
veoveo-mcp-contract.workspace = true
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension" }
veoveo-platform-store = { path = "../../platform/store" }
veoveo-task-runtime = { path = "../../platform/task-runtime" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
veoveo-map-mcp = { path = "../map-mcp" }

[build-dependencies]
sha2.workspace = true
