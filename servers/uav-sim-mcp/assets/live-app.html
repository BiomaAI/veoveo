<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAV live cameras</title>
<style>
:root{color-scheme:dark;--bg:#071015;--panel:#0c1b23;--ink:#e9f7fb;--muted:#88a7b3;--cyan:#66e4ff;--green:#75dfa4;--red:#ff8b86;--line:#21404b}:root[data-theme="light"]{color-scheme:light;--bg:#eaf2f4;--panel:#fff;--ink:#102a33;--muted:#5a747d;--cyan:#08788f;--green:#167449;--red:#a2312c;--line:#c5d8dd}*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}#app{background:var(--panel)}header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}h1{font-size:15px;margin:0}.spacer{flex:1}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted)}.chip.live{color:var(--green)}#choices{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}label{display:flex;align-items:center;gap:5px;color:var(--muted)}input{accent-color:var(--cyan)}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}.view{position:relative;min-width:0;aspect-ratio:16/9;background:#020608}.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.bar,.stats{position:absolute;z-index:2;left:8px;right:8px;display:flex;gap:6px}.bar{top:8px}.stats{bottom:8px}.bar span,.stats span,.bar button{background:#071015d9;color:#dcebf0;border:1px solid #29434d;border-radius:999px;padding:3px 7px}.bar button{margin-left:auto;cursor:pointer}.placeholder{min-height:230px;display:grid;place-items:center;color:var(--muted)}#error{margin:10px 12px;padding:9px;border:1px solid #8c4845;border-radius:6px;color:#ffd6d2;background:#401b1bed}footer{display:flex;gap:12px;padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:720px){#grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"><header><h1>UAV live cameras</h1><span id="decode" class="chip">NVIDIA NVENC · H.264</span><span id="status" class="chip">discovering</span><span class="spacer"></span><span id="count" class="chip">0 views</span></header><section id="choices"></section><main id="grid"><div class="placeholder">Discovering authoritative simulator cameras…</div></main><div id="error" hidden></div><footer><span id="session">No simulation session</span><span class="spacer"></span><span>one render and encode per camera</span></footer></div>
<script>/*__NVIDIA_OV_WEB_RTC__*/</script>
<script>
"use strict";
const $=id=>document.getElementById(id),bridge=(()=>{let id=1;const waiting=new Map(),handlers=new Map();const post=m=>parent.postMessage(m,"*");addEventListener("message",event=>{const m=event.data;if(!m||m.jsonrpc!=="2.0")return;if(m.id!==undefined&&(m.result!==undefined||m.error!==undefined)){const w=waiting.get(m.id);if(!w)return;waiting.delete(m.id);m.error?w.reject(new Error(m.error.message||"host error")):w.resolve(m.result);return;}const h=handlers.get(m.method);if(h)h(m.params,m.id);else if(m.id!==undefined)post({jsonrpc:"2.0",id:m.id,error:{code:-32601,message:"method not found"}});});return{request:(method,params)=>new Promise((resolve,reject)=>{const requestId=id++;waiting.set(requestId,{resolve,reject});post({jsonrpc:"2.0",id:requestId,method,params});}),notify:(method,params)=>post({jsonrpc:"2.0",method,params}),on:(method,handler)=>handlers.set(method,handler),post};})();
const viewerInstanceId=crypto.randomUUID(),selected=new Set(),players=new Map();let sessionId=null,cameras=[],closing=false,lastHeight=0;
function structured(result){if(result&&(result.isError||result.is_error))throw new Error(result.content?.find(v=>v.type==="text")?.text||"MCP tool failed");return result?.structuredContent||result?.structured_content||result;}
async function call(name,args){return structured(await bridge.request("tools/call",{name,arguments:args}));}
async function read(uri){const result=await bridge.request("resources/read",{uri}),item=result?.contents?.[0];if(!item||typeof item.text!=="string")throw new Error(`resource ${uri} returned no JSON`);return JSON.parse(item.text);}
function error(cause){$("error").textContent=String(cause?.message||cause).replace(/Bearer\s+\S+/gi,"Bearer [redacted]").slice(0,300);$("error").hidden=false;}
function clearError(){$("error").hidden=true;$("error").textContent="";}
function status(){$("count").textContent=`${players.size} view${players.size===1?"":"s"}`;$("status").textContent=players.size?"live":"ready";$("status").classList.toggle("live",players.size>0);}
function reportSize(){requestAnimationFrame(()=>{const height=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(height-lastHeight)<2)return;lastHeight=height;bridge.notify("ui/notifications/size-changed",{height});});}
async function verifyDecode(stream){if(!navigator.mediaCapabilities?.decodingInfo)throw new Error("The browser cannot assess smooth H.264 decoding");const result=await navigator.mediaCapabilities.decodingInfo({type:"webrtc",video:{contentType:'video/H264; codecs="avc1.42E01E"',width:stream.widthPx,height:stream.heightPx,bitrate:8000000,framerate:stream.frameRateMillihertz/1000}});if(!result.supported||!result.smooth)throw new Error("Supported, smooth H.264 decoding is required");$("decode").textContent=result.powerEfficient?"NVIDIA NVENC · hardware H.264 decode":"NVIDIA NVENC · software H.264 decode";}
function node(camera){const section=document.createElement("section");section.className="view";section.id=`view-${camera.cameraId}`;section.innerHTML=`<video id="video-${camera.cameraId}" autoplay muted playsinline></video><div class="empty">Opening authoritative camera…</div><div class="bar"><span>${camera.cameraId}</span><span class="health">starting</span><button type="button">Close</button></div><div class="stats"><span>${camera.widthPx}×${camera.heightPx}</span><span>${camera.frameRateMillihertz/1000} fps</span><span>NVIDIA NVENC</span></div>`;section.querySelector("button").onclick=()=>{selected.delete(camera.cameraId);void close(camera.cameraId,true);renderChoices();};$("grid").append(section);return section;}
function productQuery(stream){return new URLSearchParams({live_view_id:stream.liveViewId});}
async function open(camera){if(players.has(camera.cameraId)||closing)return;$("grid").querySelector(".placeholder")?.remove();const section=node(camera),player={connection:null,streamer:null,renew:null};players.set(camera.cameraId,player);status();try{player.connection=await call("open_live_view",{sessionId,cameraId:camera.cameraId,viewerInstanceId});const stream=player.connection.stream,endpoint=stream.endpoint,signal=new URL(endpoint.signalingUrl),OV=globalThis.OVWebRTC;if(!OV||globalThis.__VEOVEO_WEBRTC_STUB__)throw new Error("NVIDIA WebRTC client is unavailable in this build");await verifyDecode(stream);player.streamer=new OV.AppStreamer();await player.streamer.connect({streamSource:OV.StreamType.DIRECT,logLevel:OV.LogLevel.WARN,streamConfig:{accessToken:player.connection.accessToken,authenticate:true,autoLaunch:true,videoElementId:`video-${camera.cameraId}`,sessionId:stream.streamProductId,signalingServer:signal.hostname,signalingPort:Number(signal.port||443),signalingPath:signal.pathname,signalingQuery:productQuery(stream),mediaServer:endpoint.mediaHost,mediaPort:endpoint.mediaPort,forceWSS:signal.protocol==="wss:",width:stream.widthPx,height:stream.heightPx,fps:stream.frameRateMillihertz/1000,codec:OV.VideoCodec.H264,localizeTextInput:false,mic:false,nativeTouchEvents:false,onStart:event=>{if(players.get(camera.cameraId)!==player)return;if(event?.status===OV.EventStatus.SUCCESS){section.querySelector(".empty").hidden=true;section.querySelector(".health").textContent="live";clearError();}else if(event?.status===OV.EventStatus.ERROR||event?.status===OV.EventStatus.CANCELED){error("Authoritative camera signaling failed");}},onStop:()=>{if(!closing&&players.get(camera.cameraId)===player)error("Authoritative camera stream stopped");}}});armRenew(camera.cameraId);}catch(cause){error(cause);await close(camera.cameraId,false);}}
function armRenew(cameraId){const player=players.get(cameraId);if(!player?.connection)return;clearTimeout(player.renew);const stream=player.connection.stream,delay=Math.max(0,Date.parse(stream.expiresAt)-Date.now()-Math.min(30000,(Date.parse(stream.expiresAt)-Date.now())/3));player.renew=setTimeout(async()=>{try{player.connection=await call("renew_live_view",{sessionId,liveViewId:stream.liveViewId,viewerInstanceId});armRenew(cameraId);}catch(cause){error(cause);await close(cameraId,false);}},delay);}
async function close(cameraId,remove){const player=players.get(cameraId);players.delete(cameraId);if(player){clearTimeout(player.renew);try{player.streamer?.terminate();}catch(_){}if(player.connection){try{await call("close_live_view",{sessionId,liveViewId:player.connection.stream.liveViewId,viewerInstanceId});}catch(cause){if(!closing)error(cause);}}}if(remove)$("view-"+cameraId)?.remove();if(!players.size&&!selected.size)$("grid").innerHTML='<div class="placeholder">Select an authoritative camera.</div>';status();reportSize();}
function renderChoices(){$("choices").replaceChildren(...cameras.map(camera=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=selected.has(camera.cameraId);input.disabled=camera.streamPolicy==="disabled";input.onchange=()=>{if(input.checked){selected.add(camera.cameraId);void open(camera);}else{selected.delete(camera.cameraId);void close(camera.cameraId,true);}};label.append(input,document.createTextNode(`${camera.cameraId} · ${camera.rig.kind}`));return label;}));reportSize();}
async function discover(){const sessions=await read("uav-sim://sessions"),first=sessions[0];if(!first)throw new Error("No simulation session is available");sessionId=first.session_id;$("session").textContent=`session ${sessionId}`;cameras=await call("list_live_cameras",{session_id:sessionId});renderChoices();status();}
bridge.on("ui/notifications/resource-updated",params=>{const uri=params?.uri||params;if(typeof uri==="string"&&sessionId&&uri.startsWith(`uav-sim://session/${sessionId}/live-`))void discover().catch(error);});
bridge.on("ui/notifications/host-context-changed",params=>{const theme=(params?.hostContext||params)?.theme;if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme;});
bridge.on("ui/resource-teardown",(_params,id)=>{closing=true;void Promise.all([...players.keys()].map(camera=>close(camera,true))).finally(()=>{if(id!==undefined)bridge.post({jsonrpc:"2.0",id,result:{}});});});
new ResizeObserver(reportSize).observe($("app"));
(async()=>{try{await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"uav-sim-live",version:"2.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});bridge.notify("ui/notifications/initialized",{});await discover();reportSize();}catch(cause){error(cause);$("status").textContent="unavailable";}})();
</script></body></html>
