<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAV live cameras</title>
<style>
:root{color-scheme:dark;--bg:#101012;--panel:#161618;--ink:#eae6dc;--muted:#918c82;--cyan:#c2a15c;--green:#74a184;--red:#c96f67;--line:#2b2a2d;--hover:#5a564e;--mono:"SFMono-Regular",Consolas,"Liberation Mono",ui-monospace,monospace}:root[data-theme="light"]{color-scheme:light;--bg:#f6f4ef;--panel:#fffdf8;--ink:#201e1a;--muted:#6f6a5f;--cyan:#8a6d2f;--green:#3f7354;--red:#96423b;--line:#ddd8cc;--hover:#c7c0af}*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}#app{background:var(--panel)}header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}h1{font-size:15px;margin:0;font-weight:600}.spacer{flex:1}.chip{border:1px solid var(--line);border-radius:0;padding:3px 8px;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}.chip.live{color:var(--green)}#choices{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}label{display:flex;align-items:center;gap:5px;color:var(--muted)}input{accent-color:var(--cyan)}#commands{display:none;grid-template-columns:minmax(130px,180px) minmax(220px,1fr) auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}#commands.available{display:grid}#commands select,#commands input,#commands button{min-width:0;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);padding:8px}#commands button{cursor:pointer;color:var(--cyan)}#commands button:hover{border-color:var(--hover)}#command-result{grid-column:1/-1;color:var(--muted);min-height:1.2em}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}.view{position:relative;min-width:0;aspect-ratio:16/9;background:#101012}.view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.bar,.stats{position:absolute;z-index:2;left:8px;right:8px;display:flex}.bar{top:8px;gap:6px;flex-wrap:wrap}.stats{bottom:8px;gap:4px;flex-wrap:nowrap;overflow:hidden;font:9px/1.3 var(--mono);font-variant-numeric:tabular-nums}.bar span,.stats span,.bar button{background:#101012d9;color:#eae6dc;border:1px solid #3e3c38;border-radius:0;padding:3px 7px}.bar span,.bar button{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}.stats span{padding:2px 5px;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}.stats .requested{flex:0 0 142px}.stats .decoded{flex:0 0 142px}.stats .age{flex:0 0 76px}.stats .transport{flex:0 0 140px}.stats .encoder{flex:0 0 65px}.bar button{margin-left:auto;cursor:pointer}.placeholder{min-height:230px;display:grid;place-items:center;color:var(--muted)}#error{margin:10px 12px;padding:9px;border:1px solid #573530;border-radius:0;color:#cf8b85;background:#211416ed}:root[data-theme="light"] #error{background:#f7ebe9;border-color:#dcbab4;color:#8a3a33}footer{display:flex;gap:12px;padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}footer a{color:var(--cyan)}@media(max-width:720px){#commands{grid-template-columns:1fr}#command-result{grid-column:1}#grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"><header><h1>UAV live cameras</h1><span id="decode" class="chip">NVIDIA NVENC · H.264</span><span id="status" class="chip">discovering</span><span class="spacer"></span><span id="count" class="chip">0 views</span></header><section id="choices"></section><form id="commands"><select id="agent" aria-label="Agent"></select><input id="command" maxlength="16384" placeholder="Tell this agent where to fly…" aria-label="Instruction"><button type="submit">Send instruction</button><output id="command-result"></output></form><main id="grid"><div class="placeholder">Discovering authoritative simulator cameras…</div></main><div id="error" hidden></div><footer><span id="session">No simulation session</span><span class="spacer"></span><a href="https://www.google.com/help/terms_maps/" target="_blank" rel="noreferrer">Google Photorealistic 3D Tiles</a><span>one native render and encode per camera · shared across viewers</span></footer></div>
<script>
"use strict";
const $=id=>document.getElementById(id),STREAM_PROTOCOL="veoveo.h264.annexb.v1",CODEC="avc1.42E01E",bridge=(()=>{let id=1;const waiting=new Map(),handlers=new Map();const post=m=>parent.postMessage(m,"*");addEventListener("message",event=>{const m=event.data;if(!m||m.jsonrpc!=="2.0")return;if(m.id!==undefined&&(m.result!==undefined||m.error!==undefined)){const w=waiting.get(m.id);if(!w)return;waiting.delete(m.id);m.error?w.reject(new Error(m.error.message||"host error")):w.resolve(m.result);return;}const h=handlers.get(m.method);if(h)h(m.params,m.id);else if(m.id!==undefined)post({jsonrpc:"2.0",id:m.id,error:{code:-32601,message:"method not found"}});});return{request:(method,params)=>new Promise((resolve,reject)=>{const requestId=id++;waiting.set(requestId,{resolve,reject});post({jsonrpc:"2.0",id:requestId,method,params});}),notify:(method,params)=>post({jsonrpc:"2.0",method,params}),on:(method,handler)=>handlers.set(method,handler),post};})();
const MAX_RECOVERY_BACKOFF_ATTEMPT=8,viewerInstanceId=crypto.randomUUID(),selected=new Set(),players=new Map(),recoveries=new Map();let sessionId=null,cameras=[],closing=false,lastHeight=0,subscribedUri=null,decodeLabel=null;
function uuidV7(){const bytes=crypto.getRandomValues(new Uint8Array(16));let timestamp=BigInt(Date.now());for(let index=5;index>=0;index-=1){bytes[index]=Number(timestamp&255n);timestamp>>=8n;}bytes[6]=(bytes[6]&15)|112;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");return`${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;}
function configureAgents(initialized){const targets=initialized?.hostContext?._meta?.["io.veoveo/agent-message-targets"];$('agent').replaceChildren();if(!Array.isArray(targets)||!targets.length)return;for(const target of targets){if(typeof target!=="string")continue;const option=document.createElement("option");option.value=target;option.textContent=target;$('agent').append(option);}if($('agent').options.length)$('commands').classList.add('available');reportSize();}
async function sendInstruction(event){event.preventDefault();const agentId=$('agent').value,message=$('command').value.trim();if(!agentId||!message)return;$('command-result').textContent="Sending…";try{await bridge.request("veoveo/agents/message",{agentId,requestId:uuidV7(),message});$('command').value="";$('command-result').textContent=`Instruction queued for ${agentId}.`;}catch(cause){$('command-result').textContent=String(cause?.message||cause).slice(0,200);}}
$('commands').addEventListener('submit',sendInstruction);
const fixedFps=value=>String(Math.max(0,Math.round(value))).padStart(2,"0");
function structured(result){if(result&&(result.isError||result.is_error))throw new Error(result.content?.find(value=>value.type==="text")?.text||"MCP tool failed");return result?.structuredContent||result?.structured_content||result;}
async function call(name,args){if(name==="open_live_view")await ensureSubscription();return structured(await bridge.request("tools/call",{name,arguments:args}));}
async function read(uri){const result=await bridge.request("resources/read",{uri}),item=result?.contents?.[0];if(!item||typeof item.text!=="string")throw new Error(`resource ${uri} returned no JSON`);return JSON.parse(item.text);}
function error(cause){$("error").textContent=String(cause?.message||cause).replace(/Bearer\s+\S+/gi,"Bearer [redacted]").slice(0,300);$("error").hidden=false;}
function clearError(){$("error").hidden=true;$("error").textContent="";}
function status(){$("count").textContent=`${players.size} view${players.size===1?"":"s"}`;$("status").textContent=recoveries.size?"reconnecting":(players.size?"live":"ready");$("status").classList.toggle("live",players.size>0&&!recoveries.size);}
function reportSize(){requestAnimationFrame(()=>{const height=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(height-lastHeight)<2)return;lastHeight=height;bridge.notify("ui/notifications/size-changed",{height});});}
async function decoderConfig(stream){if(typeof VideoDecoder==="undefined"||!navigator.mediaCapabilities?.decodingInfo)throw new Error("WebCodecs H.264 decoding is required");const media=await navigator.mediaCapabilities.decodingInfo({type:"file",video:{contentType:`video/mp4; codecs="${CODEC}"`,width:stream.widthPx,height:stream.heightPx,bitrate:8000000,framerate:stream.frameRateMillihertz/1000}});if(!media.supported||!media.smooth)throw new Error("Supported, smooth H.264 decoding is required");const hardwareAcceleration=media.powerEfficient?"prefer-hardware":"prefer-software",config={codec:CODEC,codedWidth:stream.widthPx,codedHeight:stream.heightPx,hardwareAcceleration,optimizeForLatency:true};const support=await VideoDecoder.isConfigSupported(config);if(!support.supported)throw new Error(`H.264 ${CODEC} is unavailable with ${hardwareAcceleration}`);decodeLabel=media.powerEfficient?"NVIDIA NVENC · hardware H.264 decode":"NVIDIA NVENC · software H.264 decode";$("decode").textContent=decodeLabel;return config;}
function smoothing(camera){const value=camera.rig?.smoothing;return value?`smooth T${value.translationHalfLifeMs}/R${value.rotationHalfLifeMs} ms`:"exact pose";}
function node(camera){const section=document.createElement("section");section.className="view";section.id=`view-${camera.cameraId}`;section.innerHTML=`<canvas id="video-${camera.cameraId}" aria-label="${camera.cameraId} live video"></canvas><div class="empty">Opening authoritative camera…</div><div class="bar"><span>${camera.cameraId}</span><span class="health">${camera.health}</span><span>${smoothing(camera)}</span><button type="button">Close</button></div><div class="stats"><span class="requested">source ${camera.widthPx}×${camera.heightPx} · ${fixedFps(camera.frameRateMillihertz/1000)} fps</span><span class="decoded">video pending</span><span class="age">age pending</span><span class="transport">H.264 starting</span><span class="encoder">NVENC</span></div>`;section.querySelector("button").onclick=()=>{selected.delete(camera.cameraId);void close(camera.cameraId,true);renderChoices();};$("grid").append(section);return section;}
function identify(section,stream){section.dataset.viewerInstanceId=viewerInstanceId;section.dataset.liveViewId=stream.liveViewId;section.dataset.streamProductId=stream.streamProductId;}
function keyframe(bytes){for(let index=0;index+4<bytes.length;index+=1){let start=0;if(bytes[index]===0&&bytes[index+1]===0&&bytes[index+2]===1)start=index+3;else if(bytes[index]===0&&bytes[index+1]===0&&bytes[index+2]===0&&bytes[index+3]===1)start=index+4;if(start&&(bytes[start]&31)===5)return true;}return false;}
function configureDecoder(camera,section,player,stream,config){const canvas=section.querySelector("canvas"),context=canvas.getContext("2d",{alpha:false});if(!context)throw new Error("2D GPU-composited video canvas is unavailable");canvas.width=stream.widthPx;canvas.height=stream.heightPx;canvas.dataset.codec=CODEC;canvas.dataset.sourceWidth=String(stream.widthPx);canvas.dataset.sourceHeight=String(stream.heightPx);canvas.dataset.frameRate=String(stream.frameRateMillihertz/1000);canvas.dataset.decodedFrames="0";canvas.dataset.droppedFrames="0";canvas.dataset.mediaTimeSeconds="0";canvas.dataset.receiveToDisplayMs="0";player.decoder=new VideoDecoder({output:frame=>{try{if(players.get(camera.cameraId)!==player)return;context.drawImage(frame,0,0,canvas.width,canvas.height);const now=performance.now(),receiveToDisplayMs=Math.max(0,now-player.lastReceivedAt);player.decodedFrames+=1;player.presentedAt.push(now);while(player.presentedAt.length&&now-player.presentedAt[0]>1000)player.presentedAt.shift();canvas.dataset.decodedFrames=String(player.decodedFrames);canvas.dataset.lastFrameAt=String(now);canvas.dataset.mediaTimeSeconds=String(frame.timestamp/1000000);canvas.dataset.receiveToDisplayMs=String(receiveToDisplayMs);canvas.dataset.decodeQueueSize=String(player.decoder.decodeQueueSize);section.querySelector(".empty").hidden=true;section.querySelector(".health").textContent="live";section.querySelector(".decoded").textContent=`video ${canvas.width}×${canvas.height} · ${fixedFps(player.presentedAt.length)} fps`;section.querySelector(".age").textContent=`age ${Math.round(receiveToDisplayMs)} ms`;section.querySelector(".transport").textContent="shared H.264 live";cancelRecovery(camera.cameraId);clearError();}finally{frame.close();}},error:cause=>{if(players.get(camera.cameraId)===player)void recover(camera.cameraId,cause);}});player.decoder.configure(config);}
function connectSocket(camera,section,player,stream,token){const url=new URL(stream.endpoint.streamUrl);url.searchParams.set("live_view_id",stream.liveViewId);const socket=new WebSocket(url,[STREAM_PROTOCOL,`authorization.bearer.${token}`]);player.socket=socket;socket.binaryType="arraybuffer";socket.onopen=()=>{if(players.get(camera.cameraId)!==player)return;section.querySelector(".transport").textContent="shared H.264 connected";};socket.onmessage=event=>{if(players.get(camera.cameraId)!==player||!(event.data instanceof ArrayBuffer))return;const bytes=new Uint8Array(event.data),isKey=keyframe(bytes);if(player.waitingForKeyframe&&!isKey)return;player.waitingForKeyframe=false;player.lastReceivedAt=performance.now();const timestamp=Math.round(player.chunkSequence*1000000000/stream.frameRateMillihertz);player.chunkSequence+=1;try{player.decoder.decode(new EncodedVideoChunk({type:isKey?"key":"delta",timestamp,data:bytes}));}catch(cause){void recover(camera.cameraId,cause);}};socket.onerror=()=>{section.querySelector(".transport").textContent="H.264 transport failed";};socket.onclose=()=>{if(!closing&&players.get(camera.cameraId)===player)void recover(camera.cameraId,"Authoritative camera stream stopped");};}
function cancelRecovery(cameraId){const recovery=recoveries.get(cameraId);if(recovery?.timer!=null)clearTimeout(recovery.timer);recoveries.delete(cameraId);status();}
function scheduleRecovery(cameraId,cause){if(closing||!selected.has(cameraId))return;const prior=recoveries.get(cameraId),attempt=(prior?.attempt??0)+1;if(prior?.timer!=null)clearTimeout(prior.timer);const recoveryState={attempt,timer:null};recoveries.set(cameraId,recoveryState);const delay=Math.min(5000,250*2**Math.min(attempt-1,MAX_RECOVERY_BACKOFF_ATTEMPT));error(attempt>MAX_RECOVERY_BACKOFF_ATTEMPT?"Camera recovery is waiting for simulator readiness":cause);recoveryState.timer=setTimeout(()=>{recoveryState.timer=null;if(closing||!selected.has(cameraId)){cancelRecovery(cameraId);return;}const camera=cameras.find(value=>value.cameraId===cameraId);if(camera)void open(camera);},delay);status();}
function retrySelectedNow(){for(const cameraId of selected){const recoveryState=recoveries.get(cameraId);if(!recoveryState)continue;if(recoveryState.timer!==null)clearTimeout(recoveryState.timer);recoveries.delete(cameraId);const camera=cameras.find(value=>value.cameraId===cameraId);if(camera&&!players.has(cameraId))void open(camera);}status();}
async function open(camera){if(players.has(camera.cameraId)||closing)return;$("grid").querySelector(".placeholder")?.remove();const section=node(camera),player={connection:null,socket:null,decoder:null,renew:null,waitingForKeyframe:true,chunkSequence:0,decodedFrames:0,presentedAt:[],lastReceivedAt:0};players.set(camera.cameraId,player);status();try{player.connection=await call("open_live_view",{sessionId,cameraId:camera.cameraId,viewerInstanceId});const stream=player.connection.stream;identify(section,stream);section.querySelector(".health").textContent=stream.cameraHealth;const config=await decoderConfig(stream);configureDecoder(camera,section,player,stream,config);connectSocket(camera,section,player,stream,player.connection.accessToken);armRenew(camera.cameraId);}catch(cause){await close(camera.cameraId,true,false);scheduleRecovery(camera.cameraId,cause);}}
async function recover(cameraId,cause){if(closing||!selected.has(cameraId))return;await close(cameraId,true,false);scheduleRecovery(cameraId,cause);}
function armRenew(cameraId){const player=players.get(cameraId);if(!player?.connection)return;clearTimeout(player.renew);const stream=player.connection.stream,remaining=Date.parse(stream.expiresAt)-Date.now(),delay=Math.max(0,remaining-Math.min(30000,remaining/3));player.renew=setTimeout(async()=>{try{player.connection=await call("renew_live_view",{sessionId,liveViewId:stream.liveViewId,viewerInstanceId});armRenew(cameraId);}catch(cause){await recover(cameraId,cause);}},delay);}
async function close(cameraId,remove,stopRecovery=true){if(stopRecovery)cancelRecovery(cameraId);const player=players.get(cameraId);players.delete(cameraId);if(player){clearTimeout(player.renew);try{player.socket?.close(1000,"viewer closed");}catch(_){}try{player.decoder?.close();}catch(_){}if(player.connection){try{await call("close_live_view",{sessionId,liveViewId:player.connection.stream.liveViewId,viewerInstanceId});}catch(cause){if(!closing&&stopRecovery)error(cause);}}}if(remove)$("view-"+cameraId)?.remove();if(!players.size&&!selected.size)$("grid").innerHTML='<div class="placeholder">Select an authoritative camera.</div>';status();reportSize();}
function renderChoices(){$("choices").replaceChildren(...cameras.map(camera=>{const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=selected.has(camera.cameraId);input.disabled=camera.streamPolicy==="disabled";input.onchange=()=>{if(input.checked){selected.add(camera.cameraId);void open(camera);}else{selected.delete(camera.cameraId);void close(camera.cameraId,true);}};label.append(input,document.createTextNode(`${camera.cameraId} · ${camera.rig.kind} · ${camera.health} · ${smoothing(camera)}`));return label;}));reportSize();}
async function ensureSubscription(){if(!sessionId)return;const uri=`uav-sim://session/${sessionId}/live-cameras`;if(subscribedUri===uri)return;subscribedUri=uri;void bridge.request("subscriptions/listen",{notifications:{resourceSubscriptions:[uri]}}).catch(cause=>{if(!closing)error(cause);});}
async function discover(){const sessions=await read("uav-sim://sessions"),first=sessions[0];if(!first)throw new Error("No simulation session is available");sessionId=first.session_id;$("session").textContent=`session ${sessionId}`;cameras=await call("list_live_cameras",{session_id:sessionId});await ensureSubscription();renderChoices();status();}
bridge.on("ui/notifications/resource-updated",params=>{const uri=params?.uri||params;if(typeof uri!=="string"||!sessionId||!uri.startsWith(`uav-sim://session/${sessionId}/live-`))return;void discover().then(()=>{if(uri.endsWith("/live-cameras"))retrySelectedNow();}).catch(error);});
function applyHostContext(context){const theme=context?.theme;if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme;}
bridge.on("ui/notifications/host-context-changed",params=>applyHostContext(params?.hostContext||params));
bridge.on("ui/resource-teardown",(_params,id)=>{closing=true;for(const cameraId of recoveries.keys())cancelRecovery(cameraId);void Promise.all([...players.keys()].map(camera=>close(camera,true))).finally(()=>{if(id!==undefined)bridge.post({jsonrpc:"2.0",id,result:{}});});});
addEventListener("pagehide",()=>{closing=true;for(const player of players.values()){clearTimeout(player.renew);try{player.socket?.close();}catch(_){}try{player.decoder?.close();}catch(_){}}});
new ResizeObserver(reportSize).observe($("app"));
(async()=>{try{const initialized=await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"uav-sim-live",version:"3.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});applyHostContext(initialized?.hostContext);configureAgents(initialized);bridge.notify("ui/notifications/initialized",{});await discover();reportSize();}catch(cause){error(cause);$("status").textContent="unavailable";}})();
</script></body></html>
