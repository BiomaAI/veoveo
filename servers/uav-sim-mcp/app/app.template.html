<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Cameras</title>
<style>
:root{color-scheme:dark;--bg:#101012;--panel:#161618;--ink:#eae6dc;--muted:#918c82;--cyan:#c2a15c;--green:#74a184;--red:#c96f67;--line:#2b2a2d;--hover:#5a564e;--mono:"SFMono-Regular",Consolas,"Liberation Mono",ui-monospace,monospace}:root[data-theme="light"]{color-scheme:light;--bg:#f6f4ef;--panel:#fffdf8;--ink:#201e1a;--muted:#6f6a5f;--cyan:#8a6d2f;--green:#3f7354;--red:#96423b;--line:#ddd8cc;--hover:#c7c0af}*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,sans-serif}#app{background:var(--panel)}header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}h1{font-size:15px;margin:0;font-weight:600}.spacer{flex:1}.chip{border:1px solid var(--line);border-radius:0;padding:3px 8px;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}.chip.live{color:var(--green)}#choices{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}label{display:flex;align-items:center;gap:5px;color:var(--muted)}input{accent-color:var(--cyan)}#commands{display:none;grid-template-columns:minmax(130px,180px) minmax(220px,1fr) auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}#commands.available{display:grid}#commands select,#commands input,#commands button{min-width:0;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);padding:8px}#commands button{cursor:pointer;color:var(--cyan)}#commands button:hover{border-color:var(--hover)}#command-result{grid-column:1/-1;color:var(--muted);min-height:1.2em}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}.view{position:relative;min-width:0;aspect-ratio:16/9;background:#101012}.view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.bar,.stats{position:absolute;z-index:2;left:8px;right:8px;display:flex}.bar{top:8px;gap:6px;flex-wrap:wrap}.stats{bottom:8px;gap:4px;flex-wrap:nowrap;overflow:hidden;font:9px/1.3 var(--mono);font-variant-numeric:tabular-nums}.bar span,.stats span,.bar button{background:#101012d9;color:#eae6dc;border:1px solid #3e3c38;border-radius:0;padding:3px 7px}.bar span,.bar button{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}.stats span{padding:2px 5px;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}.stats .requested{flex:0 0 142px}.stats .decoded{flex:0 0 142px}.stats .age{flex:0 0 76px}.stats .transport{flex:0 0 140px}.stats .encoder{flex:0 0 65px}.bar button{margin-left:auto;cursor:pointer}.placeholder{min-height:230px;display:grid;place-items:center;color:var(--muted)}#error{margin:10px 12px;padding:9px;border:1px solid #573530;border-radius:0;color:#cf8b85;background:#211416ed}:root[data-theme="light"] #error{background:#f7ebe9;border-color:#dcbab4;color:#8a3a33}footer{display:flex;gap:12px;padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:720px){#commands{grid-template-columns:1fr}#command-result{grid-column:1}#grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"><header><h1>Live Cameras</h1><span id="decode" class="chip">NVIDIA NVENC · H.264</span><span id="status" class="chip">discovering</span><span class="spacer"></span><span id="count" class="chip">0 views</span></header><section id="choices"></section><form id="commands"><select id="agent" aria-label="Agent"></select><input id="command" maxlength="16384" placeholder="Tell this agent where to fly…" aria-label="Instruction"><button type="submit">Send instruction</button><output id="command-result"></output></form><main id="grid"><div class="placeholder">Finding simulator cameras…</div></main><div id="error" hidden></div><footer><span id="session">No simulation session</span><span class="spacer"></span><span>All viewers share one simulator video stream</span></footer></div>
<script>/*__VEOVEO_APP_BUNDLE__*/</script></body></html>
