artifactService:
  replicas: 1
recording:
  tenantKey: bioma
  # local-path does not enforce PVC capacity. Keep the Hub's actual-filesystem
  # floor above the node reserve used by release preflight and kubelet image GC.
  spoolMinimumFreeBytes: 214748364800
  persistence:
    size: 256Gi
stream:
  liveInput:
    width: 640
    height: 480
    frameRate: 2
    expectedBitrateBps: 750000
  modelCache:
    size: 5Gi
reason:
  engine:
    # Reserve 42% for vLLM so its 8192-token world-model pass has a complete KV
    # cache while all seven required GPU workloads remain on the shared 24 GiB
    # development device.
    gpuMemoryUtilization: 0.42
