apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-0ef75dcf504bfc15392fbf9dc66454e95624804b24446e8b8021d171813620e4
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
  # Foundations flight acceptance runs Reason and Knowledge in separate batches.
  # Keep their Deployments, checkpoints and cache PVCs installed.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: (reason-mcp|knowledge-mcp|embedding)
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
