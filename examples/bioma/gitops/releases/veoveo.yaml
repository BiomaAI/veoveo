apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-f32c8510916391fda7cb08e77a6730fd14983ebad734237492d8643b4e8b70ee
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
