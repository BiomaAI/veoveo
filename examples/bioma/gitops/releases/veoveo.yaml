apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-ea8f452d17a8ce1d5a853048c407b3b9c64caf12b4922cb6a515765e4187e44f
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: modules-values.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
  # Keep every locked image and its Deployment in the rendered contract. The first
  # staged gate runs the shared CPU sources, Datasheet Artifact consumer, Knowledge
  # and Embedding. Other GPU and Computer workloads keep their required resources but
  # wait at zero replicas for their own acceptance batches. Reason also keeps its
  # Deployment, checkpoint and cache PVC installed for its separate batch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: computer-host
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: computers-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: optimization-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: reason-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: recording
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: rerun-bridge
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: speech-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: stream-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: view-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
