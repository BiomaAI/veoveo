apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-838367ce0fe246bc6b995c5dd131e9e152576b93c9c504ed811d9e9c50f9fa4a
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
