apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-eb8e9c8e9aaf9b84ff6275b1cbd40bc94e46d52cf91882fa86e5c2a5e86e0397
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
