apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-ea8f452d17a8ce1d5a853048c407b3b9c64caf12b4922cb6a515765e4187e44f
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: modules-values.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
  # Keep every locked image and its Deployment in the rendered contract. The first
  # staged gate runs the shared CPU sources, Datasheet Artifact consumer, Knowledge
  # and Embedding. Other GPU and Computer workloads keep their required resources but
  # wait at zero replicas for their own acceptance batches. Omit only their deferred
  # PVC declarations until activation; protect active model and Map data during remediation.
  postRenderers:
    - kustomize:
        patches:
          # Deferred WFFC claims return in the same change that activates their consumers.
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: computer-host-data
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: computer-host-data
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: optimization-mcp-workspace
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: optimization-mcp-workspace
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: reason-model-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: reason-model-cache
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: reason-recording-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: reason-recording-cache
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: recording-catalog-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: recording-catalog-cache
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: recording-spool
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: recording-spool
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: stream-model-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: stream-model-cache
              $patch: delete
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: stream-recording-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: stream-recording-cache
              $patch: delete
          # Preserve active storage during Helm uninstall; same-release reuse needs ownership checks.
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: embedding-model-cache
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: embedding-model-cache
                annotations:
                  helm.sh/resource-policy: keep
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: map-mcp-workspace
            patch: |-
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: map-mcp-workspace
                annotations:
                  helm.sh/resource-policy: keep
          # Allow cold image pulls and model staging within the twenty-minute Helm budget.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: embedding
            patch: |-
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 1200
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: knowledge-mcp
            patch: |-
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 1200
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: computer-host
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: computers-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: optimization-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: reason-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: recording
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: rerun-bridge
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: speech-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: stream-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: view-mcp
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 0
