apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: veoveo
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: veoveo
  targetNamespace: veoveo
  storageNamespace: veoveo
  # Migration 0047: keep Map writers stopped while bootstrap seeds the commit head.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: map-mcp
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
  chartRef:
    kind: OCIRepository
    name: veoveo-chart-69e118703fa04214dcdeb8c903c62a89468af5aaadb94c2e75a6c8077501bca8
  valuesFrom:
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: k3d-values.yaml
    - kind: ConfigMap
      name: bioma-veoveo-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 5
      strategy: rollback
  driftDetection:
    mode: enabled
