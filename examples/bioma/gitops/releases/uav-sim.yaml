apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uav-sim
  namespace: flux-system
spec:
  # Operator pause: simulator is scaled to zero during the remaining upgrades.
  # Remove this field and resume the release when simulation is needed again.
  suspend: true
  interval: 5m
  timeout: 30m
  releaseName: uav-sim
  targetNamespace: veoveo
  storageNamespace: veoveo
  dependsOn:
    - name: veoveo
  chartRef:
    kind: OCIRepository
    name: uav-sim-chart-5675699d93eb238d3c41e14c284ccdd32349cc4cec022826e3d3d5d63cefb8e9
  valuesFrom:
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: uav-sim-values.yaml
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 5
      strategy: rollback
  driftDetection:
    mode: enabled
