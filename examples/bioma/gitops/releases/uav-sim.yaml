apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uav-sim
  namespace: flux-system
spec:
  interval: 5m
  timeout: 30m
  releaseName: uav-sim
  targetNamespace: veoveo
  storageNamespace: veoveo
  dependsOn:
    - name: veoveo
  chartRef:
    kind: OCIRepository
    name: uav-sim-chart-937116a29a5c25a0ec59030a670710165e3021701895eb3365d0c7dad68f1dd8
  valuesFrom:
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: uav-sim-values.yaml
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 5
      strategy: rollback
  driftDetection:
    mode: enabled
