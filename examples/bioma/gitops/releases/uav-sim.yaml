apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uav-sim
  namespace: flux-system
spec:
  interval: 5m
  timeout: 30m
  releaseName: uav-sim
  targetNamespace: veoveo
  storageNamespace: veoveo
  dependsOn:
    - name: veoveo
  chartRef:
    kind: OCIRepository
    name: uav-sim-chart-c72323352dddceae0af8540c218e8467ebad71762005360e96fe55f1742c375a
  valuesFrom:
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: uav-sim-values.yaml
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 5
      strategy: rollback
  driftDetection:
    mode: enabled
