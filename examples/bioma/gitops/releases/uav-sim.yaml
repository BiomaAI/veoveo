apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uav-sim
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  timeout: 30m
  releaseName: uav-sim
  targetNamespace: veoveo
  storageNamespace: veoveo
  dependsOn:
    - name: veoveo
  chartRef:
    kind: OCIRepository
    name: uav-sim-chart-faadca5d31bf6fcf971949f49616dad4bca94853d36fa52c4de0a4bb754cf33e
  valuesFrom:
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: uav-sim-values.yaml
    - kind: ConfigMap
      name: bioma-uav-sim-values
      valuesKey: images.lock.yaml
  install:
    createNamespace: false
    serverSideApply: true
    remediation:
      retries: 5
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 5
      strategy: rollback
  driftDetection:
    mode: enabled
