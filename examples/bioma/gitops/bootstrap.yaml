apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bioma
  namespace: flux-system
spec:
  interval: 1m
  timeout: 1m
  url: ssh://git@github.com/BiomaAI/veoveo.git
  ref:
    branch: main
  secretRef:
    name: bioma-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bioma
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 15s
  timeout: 30m
  path: ./examples/bioma
  prune: true
  wait: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: bioma
