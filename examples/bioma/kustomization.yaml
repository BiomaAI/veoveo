apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - gitops/name-references.yaml
resources:
  - gitops/namespace.yaml
  - gitops/sources
  - gitops/releases
  - gitops/cloudflared.yaml
configMapGenerator:
  - name: bioma-computers-configuration
    namespace: veoveo
    options:
      disableNameSuffixHash: true
    files:
      - computers.json=computers/computers.json
  - name: bioma-computer-host-configuration
    namespace: veoveo
    options:
      disableNameSuffixHash: true
    files:
      - host.json=computers/host.json
  - name: bioma-gateway-control-plane
    namespace: veoveo
    options:
      disableNameSuffixHash: true
    files:
      - gateway.json
      - recording-producer-jwks.json
      - recording-hub-jwks.json
      - recording-mcp-publisher-jwks.json
      - service-client-jwks.json
      - uav-pilot-jwks.json
  - name: uav-sim-world-binding
    namespace: veoveo
    options:
      disableNameSuffixHash: true
    files:
      - world.json=uav-sim-world.json
  - name: bioma-veoveo-values
    namespace: flux-system
    options:
      immutable: true
    files:
      - values.yaml=values.yaml
      - k3d-values.yaml=k3d-values.yaml
      - images.lock.yaml=images/veoveo.lock.yaml
  - name: bioma-uav-sim-values
    namespace: flux-system
    options:
      immutable: true
    files:
      - uav-sim-values.yaml=uav-sim-values.yaml
      - images.lock.yaml=images/uav-sim.lock.yaml
generatorOptions:
  labels:
    reconcile.fluxcd.io/watch: Enabled
    app.kubernetes.io/part-of: veoveo
    app.kubernetes.io/managed-by: flux
