global:
  production: true

platform:
  installationId: veoveo
  publicBaseUrl: https://veoveo.bioma.ai
  cesiumSecret: veoveo-uav-sim-secrets
  recordingTenantKey: bioma

recording:
  mapProvider: openStreetMap

session:
  vehicleCount: 4
  physicsHz: 60
  renderingHz: 24
  fleetLoop:
    takeoffTimeoutSeconds: 1800
  camera:
    vehicleId: uav-1
    width: 640
    height: 480
    fps: 2
    bitRateBps: 750000
    optics:
      focalLengthMm: 8.0
      clippingRangeM:
        near: 0.05
        far: 100000.0
    mount:
      translationM:
        x: 0.60
        "y": 0.0
        z: 0.05
      orientationWxyz:
        w: 0.7071067811865476
        x: 0.0
        "y": 0.0
        z: -0.7071067811865476
liveView:
  publicSignalingUrl: wss://veoveo.bioma.ai/uav-sim/signaling
  publicMediaHost: 127.0.0.1
  signalingIngress:
    enabled: true
    className: traefik
    host: veoveo.bioma.ai
    tls:
      enabled: false
