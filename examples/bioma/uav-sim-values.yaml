global:
  production: true

platform:
  installationId: veoveo
  publicBaseUrl: https://veoveo.bioma.ai
  cesiumSecret: veoveo-uav-sim-secrets
  adapterSecret: veoveo-uav-sim-adapter
  recordingTenantKey: bioma

agents:
  enabled: true
  tenant: bioma
  gatewayUrl: https://veoveo.bioma.ai

recording:
  mapProvider: openStreetMap

world:
  bootstrap:
    existingConfigMap: uav-sim-world-binding
    key: world.json

session:
  vehicleCount: 4
  physicsHz: 30
  renderingHz: 24
  fleetLoop:
    takeoffTimeoutSeconds: 1800
  camera:
    vehicleId: uav-1
    width: 640
    height: 480
    fps: 2
    optics:
      focalLengthMm: 8.0
      clippingRangeM:
        near: 0.05
        far: 100000.0
    mount:
      translationM:
        x: 0.60
        "y": 0.0
        z: 0.05
      orientationWxyz:
        w: 0.7071067811865476
        x: 0.0
        "y": 0.0
        z: -0.7071067811865476
liveView:
  publicStreamUrl: wss://veoveo.bioma.ai/uav-sim/live
  streamIngress:
    enabled: true
    className: traefik
    host: veoveo.bioma.ai
    tls:
      enabled: false
