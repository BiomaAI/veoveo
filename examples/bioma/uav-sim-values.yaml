global:
  production: true

platform:
  installationId: veoveo
  publicBaseUrl: https://veoveo.bioma.ai
  cesiumSecret: veoveo-uav-sim-secrets
  recordingTenantKey: bioma

recording:
  mapProvider: openStreetMap

session:
  vehicleCount: 4
  physicsHz: 60
  renderingHz: 2
  fleetLoop:
    takeoffTimeoutSeconds: 1800
  camera:
    vehicleId: uav-1
    width: 640
    height: 480
    fps: 2
    bitRateBps: 750000
    optics:
      focalLengthMm: 8.0
      clippingRangeM:
        near: 0.05
        far: 100000.0
    mount:
      translationM:
        x: 0.60
        "y": 0.0
        z: 0.05
      orientationWxyz:
        w: 0.7071067811865476
        x: 0.0
        "y": 0.0
        z: -0.7071067811865476
posePublication:
  cadenceHz: 20
  bufferDurationMs: 500
  producerId: uav-sim
  producerSpiffeId: spiffe://veoveo.local/simulation/uav-sim
  epochId: epoch-1
  endpointHost: simulation-view-pose
  endpointPort: 7443
  serverHostname: simulation-view-pose
  entityTableRevision: 1
  existingTlsSecret: uav-sim-pose-producer-tls
  caCertificateKey: ca.crt
  clientCertificateKey: tls.crt
  clientPrivateKeyKey: tls.key
