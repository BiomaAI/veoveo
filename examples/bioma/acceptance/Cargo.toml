[package]
name = "veoveo-bioma-acceptance"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
veoveo-agent-runtime = { path = "../../../agents/runtime", default-features = false, features = ["persistence"] }
veoveo-gateway-catalog.workspace = true
veoveo-recording-contract.workspace = true
veoveo-gateway-contract.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
surrealdb = { version = "=3.3.0", default-features = false }
uuid.workspace = true
veoveo-mcp-contract.workspace = true
veoveo-mcp-gateway = { path = "../../../platform/gateway" }
veoveo-platform-store = { path = "../../../platform/store" }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-agent-runtime = { path = "../../../agents/runtime", default-features = false, features = ["gateway"] }
veoveo-recording-mcp = { path = "../../../servers/recording-mcp", default-features = false, features = ["gateway"] }
veoveo-types.workspace = true
tar = "=0.4.46"
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt-multi-thread"] }
