global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai
objectStore:
  bucketInitImage:
    digest: sha256:0425835c7c9e33a747dfd499dcd3603ec802662f7f7ded42d8fc81ce7b712bf9
artifactService:
  allowedAudiences:
  - computers
  - artifact
  - media
  - timeseries
  - optimization
  - duckdb
  - frames
  - map
  - recording
  - stream
  - reason
  - speech
  - datasheet
  - uav-sim
gateway:
  auditRetentionDays: 365
  auditExport:
    destinations:
      s3:
        endpoint: http://rustfs:9000
        region: us-east-1
        bucket: artifact-plane
        prefix: audit
        object_lock:
          mode: disabled
        allow_http: true
      otlp:
        endpoint: http://otel-collector:4318/v1/logs
        bearer_token_env: null
        allow_http: true
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  agents:
    models:
    - id: daily-assistant
      name: Daily assistant model
      provider: Cloudflare Workers AI
      tenant: bioma
      workContexts: &id001
      - operations
      requiredScopes: &id002
      - operator:use
      baseUrl: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      apiKey: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 4
        maxToolCalls: 8
        deadlineSeconds: 120
    - id: pilot-model
      name: Pilot reasoning model
      provider: Cloudflare Workers AI
      tenant: bioma
      workContexts: *id001
      requiredScopes: *id002
      baseUrl: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      apiKey: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 16
        maxToolCalls: 24
        deadlineSeconds: 600
    modelSecrets:
      VEOVEO_AGENT_MODEL_API_KEY:
        existingSecret: veoveo-workspace-models
        key: api-key
    templates:
    - id: uav-pilot
      name: UAV Pilot
      tenant: bioma
      workContexts:
      - operations
      requiredDeployerScopes:
      - operator:use
      profile: agent
      scopes:
      - map:dataset:read
      - map:route
      - operator:use
      - time:read
      - uav-sim:control
      roles:
      - uav-pilot
      membership: contributor
      models:
      - pilot-model
      tools:
      - map__inspect_location
      - map__inspect_position
      - map__list_active_dataset_releases
      - map__prepare_route_handoff
      - map__query_source_features
      - map__route
      - map__search_locations
      - map__validate_route
      - time__assess_clock
      - time__convert_time
      - time__resolve_time
      - uav-sim__arm_vehicle
      - uav-sim__execute_vehicle_mission_plan
      - uav-sim__get_simulation_state
      - uav-sim__land_vehicle
      - uav-sim__list_active_vehicle_control_grants
      - uav-sim__prepare_vehicle_mission
      - uav-sim__takeoff_vehicle
      resourceSubscriptions:
      - uav-sim://control-grants
      - uav-sim://mission-plans
      parameters:
        session:
          label: Simulation session
          shape:
            kind: choice
            values:
            - uav-showcase
          environmentVariable: VEOVEO_PARAM_SESSION
      workload:
        namespace: veoveo-agents
        configMap: uav-pilot-037b21aaa992
        configDigest: sha256:037b21aaa99257ed211e51e8ea2477aff0649a79374a87503c5ed7377837a2bf
        image: k3d-veoveo-registry.localhost:5000/veoveo/agent-kernel@sha256:b3aff146d3ca6b065077081667b9e4e45f784b5bf4cd9f6a59729e3ab6e9ad85
        databaseSecret: veoveo-surreal-runtime
        storageClass: local-path
        storageGib: 2
        cpuMillis: 1000
        memoryMib: 1024
        modelSecrets:
        - reference: agent_model_api_key
          secret: veoveo-workspace-models
          key: api-key
  controlPlaneRevision: f8eae980d6ee7835f1ac82274efb5b0c1845673a2340e9dae3cf20ad20898e01
