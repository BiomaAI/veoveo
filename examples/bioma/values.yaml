global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai

artifactService:
  allowedAudiences:
    - computers
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
    - uav-sim

gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  controlPlaneRevision: 115edd48c93b2f786a6dc3b3eff658a363e6e40151f2e350404a4babbcac04c8

consoleBff:
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
    - artifact:upload
    - operator:use
    - admin:manage
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture

clusterInspection:
  enabled: true

ingress:
  className: traefik
  host: veoveo.bioma.ai
  tls:
    enabled: false

computerCapacity: openshell-docker
computers:
  replicas: 2
  existingConfigMap: bioma-computers-configuration
  configurationRevision: 88acb4794f7f81e0ffde6463e00b4a2052d8ec988373e4c5eaa59283c69b59dd
  existingTrustSecret: bioma-computers-worker-trust
  host:
    existingConfigMap: bioma-computer-host-configuration
    configurationRevision: 45d730ad409ef5cc4a78301a17b9fede4f79181fe13802dc08e6ce48c6a3da47
    existingTrustSecret: bioma-computer-host-trust
    persistence:
      size: 100Gi
      storageClass: local-path
    registryEgress:
      - cidr: 172.18.0.3/32
        port: 5000
