global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai

artifactService:
  allowedAudiences:
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
    - uav-sim

gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  controlPlaneRevision: 0f94d24dddbdcc7ab469bad2ca8f9108bfa946362ca0ec05e8ba3e8f82a72316

consoleBff:
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
    - artifact:upload
    - operator:use
    - admin:manage
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture

clusterInspection:
  enabled: true

ingress:
  className: traefik
  host: veoveo.bioma.ai
  tls:
    enabled: false

computerCapacity: openshell-docker
computers:
  replicas: 2
  existingConfigMap: bioma-computers-configuration
  configurationRevision: 8e0535f0114dd5d7fca1a10c79cd523f23a9c1cb724b0d2d8e03f1243e092490
  existingTrustSecret: bioma-computers-worker-trust
  host:
    existingConfigMap: bioma-computer-host-configuration
    configurationRevision: 14e1412a4ebd3765f8fde0a2fd5f265d0d34dfc9ac439f1659095e4f62e78d29
    existingTrustSecret: bioma-computer-host-trust
    persistence:
      size: 100Gi
      storageClass: local-path
    registryEgress:
      - cidr: 172.18.0.3/32
        port: 5000
