global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai
artifactService:
  allowedAudiences:
  - computers
  - artifact
  - media
  - timeseries
  - optimization
  - duckdb
  - frames
  - map
  - recording
  - stream
  - reason
  - speech
  - datasheet
  - uav-sim
gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  agents:
    models:
    - id: daily-assistant
      name: Daily assistant model
      provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: &id001
      - operations
      required_scopes: &id002
      - operator:use
      base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      api_key: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 4
        maxToolCalls: 8
        deadlineSeconds: 120
    - id: pilot-model
      name: Pilot reasoning model
      provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: *id001
      required_scopes: *id002
      base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      api_key: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 16
        maxToolCalls: 24
        deadlineSeconds: 600
    modelSecrets:
      VEOVEO_AGENT_MODEL_API_KEY:
        existingSecret: veoveo-workspace-models
        key: api-key
    templates:
    - id: uav-pilot
      name: UAV Pilot
      tenant: bioma
      work_contexts:
      - operations
      required_deployer_scopes:
      - operator:use
      profile: agent
      scopes:
      - map:dataset:read
      - map:route
      - operator:use
      - time:read
      - uav-sim:control
      roles:
      - uav-pilot
      membership: contributor
      models:
      - pilot-model
      tools:
      - map__inspect_location
      - map__inspect_position
      - map__list_active_dataset_releases
      - map__prepare_route_handoff
      - map__query_source_features
      - map__route
      - map__search_locations
      - map__validate_route
      - time__assess_clock
      - time__convert_time
      - time__resolve_time
      - uav-sim__arm_vehicle
      - uav-sim__execute_vehicle_mission_plan
      - uav-sim__get_simulation_state
      - uav-sim__land_vehicle
      - uav-sim__list_active_vehicle_control_grants
      - uav-sim__prepare_vehicle_mission
      - uav-sim__takeoff_vehicle
      resource_subscriptions:
      - uav-sim://control-grants
      - uav-sim://mission-plans
      parameters:
        session:
          label: Simulation session
          shape:
            kind: choice
            values:
            - uav-showcase
          environment_variable: VEOVEO_PARAM_SESSION
      workload:
        namespace: veoveo-agents
        config_map: uav-pilot-01b19f5aa87b
        config_digest: sha256:01b19f5aa87bd953be64f55f6c9acd91b6ec9439d3106d0f4547924ad15fa9f0
        image: k3d-veoveo-registry.localhost:5000/veoveo/agent-kernel@sha256:0480ccc1b3b1fa661b8edcf16075ab24a5296a8e6bd1663de75e3a6d64d328c7
        database_secret: veoveo-surreal-runtime
        storage_class: local-path
        storage_gib: 2
        cpu_millis: 1000
        memory_mib: 1024
        model_secrets:
        - reference: agent_model_api_key
          secret: veoveo-workspace-models
          key: api-key
  controlPlaneRevision: 737f1b4fe95f0ad6f1fc04d3803e120e3981b829083dd5db87c6b2d5922de26e
consoleBff:
  workspace:
    oauthScopes:
    - artifact:upload
    - map:dataset:read
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:restriction:publish
