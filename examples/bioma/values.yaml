global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai

artifactService:
  allowedAudiences:
    - computers
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
    - uav-sim

gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  agents:
    models:
    - id: daily-assistant
      name: Daily assistant model
      provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts:
      - operations
      required_scopes:
      - operator:use
      base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      api_key: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 4
        maxToolCalls: 8
        deadlineSeconds: 120
    modelSecrets:
      VEOVEO_AGENT_MODEL_API_KEY:
        existingSecret: veoveo-workspace-models
        key: api-key
  controlPlaneRevision: f36bb7e02858ec6ac6865ed1deb57606264526e608656465bb73c844e8e41815

consoleBff:
  workspace:
    oauthScopes:
      - artifact:upload
      - map:dataset:read
      - map:feature:publish
      - map:feature:read
      - map:feature:write
      - map:raster:derive
      - map:restriction:publish
      - map:restriction:withdraw
      - map:route
      - map:route_matrix
      - map:spatial:derive
      - operator:use
      - time:event:write
      - time:read
      - time:schedule
      - time:timeline
      - uav-sim:stream
      - view:capture
      - view:read
      - view:write
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
    - artifact:upload
    - operator:use
    - admin:manage
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture

clusterInspection:
  enabled: true

ingress:
  className: traefik
  host: veoveo.bioma.ai
  tls:
    enabled: false

computerCapacity: openshell-docker
computers:
  replicas: 2
  existingConfigMap: bioma-computers-configuration
  configurationRevision: 88acb4794f7f81e0ffde6463e00b4a2052d8ec988373e4c5eaa59283c69b59dd
  existingTrustSecret: bioma-computers-worker-trust
  host:
    existingConfigMap: bioma-computer-host-configuration
    configurationRevision: 45d730ad409ef5cc4a78301a17b9fede4f79181fe13802dc08e6ce48c6a3da47
    existingTrustSecret: bioma-computer-host-trust
    persistence:
      size: 100Gi
      storageClass: local-path
    registryEgress:
      - cidr: 172.18.0.3/32
        port: 5000
