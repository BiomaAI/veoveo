    - map:route
    - map:route_matrix
    - map:spatial:derive
    - operator:use
    - time:event:write
    - time:read
    - time:schedule
    - time:timeline
    - uav-sim:stream
    - view:capture
    - view:read
    - view:write
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
  - artifact:upload
  - operator:use
  - admin:manage
  - uav-sim:admin
  - uav-sim:stream
  - map:admin
  - map:dataset:read
  - map:feature:admin
  - map:feature:publish
  - map:feature:read
  - map:feature:write
  - map:raster:derive
  - map:spatial:derive
  - time:read
  - view:read
  - view:write
  - view:capture
