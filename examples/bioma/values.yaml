global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai

artifactService:
  allowedAudiences:
    - computers
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
    - uav-sim

gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  controlPlaneRevision: 21a6052526098a2d85e43f8322cc481270ab63b8a88bf0f5eda9690ce561459e

consoleBff:
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
    - artifact:upload
    - operator:use
    - admin:manage
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture

clusterInspection:
  enabled: true

ingress:
  className: traefik
  host: veoveo.bioma.ai
  tls:
    enabled: false

computerCapacity: openshell-docker
computers:
  replicas: 2
  existingConfigMap: bioma-computers-configuration
  configurationRevision: 0b5193965aed0408bf88836abac2e0bbfd3efdd427f2871d0d1042db9a8d521e
  existingTrustSecret: bioma-computers-worker-trust
  host:
    existingConfigMap: bioma-computer-host-configuration
    configurationRevision: 2786983b69b3edaff64747eb92a47497807de1872ec9bfb984ef6df781450aa0
    existingTrustSecret: bioma-computer-host-trust
    persistence:
      size: 100Gi
      storageClass: local-path
    registryEgress:
      - cidr: 172.18.0.3/32
        port: 5000
