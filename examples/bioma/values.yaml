global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai

artifactService:
  allowedAudiences:
    - computers
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
    - uav-sim

gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  workspace:
    agents:
    - provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: &id001
      - operations
      model: &id002
        base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
        name: '@cf/moonshotai/kimi-k2.6'
        api_key: workspace_model_api_key
        max_output_tokens: 4096
      id: assistant
      name: Assistant
      description: Draft, organize and carry out requests with the capabilities available to you.
      instructions: Help people with daily work. Explain assumptions and ask when required inputs are missing.
        Tool operations and their results appear in the requesting person's private Activity. For an explicitly
        requested image, the installation-qualified media model is openai/gpt-image-2/text-to-image and
        its input includes a prompt string. Do not request image generation unless the human asks for it.
      tools:
      - media__run
      - media__models
      - media__model_schema
      - time__resolve_time
      - time__convert_time
      - time__evaluate_windows
    - provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: *id001
      model: *id002
      id: reviewer
      name: Reviewer
      description: Review shared work, check assumptions and help participants improve their decisions.
      instructions: Review the shared request carefully. Identify concrete gaps and suggest actionable corrections.
        Respect the author and distinguish evidence from inference. Use time capabilities only when the
        necessary values are supplied.
      tools:
      - time__resolve_time
      - time__convert_time
      - time__evaluate_windows
    modelSecrets:
      VEOVEO_WORKSPACE_MODEL_API_KEY:
        existingSecret: veoveo-workspace-models
        key: api-key
  controlPlaneRevision: 1d778cf4f2feaa0b589d87cec26de87f5284bddf9e5b490379b8670f3cc6806c

consoleBff:
  workspace:
    oauthScopes:
      - artifact:upload
      - map:dataset:read
      - map:feature:publish
      - map:feature:read
      - map:feature:write
      - map:raster:derive
      - map:restriction:publish
      - map:restriction:withdraw
      - map:route
      - map:route_matrix
      - map:spatial:derive
      - operator:use
      - time:event:write
      - time:read
      - time:schedule
      - time:timeline
      - uav-sim:control
      - uav-sim:read
      - uav-sim:stream
      - view:capture
      - view:read
      - view:write
  replicas: 2
  oauthResource: https://veoveo.bioma.ai/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin
  oauthScopes:
    - artifact:upload
    - operator:use
    - admin:manage
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture

clusterInspection:
  enabled: true

ingress:
  className: traefik
  host: veoveo.bioma.ai
  tls:
    enabled: false

computerCapacity: openshell-docker
computers:
  replicas: 2
  existingConfigMap: bioma-computers-configuration
  configurationRevision: 88acb4794f7f81e0ffde6463e00b4a2052d8ec988373e4c5eaa59283c69b59dd
  existingTrustSecret: bioma-computers-worker-trust
  host:
    existingConfigMap: bioma-computer-host-configuration
    configurationRevision: 45d730ad409ef5cc4a78301a17b9fede4f79181fe13802dc08e6ce48c6a3da47
    existingTrustSecret: bioma-computer-host-trust
    persistence:
      size: 100Gi
      storageClass: local-path
    registryEgress:
      - cidr: 172.18.0.3/32
        port: 5000
