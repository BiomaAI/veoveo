global:
  production: true
  publicBaseUrl: https://veoveo.bioma.ai
artifactService:
  allowedAudiences:
  - computers
  - artifact
  - media
  - timeseries
  - optimization
  - duckdb
  - frames
  - map
  - recording
  - stream
  - reason
  - speech
  - datasheet
  - uav-sim
gateway:
  existingControlPlaneConfigMap: bioma-gateway-control-plane
  agents:
    models:
    - id: daily-assistant
      name: Daily assistant model
      provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: &id001
      - operations
      required_scopes: &id002
      - operator:use
      base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      api_key: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 4
        maxToolCalls: 8
        deadlineSeconds: 120
    - id: pilot-model
      name: Pilot reasoning model
      provider: Cloudflare Workers AI
      tenant: bioma
      work_contexts: *id001
      required_scopes: *id002
      base_url: https://api.cloudflare.com/client/v4/accounts/cd9522254303bfb3d2322a0d9b82764f/ai/v1
      model: '@cf/moonshotai/kimi-k2.6'
      api_key: agent_model_api_key
      limits:
        maxOutputTokens: 4096
        maxCompletionCalls: 16
        maxToolCalls: 24
        deadlineSeconds: 600
    modelSecrets:
      VEOVEO_AGENT_MODEL_API_KEY:
        existingSecret: veoveo-workspace-models
        key: api-key
    templates:
    - id: uav-pilot
      name: Governed UAV pilot
      tenant: bioma
      work_contexts:
      - operations
      required_deployer_scopes:
      - operator:use
      profile: agent
      scopes:
      - map:dataset:read
      - map:route
      - operator:use
      - time:read
      - uav-sim:control
      roles:
      - uav-pilot
      membership: contributor
      models:
      - pilot-model
      tools:
      - map__inspect_location
      - map__inspect_position
      - map__list_active_dataset_releases
      - map__prepare_route_handoff
      - map__query_source_features
      - map__route
      - map__search_locations
      - map__validate_route
      - time__assess_clock
      - time__convert_time
      - time__resolve_time
      - uav-sim__arm_vehicle
      - uav-sim__execute_vehicle_mission_plan
      - uav-sim__get_simulation_state
      - uav-sim__land_vehicle
      - uav-sim__list_active_vehicle_control_grants
      - uav-sim__prepare_vehicle_mission
      - uav-sim__takeoff_vehicle
      resource_subscriptions:
      - uav-sim://control-grants
      - uav-sim://mission-plans
      - uav-sim://session/uav-showcase/vehicle/uav-1
      - uav-sim://session/uav-showcase/vehicle/uav-2
      - uav-sim://session/uav-showcase/vehicle/uav-3
      - uav-sim://session/uav-showcase/vehicle/uav-4
      parameters:
        session:
          label: Simulation session
          shape:
            kind: choice
            values:
            - uav-showcase
          environment_variable: VEOVEO_PARAM_SESSION
        vehicle:
          label: Requested vehicle (requires a separate control grant)
          shape:
            kind: choice
            values:
            - uav-1
            - uav-2
            - uav-3
            - uav-4
          environment_variable: VEOVEO_PARAM_VEHICLE
      workload:
        namespace: veoveo-agents
        config_map: uav-pilot-6bbd1508694f
        config_digest: sha256:6bbd1508694f2b0fdd280a0e2ac8570c90f48fd7a3e15f175fe68432dab4d7dc
        image: k3d-veoveo-registry.localhost:5000/veoveo/agent-kernel@sha256:93027de5dd828746f47c1eabaa42bed0891f078466fd8be2db6cee2ad31c0385
        database_secret: veoveo-surreal-runtime
        storage_class: local-path
        storage_gib: 2
        cpu_millis: 1000
        memory_mib: 1024
        model_secrets:
        - reference: agent_model_api_key
          secret: veoveo-workspace-models
          key: api-key
  controlPlaneRevision: d6c238481a6fdcf5e07ecc2f8ae50613091173e68d6f6377a7003e92d2269ab1
consoleBff:
  workspace:
    oauthScopes:
    - artifact:upload
    - map:dataset:read
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:restriction:publish
