[project]
name = "datasheet-mcp"
version = "0.1.0"
description = "Veoveo dataset profiling MCP server — the Python hosted-server template"
requires-python = ">=3.12,<3.15"
dependencies = [
    "veoveo-mcp==0.1.0",
    "mcp==2.0.0",
    "pydantic>=2.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
datasheet-mcp = "datasheet_mcp.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_mcp"]

# Embed the server documents in the wheel so a deployed container serves the
# manual of exactly the version it was built from (contract C21).
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "datasheet_mcp/AGENTS.md"
"DESIGN.md" = "datasheet_mcp/DESIGN.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
veoveo-mcp = { path = "../../sdk/python", editable = true }
