[package]
name = "veoveo-agent-kernel"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_agent_kernel"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[dependencies]
veoveo-duckdb-mcp = { path = "../../servers/duckdb-mcp", default-features = false, features = ["contract"] }
veoveo-types.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
duckdb.workspace = true
jsonwebtoken.workspace = true
re_chunk_store.workspace = true
re_dataframe.workspace = true
re_sdk.workspace = true
re_sdk_types.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rig.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
veoveo-duckdb-runtime = { path = "../../platform/runtimes/duckdb" }
veoveo-agent-runtime = { path = "../runtime" }
veoveo-mcp-contract.workspace = true
veoveo-platform-store.workspace = true
veoveo-task-runtime = { path = "../../platform/task-runtime" }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
tempfile = "3"
