[package]
name = "veoveo-agent-runtime"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_agent_runtime"
path = "src/lib.rs"

[features]
contract = ["dep:veoveo-types", "dep:serde", "dep:serde_json", "dep:schemars"]
gateway = ["runtime", "dep:veoveo-mcp-gateway", "dep:anyhow", "dep:jsonwebtoken", "dep:veoveo-types", "dep:axum", "dep:parking_lot", "dep:reqwest", "dep:rmcp", "dep:secrecy", "dep:sha2", "dep:hex", "dep:tokio-util", "dep:tower-http", "dep:tracing", "dep:url"]
default = ["runtime"]
schema = ["dep:veoveo-modules"]
runtime = [
    "contract",
    "dep:async-stream",
    "dep:chrono",
    "dep:futures",
    "dep:serde",
    "dep:serde_json",
    "dep:surrealdb",
    "dep:thiserror",
    "dep:tokio",
    "dep:uuid",
    "dep:veoveo-platform-store",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-task-runtime",
]

[dependencies]
schemars = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
secrecy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["set-header"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-mcp-gateway = { path = "../../platform/gateway", optional = true }
anyhow = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }
async-stream = { version = "=0.3.6", optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"], optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
uuid = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
tower.workspace = true

veoveo-types.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }

[[test]]
name = "surreal_integration"
required-features = ["runtime"]
