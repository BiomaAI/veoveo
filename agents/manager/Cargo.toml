[package]
name = "veoveo-agent-manager"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent-manager"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "query", "stream", "rustls"] }
# Latest stable RSA release verified against docs.rs/crate/rsa on 2026-09-19.
rsa = "=0.9.10"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
veoveo-mcp-contract.workspace = true
veoveo-platform-store.workspace = true
