global:
  publicBaseUrl: http://localhost:8780

surrealdb:
  persistence:
    size: 5Gi

objectStore:
  rustfs:
    persistence:
      size: 10Gi

artifactService:
  replicas: 1

recording:
  persistence:
    size: 20Gi

consoleBff:
  replicas: 1
  oauthResource: http://localhost:8780/mcp/admin
  mcpTransportUrl: http://mcp-gateway:8788/mcp/admin

telemetry:
  enabled: false

ingress:
  className: traefik
  host: localhost
  tls:
    enabled: false

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
