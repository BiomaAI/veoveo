global:
  installationId: veoveo
  production: false
  veoveoRegistry: ""
  veoveoTag: ""
  imageDigests: {}
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  existingSecret: veoveo-installation-secrets
  publicBaseUrl: https://veoveo.enterprise.example
  offline: false
  podAnnotations: {}
  podLabels: {}
  gpuPlacement:
    enabled: false
    claimName: ""
    runtimeClassName: nvidia
    evidenceDigest: ""
    workloadRequests: {}
    workloadReplicas: {}
  serviceMesh:
    enabled: false
    provider: istio
    podAnnotations: {}

installationPreset: full
components: []
mcpServers: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

surrealdb:
  image:
    repository: surrealdb/surrealdb
    tag: v3.2.1
    digest: ""
  namespace: veoveo
  database: platform
  adminExistingSecret: veoveo-surreal-admin
  runtimeExistingSecret: veoveo-surreal-runtime
  persistence:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

objectStore:
  mode: rustfs
  bucketInitImage:
    repository: amazon/aws-cli
    tag: 2.35.23
    digest: ""
  rustfs:
    image:
      repository: rustfs/rustfs
      tag: 1.0.0-beta.8
      digest: ""
    bucket: artifact-plane
    persistence:
      size: 50Gi
      storageClass: ""
      accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
  externalS3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    allowHttp: false

gateway:
  image:
    repository: veoveo/mcp-gateway
    tag: 0.1.0
    digest: ""
  replicas: 2
  existingControlPlaneConfigMap: veoveo-gateway-control-plane
  controlPlaneKey: gateway.json
  controlPlaneRevision: ""
  refreshDeliveryWindowSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

artifactService:
  image:
    repository: veoveo/artifact-service
    tag: 0.1.0
    digest: ""
  replicas: 2
  allowedAudiences:
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - datasheet
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

recording:
  tenantKey: enterprise
  workContext: operations
  classification: unclassified
  labels: []
  route: world=
  idleTimeoutSeconds: 15
  segmentMaxBytes: 201326592
  segmentMaxAgeSeconds: 3600
  liveHistorySeconds: 1
  blueprintMaxBytes: 2097152
  blueprintMaxMessages: 10000
  blueprintMaxRevisions: 32
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  hubImage:
    repository: veoveo/recording-hub
    tag: 0.1.0
    digest: ""
  mcpImage:
    repository: veoveo/recording-mcp
    tag: 0.1.0
    digest: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

stream:
  runtimeClassName: nvidia
  image:
    repository: veoveo/stream-mcp
    tag: 0.1.0
    digest: ""
  liveInput:
    width: 640
    height: 480
    frameRate: 20
    expectedBitrateBps: 4000000
  recordingOutput:
    enabled: false
    proxyUrl: rerun+http://127.0.0.1:9876/proxy
    applicationId: veoveo-sensor
    entityPath: /stream/live
    timeline: stream-time
    queueCapacity: 256
    forwarder:
      image:
        repository: veoveo/recording-forwarder
        tag: 0.1.0
        digest: ""
      gatewayTransportUrl: http://mcp-gateway:8788
      clientId: recording-producer
      keyId: recording-producer-2026
      signingAlgorithm: rs256
      privateKey:
        existingSecret: veoveo-recording-producer
        key: private-key.pem
      maximumQueueBytes: 4294967296
      batchMessageLimit: 4096
      grpcMemoryLimitBytes: 268435456
      persistence:
        size: 5Gi
        storageClass: ""
        accessModes: [ReadWriteOnce]
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 2Gi
  modelCache:
    size: 5Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  builderResources:
    requests:
      cpu: 500m
      memory: 2Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: "1"
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 24Gi
      nvidia.com/gpu: "1"

reason:
  runtimeClassName: nvidia
  image:
    repository: veoveo/reason-mcp
    tag: 0.1.0
    digest: ""
  modelCache:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  model:
    id: world-model
    title: Installation world model
    description: Installation-supplied world-model checkpoint for video reasoning.
    path: /models/world-model
    digest: ""
  engine:
    gpuMemoryUtilization: 0.6
    maxModelLen: 8192
  observation:
    width: 640
    height: 360
    maximumFrames: 6
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 24Gi
      nvidia.com/gpu: "1"

# Installation-time server bootstrap documents, keyed by domain-service
# name. Each entry renders a `{name}-bootstrap` ConfigMap mounted at the
# canonical /etc/veoveo/bootstrap/catalog.json and passed to the server via
# --bootstrap-catalog. The payload schema is owned by the server crate;
# validate documents with the server binary's `bootstrap-validate` verb.
# serverBootstrap:
#   map-mcp:
#     server: map
#     tenantKey: installation
#     payload:
#       sources: []
#       mobility_profiles: []
serverBootstrap: {}

# Installation-owned, read-only source inputs for domain services whose
# contract declares a controlled source mount. Values select existing
# Kubernetes objects; acquisition and activation remain governed server work.
# domainServiceSourceMounts:
#   map-mcp:
#     exchangeClaim: map-source-exchange
#     secretName: map-source-credentials
domainServiceSourceMounts: {}

# Per-service resource overrides avoid inflating every hosted MCP workload when
# one installation-owned acquisition or indexing job needs a larger envelope.
# domainServiceResources:
#   map-mcp:
#     requests:
#       cpu: "1"
#       memory: 1Gi
#     limits:
#       cpu: "8"
#       memory: 8Gi
domainServiceResources: {}

# Stateless ordinary MCP servers may scale independently. Workloads that own a
# GPU, a ReadWriteOnce volume, or another singleton resource remain at one
# replica unless their component-specific chart explicitly models that owner.
domainServiceReplicas:
  chart-mcp: 2

consoleBff:
  image:
    repository: veoveo/console-bff
    tag: 0.1.0
    digest: ""
  replicas: 2
  oauthClientId: admin-console
  oauthResource: https://veoveo.enterprise.example/mcp/admin
  # Network endpoint used only by the Console BFF MCP client. Leave empty to
  # preserve the existing behavior of using oauthResource as the transport.
  mcpTransportUrl: ""
  # Optional installation-owned public CA roots. These roots augment the
  # standard platform trust store for every Console BFF outbound HTTPS client.
  outboundCa:
    existingConfigMap: ""
    key: ca.pem
  # Browser map configuration for embedded Rerun viewers. A Mapbox token is
  # loaded only through the referenced installation-owned Secret.
  rerunMap:
    provider: openStreetMap
    mapbox:
      accessToken:
        existingSecret: ""
        key: mapbox-access-token
  oauthScopes:
    - operator:use
    - admin:manage
    - uav-sim:read
    - uav-sim:control
    - uav-sim:admin
    - uav-sim:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

clusterInspection:
  enabled: false
  kubernetesApiCidrs: []

telemetry:
  enabled: true
  image:
    repository: otel/opentelemetry-collector
    tag: 0.156.0
    digest: ""
  existingConfigMap: veoveo-otel-collector
  configKey: config.yaml
  credentialExistingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: ""
  annotations: {}
  # The /s path is rendered as a separate Ingress so bearer URLs never enter
  # ingress access logs. Replace this annotation for non-ingress-nginx classes.
  publicShareAnnotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
  host: veoveo.enterprise.example
  tls:
    enabled: true
    secretName: veoveo-ingress-tls

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  externalEgressCidrs: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
