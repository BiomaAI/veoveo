global:
  installationId: veoveo
  production: false
  veoveoRegistry: ""
  veoveoTag: ""
  imageDigests: {}
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  existingSecret: veoveo-installation-secrets
  publicBaseUrl: https://veoveo.enterprise.example
  offline: false
  podAnnotations: {}
  podLabels: {}
  serviceMesh:
    enabled: false
    provider: istio
    podAnnotations: {}

installationPreset: full
components: []
mcpServers: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

surrealdb:
  image:
    repository: surrealdb/surrealdb
    tag: v3.2.1
    digest: ""
  namespace: veoveo
  database: platform
  adminExistingSecret: veoveo-surreal-admin
  runtimeExistingSecret: veoveo-surreal-runtime
  persistence:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

objectStore:
  mode: rustfs
  bucketInitImage:
    repository: amazon/aws-cli
    tag: 2.35.23
    digest: ""
  rustfs:
    image:
      repository: rustfs/rustfs
      tag: 1.0.0-beta.8
      digest: ""
    bucket: artifact-plane
    persistence:
      size: 50Gi
      storageClass: ""
      accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
  externalS3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    allowHttp: false

gateway:
  image:
    repository: veoveo/mcp-gateway
    tag: 0.1.0
    digest: ""
  existingControlPlaneConfigMap: veoveo-gateway-control-plane
  controlPlaneKey: gateway.json
  controlPlaneRevision: ""
  refreshDeliveryWindowSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

artifactService:
  image:
    repository: veoveo/artifact-service
    tag: 0.1.0
    digest: ""
  replicas: 2
  allowedAudiences:
    - artifact
    - media
    - timeseries
    - optimization
    - duckdb
    - frames
    - map
    - recording
    - stream
    - reason
    - simulation-view
    - datasheet
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

recording:
  tenantKey: enterprise
  workContext: operations
  classification: unclassified
  labels: []
  route: world=
  idleTimeoutSeconds: 15
  segmentMaxBytes: 201326592
  segmentMaxAgeSeconds: 3600
  liveHistorySeconds: 60
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  hubImage:
    repository: veoveo/recording-hub
    tag: 0.1.0
    digest: ""
  mcpImage:
    repository: veoveo/recording-mcp
    tag: 0.1.0
    digest: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

stream:
  runtimeClassName: nvidia
  image:
    repository: veoveo/stream-mcp
    tag: 0.1.0
    digest: ""
  recordingOutput:
    enabled: false
    proxyUrl: rerun+http://127.0.0.1:9876/proxy
    applicationId: veoveo-sensor
    entityPath: /stream/live
    timeline: stream-time
    queueCapacity: 256
    forwarder:
      image:
        repository: veoveo/recording-forwarder
        tag: 0.1.0
        digest: ""
      gatewayTransportUrl: http://mcp-gateway:8788
      clientId: recording-producer
      keyId: recording-producer-2026
      signingAlgorithm: rs256
      privateKey:
        existingSecret: veoveo-recording-producer
        key: private-key.pem
      maximumQueueBytes: 4294967296
      batchMessageLimit: 4096
      batchFlushMilliseconds: 1000
      grpcMemoryLimitBytes: 268435456
      persistence:
        size: 5Gi
        storageClass: ""
        accessModes: [ReadWriteOnce]
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 2Gi
  modelCache:
    size: 5Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  builderResources:
    requests:
      cpu: 500m
      memory: 2Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: "1"
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 24Gi
      nvidia.com/gpu: "1"

reason:
  runtimeClassName: nvidia
  image:
    repository: veoveo/reason-mcp
    tag: 0.1.0
    digest: ""
  modelCache:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  engine:
    gpuMemoryUtilization: 0.6
    maxModelLen: 8192
  observation:
    width: 640
    height: 360
    maximumFrames: 6
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 24Gi
      nvidia.com/gpu: "1"

simulationView:
  runtimeClassName: nvidia
  mcpImage:
    repository: veoveo/simulation-view-mcp
    tag: 0.1.0
    digest: ""
  rendererImage:
    repository: veoveo/simulation-view-isaac
    tag: 0.1.0
    digest: ""
  poseImage:
    repository: veoveo/simulation-view-pose
    tag: 0.1.0
    digest: ""
  publicSignalingUrl: wss://veoveo.enterprise.example/simulation-view/signaling
  publicMediaIp: 192.0.2.10
  ports:
    mcp: 8808
    rendererControl: 8810
    poseControl: 8811
    poseTls: 7443
    signalingBase: 49100
    mediaBase: 47998
  signaling:
    exposure: Ingress
    nodePort: 0
    loadBalancerIP: ""
    externalTrafficPolicy: Local
  media:
    exposure: LoadBalancer
    nodePortBase: 0
    loadBalancerIP: ""
    externalTrafficPolicy: Local
  poseIngress:
    exposure: ClusterIP
    nodePort: 0
    loadBalancerIP: ""
    externalTrafficPolicy: Local
    existingTlsSecret: simulation-view-pose-tls
    certificateKey: tls.crt.der
    privateKeyKey: tls.key.der
    clientCaKey: ca.crt.der
    allowedCidrs: []
  artifacts:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  sharedMemory:
    sizeLimit: 2Gi
  cache:
    sizeLimit: 20Gi
  capacity:
    profile: rtx4090-development-v1
    maximumLogicalCameras: 16
    maximumRenderedCameras: 4
    maximumStreamedCameras: 2
    maximumRenderPixelsPerSecond: 497664000
    maximumNvencSessions: 2
    gpuMemoryBudgetBytes: 21474836480
    maximumEntityInstances: 10000
    maximumCamerasPerOwner: 8
    maximumCamerasPerWorkContext: 12
    maximumAssetBytes: 4294967296
    maximumFrameAgeMs: 500
    leaseSeconds: 120
    maximumPoseSessions: 64
    maximumPoseConnections: 64
  placement:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  mcpResources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  poseResources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  rendererResources:
    requests:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "1"

# Installation-time server bootstrap documents, keyed by domain-service
# name. Each entry renders a `{name}-bootstrap` ConfigMap mounted at the
# canonical /etc/veoveo/bootstrap/catalog.json and passed to the server via
# --bootstrap-catalog. The payload schema is owned by the server crate;
# validate documents with the server binary's `bootstrap-validate` verb.
# serverBootstrap:
#   map-mcp:
#     server: map
#     tenantKey: installation
#     payload:
#       sources: []
#       mobility_profiles: []
serverBootstrap: {}

consoleBff:
  image:
    repository: veoveo/console-bff
    tag: 0.1.0
    digest: ""
  replicas: 2
  oauthClientId: admin-console
  oauthResource: https://veoveo.enterprise.example/mcp/admin
  # Network endpoint used only by the Console BFF MCP client. Leave empty to
  # preserve the existing behavior of using oauthResource as the transport.
  mcpTransportUrl: ""
  # Optional installation-owned public CA roots. These roots augment the
  # standard platform trust store for every Console BFF outbound HTTPS client.
  outboundCa:
    existingConfigMap: ""
    key: ca.pem
  # Browser map configuration for embedded Rerun viewers. A Mapbox token is
  # loaded only through the referenced installation-owned Secret.
  rerunMap:
    provider: openStreetMap
    mapbox:
      accessToken:
        existingSecret: ""
        key: mapbox-access-token
  oauthScopes:
    - operator:use
    - admin:manage
    - simulation-view:read
    - simulation-view:write
    - simulation-view:stream
    - map:admin
    - map:dataset:read
    - map:feature:admin
    - map:feature:publish
    - map:feature:read
    - map:feature:write
    - map:raster:derive
    - map:spatial:derive
    - time:read
    - view:read
    - view:write
    - view:capture
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

clusterInspection:
  enabled: false
  kubernetesApiCidrs: []

telemetry:
  enabled: true
  image:
    repository: otel/opentelemetry-collector
    tag: 0.156.0
    digest: ""
  existingConfigMap: veoveo-otel-collector
  configKey: config.yaml
  credentialExistingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: ""
  annotations: {}
  # The /s path is rendered as a separate Ingress so bearer URLs never enter
  # ingress access logs. Replace this annotation for non-ingress-nginx classes.
  publicShareAnnotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
  host: veoveo.enterprise.example
  tls:
    enabled: true
    secretName: veoveo-ingress-tls

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  externalEgressCidrs: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
