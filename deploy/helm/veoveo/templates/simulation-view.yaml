{{- if include "veoveo.mcpServerEnabled" (list . "simulation-view") }}
{{- $view := .Values.simulationView -}}
{{- $slots := int $view.capacity.maximumRenderedCameras -}}
{{- $cacheRoot := printf "/var/lib/veoveo/runtime-cache/%s/simulation-view" $view.cache.version -}}
{{- $layerCatalogName := default (printf "%s-simulation-view-layers" (include "veoveo.fullname" .)) $view.streamedWorld.existingConfigMap -}}
{{- if and $view.streamedWorld.existingConfigMap (empty $view.streamedWorld.catalogDigest) -}}
{{- fail "simulationView.streamedWorld.catalogDigest is required with existingConfigMap" -}}
{{- end -}}
{{- $layerCatalogDigest := ternary $view.streamedWorld.catalogDigest (printf "sha256:%s" (toPrettyJson $view.streamedWorld.catalog | sha256sum)) (not (empty $view.streamedWorld.existingConfigMap)) -}}
{{- if and $view.streamedWorld.enabled (empty $view.streamedWorld.egressCidrs) -}}
{{- fail "simulationView.streamedWorld.egressCidrs must admit the configured provider when streamedWorld is enabled" -}}
{{- end -}}
{{- $credentialEnvironments := dict -}}
{{- range $binding := $view.streamedWorld.credentialBindings -}}
{{- if hasKey $credentialEnvironments $binding.environment -}}
{{- fail (printf "simulationView.streamedWorld.credentialBindings contains duplicate environment %s" $binding.environment) -}}
{{- end -}}
{{- $_ := set $credentialEnvironments $binding.environment true -}}
{{- end -}}
{{- if not $view.streamedWorld.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $layerCatalogName }}
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-layer-catalog
data:
  {{ $view.streamedWorld.catalogKey }}: |
    {{- toPrettyJson $view.streamedWorld.catalog | nindent 4 }}
---
{{- end }}
{{- if not $view.artifacts.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simulation-view-artifacts
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-artifacts
spec:
  accessModes:
    {{- toYaml $view.artifacts.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $view.artifacts.size }}
  {{- with $view.artifacts.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
{{- if not $view.cache.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simulation-view-renderer-cache
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer-cache
spec:
  accessModes:
    {{- toYaml $view.cache.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $view.cache.size }}
  {{- with $view.cache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: simulation-view-mcp
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-mcp
spec:
  type: {{ ternary "ClusterIP" $view.signaling.exposure (eq $view.signaling.exposure "Ingress") }}
  {{- if and (eq $view.signaling.exposure "LoadBalancer") $view.signaling.loadBalancerIP }}
  loadBalancerIP: {{ $view.signaling.loadBalancerIP | quote }}
  {{- end }}
  {{- if or (eq $view.signaling.exposure "LoadBalancer") (eq $view.signaling.exposure "NodePort") }}
  externalTrafficPolicy: {{ $view.signaling.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-mcp
  ports:
    - name: http
      protocol: TCP
      port: {{ $view.ports.mcp }}
      targetPort: http
      {{- if eq $view.signaling.exposure "NodePort" }}
      nodePort: {{ $view.signaling.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-view-renderer
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer
spec:
  type: ClusterIP
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer
  ports:
    - name: render-control
      protocol: TCP
      port: {{ $view.ports.rendererControl }}
      targetPort: render-control
    - name: pose-control
      protocol: TCP
      port: {{ $view.ports.poseControl }}
      targetPort: pose-control
    {{- range $slot := until $slots }}
    - name: {{ printf "signal-%d" $slot }}
      protocol: TCP
      port: {{ add $view.ports.signalingBase $slot }}
      targetPort: {{ printf "signal-%d" $slot }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-view-pose
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-pose
spec:
  type: {{ $view.poseIngress.exposure }}
  {{- if and (eq $view.poseIngress.exposure "LoadBalancer") $view.poseIngress.loadBalancerIP }}
  loadBalancerIP: {{ $view.poseIngress.loadBalancerIP | quote }}
  {{- end }}
  {{- if or (eq $view.poseIngress.exposure "LoadBalancer") (eq $view.poseIngress.exposure "NodePort") }}
  externalTrafficPolicy: {{ $view.poseIngress.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer
  ports:
    - name: pose-tls
      protocol: TCP
      port: {{ $view.ports.poseTls }}
      targetPort: pose-tls
      {{- if eq $view.poseIngress.exposure "NodePort" }}
      nodePort: {{ $view.poseIngress.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-view-media
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-media
spec:
  type: {{ $view.media.exposure }}
  {{- if and (eq $view.media.exposure "LoadBalancer") $view.media.loadBalancerIP }}
  loadBalancerIP: {{ $view.media.loadBalancerIP | quote }}
  {{- end }}
  {{- if or (eq $view.media.exposure "LoadBalancer") (eq $view.media.exposure "NodePort") }}
  externalTrafficPolicy: {{ $view.media.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer
  ports:
    {{- range $slot := until $slots }}
    - name: {{ printf "media-%d" $slot }}
      protocol: UDP
      port: {{ add $view.ports.mediaBase $slot }}
      targetPort: {{ printf "media-%d" $slot }}
      {{- if eq $view.media.exposure "NodePort" }}
      nodePort: {{ add $view.media.nodePortBase $slot }}
      {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-view-mcp
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "veoveo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: simulation-view-mcp
  template:
    metadata:
      labels:
        {{- include "veoveo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: simulation-view-mcp
      annotations:
        {{- include "veoveo.podAnnotations" . | nindent 8 }}
        veoveo.ai/chart-revision: {{ .Chart.Version | quote }}
    spec:
      serviceAccountName: {{ include "veoveo.serviceAccountName" . }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- include "veoveo.podSecurityContext" . | nindent 8 }}
      containers:
        - name: simulation-view-mcp
          image: {{ include "veoveo.ownedImage" (list . $view.mcpImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --port
            - {{ $view.ports.mcp | quote }}
            - --allowed-host
            - {{ printf "simulation-view-mcp:%v" $view.ports.mcp | quote }}
            - --capacity-profile
            - {{ $view.capacity.profile | quote }}
            - --maximum-logical-cameras
            - {{ $view.capacity.maximumLogicalCameras | quote }}
            - --maximum-rendered-cameras
            - {{ $view.capacity.maximumRenderedCameras | quote }}
            - --maximum-streamed-cameras
            - {{ $view.capacity.maximumStreamedCameras | quote }}
            - --maximum-render-pixels-per-second
            - {{ printf "%.0f" $view.capacity.maximumRenderPixelsPerSecond | quote }}
            - --maximum-nvenc-sessions
            - {{ $view.capacity.maximumNvencSessions | quote }}
            - --gpu-memory-budget-bytes
            - {{ printf "%.0f" $view.capacity.gpuMemoryBudgetBytes | quote }}
            - --maximum-entity-instances
            - {{ $view.capacity.maximumEntityInstances | quote }}
            - --maximum-cameras-per-owner
            - {{ $view.capacity.maximumCamerasPerOwner | quote }}
            - --maximum-cameras-per-work-context
            - {{ $view.capacity.maximumCamerasPerWorkContext | quote }}
            - --maximum-asset-bytes
            - {{ printf "%.0f" $view.capacity.maximumAssetBytes | quote }}
            - --maximum-frame-age-ms
            - {{ $view.capacity.maximumFrameAgeMs | quote }}
            - --lease-seconds
            - {{ $view.capacity.leaseSeconds | quote }}
            - --reconcile-retry-delay-seconds
            - {{ $view.reconciliation.retryDelaySeconds | quote }}
            - --authorization-renewal-lead-seconds
            - {{ $view.reconciliation.authorizationRenewalLeadSeconds | quote }}
          env:
            {{- include "veoveo.surrealEnv" . | nindent 12 }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.global.publicBaseUrl | quote }}
            - name: VEOVEO_INTERNAL_TRUST_JWKS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: internal-trust-jwks
            - name: SIMULATION_VIEW_RENDERER_ENDPOINT
              value: {{ printf "http://simulation-view-renderer:%v" $view.ports.rendererControl | quote }}
            - name: ARTIFACT_SERVICE_URL
              value: http://artifact-service:8790
            - name: SIMULATION_VIEW_POSE_ENDPOINT
              value: {{ printf "http://simulation-view-renderer:%v" $view.ports.poseControl | quote }}
            - name: SIMULATION_VIEW_RENDERER_SIGNALING_URL
              value: {{ printf "ws://simulation-view-renderer:%v" $view.ports.signalingBase | quote }}
            - name: SIMULATION_VIEW_PUBLIC_SIGNALING_URL
              value: {{ $view.publicSignalingUrl | quote }}
            - name: SIMULATION_VIEW_PUBLIC_MEDIA_IP
              value: {{ required "simulationView.publicMediaIp is required" $view.publicMediaIp | quote }}
            - name: SIMULATION_VIEW_PUBLIC_MEDIA_PORT
              value: {{ $view.ports.mediaBase | quote }}
            - name: SIMULATION_VIEW_RENDERER_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: simulation-view-renderer-control-token
            - name: SIMULATION_VIEW_POSE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: simulation-view-pose-control-token
            - name: SIMULATION_VIEW_LAYER_CATALOG
              value: /etc/veoveo/simulation-view/layers.json
            {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: veoveo-simulation-view-mcp
          ports:
            - name: http
              containerPort: {{ $view.ports.mcp }}
          readinessProbe:
            httpGet:
              path: /simulation-view/readyz
              port: http
              httpHeaders:
                - name: Host
                  value: {{ printf "simulation-view-mcp:%v" $view.ports.mcp | quote }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /simulation-view/healthz
              port: http
              httpHeaders:
                - name: Host
                  value: {{ printf "simulation-view-mcp:%v" $view.ports.mcp | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $view.mcpResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: simulation-view-layer-catalog
              mountPath: /etc/veoveo/simulation-view/layers.json
              subPath: {{ $view.streamedWorld.catalogKey }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: simulation-view-layer-catalog
          configMap:
            name: {{ $layerCatalogName }}
            items:
              - key: {{ $view.streamedWorld.catalogKey }}
                path: {{ $view.streamedWorld.catalogKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-view-renderer
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-view-renderer
spec:
  replicas: {{ include "veoveo.gpuReplicas" (list . "simulation-view-renderer") }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "veoveo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: simulation-view-renderer
  template:
    metadata:
      labels:
        {{- include "veoveo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: simulation-view-renderer
      annotations:
        {{- include "veoveo.podAnnotations" . | nindent 8 }}
        {{- include "veoveo.gpuPodAnnotations" (list . "simulation-view-renderer") | nindent 8 }}
        checksum/simulation-view-layer-catalog: {{ $layerCatalogDigest | quote }}
        veoveo.ai/chart-revision: {{ .Chart.Version | quote }}
    spec:
      runtimeClassName: {{ include "veoveo.gpuRuntimeClass" (list . (required "simulationView.runtimeClassName is required" $view.runtimeClassName)) }}
      {{- include "veoveo.gpuPodClaim" (list . "simulation-view-renderer") | nindent 6 }}
      serviceAccountName: {{ include "veoveo.serviceAccountName" . }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- include "veoveo.podSecurityContext" . | nindent 8 }}
      {{- with $view.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $view.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $view.placement.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: artifact-volume-permissions
          image: {{ include "veoveo.ownedImage" (list . $view.poseImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - install -d -o 10001 -g 10001 -m 0700 /artifacts/sha256
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      containers:
        - name: simulation-view-isaac
          image: {{ include "veoveo.ownedImage" (list . $view.rendererImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: SIMULATION_VIEW_RENDERER_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: simulation-view-renderer-control-token
            - name: SIMULATION_VIEW_RUNTIME_EVENT_URL
              value: {{ printf "http://simulation-view-mcp:%v/simulation-view/runtime-events/renderer" $view.ports.mcp | quote }}
            - name: SIMULATION_VIEW_LAYER_CATALOG
              value: /etc/veoveo/simulation-view/layers.json
            {{- range $binding := $view.streamedWorld.credentialBindings }}
            - name: {{ $binding.environment }}
              valueFrom:
                secretKeyRef:
                  name: {{ $binding.existingSecret }}
                  key: {{ $binding.key }}
            {{- end }}
            - name: SIMULATION_VIEW_ARTIFACT_DIRECTORY
              value: /var/lib/veoveo/simulation-view/artifacts
            - name: SIMULATION_VIEW_MAXIMUM_ARTIFACT_BYTES
              value: {{ printf "%.0f" $view.capacity.maximumAssetBytes | quote }}
            - name: SIMULATION_VIEW_POSE_DIRECTORY
              value: /dev/shm/veoveo/simulation-view
            - name: SIMULATION_VIEW_RENDERER_CACHE_DIRECTORY
              value: {{ $cacheRoot | quote }}
            - name: HOME
              value: {{ printf "%s/home" $cacheRoot | quote }}
            - name: MPLCONFIGDIR
              value: {{ printf "%s/matplotlib" $cacheRoot | quote }}
            - name: WARP_CACHE_PATH
              value: {{ printf "%s/warp" $cacheRoot | quote }}
            - name: XDG_CACHE_HOME
              value: {{ printf "%s/xdg-cache" $cacheRoot | quote }}
            - name: XDG_DATA_HOME
              value: {{ printf "%s/xdg-data" $cacheRoot | quote }}
            - name: SIMULATION_VIEW_RENDERER_CONTROL_PORT
              value: {{ $view.ports.rendererControl | quote }}
            - name: SIMULATION_VIEW_MAXIMUM_RENDER_SLOTS
              value: {{ $view.capacity.maximumRenderedCameras | quote }}
            - name: SIMULATION_VIEW_STREAM_TARGET_FPS
              value: {{ $view.streamTargetFps | quote }}
            - name: SIMULATION_VIEW_FRAME_STALE_AFTER_MS
              value: {{ $view.capacity.maximumFrameAgeMs | quote }}
            - name: SIMULATION_VIEW_SIGNALING_PORT_BASE
              value: {{ $view.ports.signalingBase | quote }}
            - name: SIMULATION_VIEW_MEDIA_PORT_BASE
              value: {{ $view.ports.mediaBase | quote }}
            - name: SIMULATION_VIEW_PUBLIC_MEDIA_IP
              value: {{ required "simulationView.publicMediaIp is required" $view.publicMediaIp | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,graphics,utility,video
          ports:
            - name: render-control
              containerPort: {{ $view.ports.rendererControl }}
            {{- range $slot := until $slots }}
            - name: {{ printf "signal-%d" $slot }}
              protocol: TCP
              containerPort: {{ add $view.ports.signalingBase $slot }}
            - name: {{ printf "media-%d" $slot }}
              protocol: UDP
              containerPort: {{ add $view.ports.mediaBase $slot }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: render-control
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: render-control
            periodSeconds: 5
            timeoutSeconds: 3
          # Isaac/RTX can retain the Python GIL for more than Kubernetes'
          # one-second default while it commits streamed-world and render-
          # product work. Readiness still reports those transient stalls;
          # liveness must allow one bounded render transition to complete
          # instead of SIGKILLing an otherwise healthy renderer.
          livenessProbe:
            httpGet:
              path: /healthz
              port: render-control
            initialDelaySeconds: 30
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 10
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- include "veoveo.gpuResources" (list . "simulation-view-renderer" $view.rendererResources) | nindent 12 }}
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/veoveo/simulation-view/artifacts
            - name: shared-memory
              mountPath: /dev/shm
            - name: renderer-cache
              mountPath: /var/lib/veoveo/runtime-cache
            - name: renderer-tmp
              mountPath: /tmp
            - name: simulation-view-layer-catalog
              mountPath: /etc/veoveo/simulation-view/layers.json
              subPath: {{ $view.streamedWorld.catalogKey }}
              readOnly: true
        - name: simulation-view-pose
          image: {{ include "veoveo.ownedImage" (list . $view.poseImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --http-port
            - {{ $view.ports.poseControl | quote }}
            - --tls-port
            - {{ $view.ports.poseTls | quote }}
            - --maximum-sessions
            - {{ $view.capacity.maximumPoseSessions | quote }}
            - --maximum-connections
            - {{ $view.capacity.maximumPoseConnections | quote }}
          env:
            - name: SIMULATION_VIEW_POSE_DIRECTORY
              value: /dev/shm/veoveo/simulation-view
            - name: SIMULATION_VIEW_POSE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: simulation-view-pose-control-token
            - name: SIMULATION_VIEW_RUNTIME_EVENT_URL
              value: {{ printf "http://simulation-view-mcp:%v/simulation-view/runtime-events/pose-ingress" $view.ports.mcp | quote }}
            - name: SIMULATION_VIEW_POSE_TLS_CERT_DER
              value: {{ printf "/run/secrets/pose-tls/%s" $view.poseIngress.certificateKey | quote }}
            - name: SIMULATION_VIEW_POSE_TLS_KEY_DER
              value: {{ printf "/run/secrets/pose-tls/%s" $view.poseIngress.privateKeyKey | quote }}
            - name: SIMULATION_VIEW_POSE_CLIENT_CA_DER
              value: {{ printf "/run/secrets/pose-tls/%s" $view.poseIngress.clientCaKey | quote }}
          ports:
            - name: pose-control
              containerPort: {{ $view.ports.poseControl }}
            - name: pose-tls
              containerPort: {{ $view.ports.poseTls }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: pose-control
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: pose-control
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $view.poseResources | nindent 12 }}
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
            - name: pose-tls
              mountPath: /run/secrets/pose-tls
              readOnly: true
            - name: pose-tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default "simulation-view-artifacts" $view.artifacts.existingClaim }}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ $view.sharedMemory.sizeLimit }}
        - name: renderer-cache
          persistentVolumeClaim:
            claimName: {{ default "simulation-view-renderer-cache" $view.cache.existingClaim }}
        - name: renderer-tmp
          emptyDir: {}
        - name: pose-tmp
          emptyDir: {}
        - name: simulation-view-layer-catalog
          configMap:
            name: {{ $layerCatalogName }}
            items:
              - key: {{ $view.streamedWorld.catalogKey }}
                path: {{ $view.streamedWorld.catalogKey }}
        - name: pose-tls
          secret:
            secretName: {{ required "simulationView.poseIngress.existingTlsSecret is required" $view.poseIngress.existingTlsSecret }}
            items:
              - key: {{ $view.poseIngress.certificateKey }}
                path: {{ $view.poseIngress.certificateKey }}
              - key: {{ $view.poseIngress.privateKeyKey }}
                path: {{ $view.poseIngress.privateKeyKey }}
              - key: {{ $view.poseIngress.clientCaKey }}
                path: {{ $view.poseIngress.clientCaKey }}
{{- end }}
