{{- if include "veoveo.componentEnabled" (list . "recording-data-plane") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recording-spool
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording
spec:
  accessModes:
    {{- toYaml .Values.recording.persistence.accessModes | nindent 4 }}
  {{- if .Values.recording.persistence.storageClass }}
  storageClassName: {{ .Values.recording.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.recording.persistence.size }}
{{- if include "veoveo.mcpServerEnabled" (list . "recording") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recording-catalog-cache
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording
spec:
  accessModes:
    {{- toYaml .Values.recording.catalogCache.accessModes | nindent 4 }}
  {{- if .Values.recording.catalogCache.storageClass }}
  storageClassName: {{ .Values.recording.catalogCache.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.recording.catalogCache.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: recording-hub
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording
spec:
  type: ClusterIP
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: recording
  ports:
    - name: ingest-api
      port: 9878
      targetPort: ingest-api
{{- if include "veoveo.mcpServerEnabled" (list . "recording") }}
---
apiVersion: v1
kind: Service
metadata:
  name: recording-mcp
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording
spec:
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: recording
  ports:
    - name: http
      port: 8796
      targetPort: recording-mcp
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: recording
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "veoveo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recording
  template:
    metadata:
      labels:
        {{- include "veoveo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recording
      annotations:
        {{- include "veoveo.podAnnotations" . | nindent 8 }}
        veoveo.ai/chart-revision: {{ .Chart.Version | quote }}
    spec:
      serviceAccountName: {{ include "veoveo.serviceAccountName" . }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- include "veoveo.podSecurityContext" . | nindent 8 }}
      containers:
        - name: recording-hub
          image: {{ include "veoveo.ownedImage" (list . .Values.recording.hubImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - spooler
            - --bind
            - 127.0.0.1:9876
            - --internal-ingest-bind
            - 0.0.0.0:9878
            - --spool-dir
            - /recordings
            - --journal-dir
            - /recordings/.ingest-journal
            - --route
            - {{ .Values.recording.route | quote }}
            - --recording-idle-timeout-s
            - {{ .Values.recording.idleTimeoutSeconds | quote }}
            - --capture-layer-max-bytes
            - {{ printf "%.0f" .Values.recording.captureLayerMaxBytes | quote }}
            - --minimum-free-bytes
            - {{ printf "%.0f" .Values.recording.spoolMinimumFreeBytes | quote }}
            - --capture-layer-max-age-s
            - {{ printf "%.0f" .Values.recording.captureLayerMaxAgeSeconds | quote }}
            - --blueprint-max-bytes
            - {{ printf "%.0f" .Values.recording.blueprintMaxBytes | quote }}
            - --blueprint-max-messages
            - {{ printf "%.0f" .Values.recording.blueprintMaxMessages | quote }}
            - --blueprint-max-revisions
            - {{ .Values.recording.blueprintMaxRevisions | quote }}
          env:
            {{- include "veoveo.commonEnv" . | nindent 12 }}
            - name: RECORDING_TENANT_KEY
              value: {{ .Values.recording.tenantKey | quote }}
            - name: RECORDING_WORK_CONTEXT
              value: {{ .Values.recording.workContext | quote }}
            - name: RECORDING_OWNER_KEY
              value: recording-hub
            - name: RECORDING_OWNER_ISSUER
              value: https://veoveo.local/services
            - name: RECORDING_OWNER_SUBJECT
              value: recording-hub
            - name: RECORDING_CLASSIFICATION
              value: {{ .Values.recording.classification | quote }}
            - name: RECORDING_INGEST_PROTECTED_RESOURCE
              value: {{ printf "%s/ingest/recordings" (trimSuffix "/" .Values.global.publicBaseUrl) | quote }}
            - name: VEOVEO_GATEWAY_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.global.publicBaseUrl) | quote }}
            - name: VEOVEO_RECORDING_GATEWAY_TRANSPORT_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.recording.publication.gatewayTransportUrl) | quote }}
            - name: VEOVEO_RECORDING_PUBLICATION_RESOURCE
              value: {{ printf "%s/recordings/publish" (trimSuffix "/" .Values.global.publicBaseUrl) | quote }}
            - name: VEOVEO_RECORDING_PUBLICATION_PROFILE
              value: {{ .Values.recording.publication.profile | quote }}
            - name: VEOVEO_RECORDING_HUB_CLIENT_ID
              value: {{ .Values.recording.publication.clientId | quote }}
            - name: VEOVEO_RECORDING_HUB_PRIVATE_KEY_PEM_FILE
              value: /var/run/veoveo/recording-hub/private-key.pem
            - name: VEOVEO_RECORDING_HUB_KEY_ID
              value: {{ .Values.recording.publication.keyId | quote }}
            - name: VEOVEO_RECORDING_HUB_SIGNING_ALGORITHM
              value: {{ .Values.recording.publication.signingAlgorithm | quote }}
            {{- if .Values.recording.labels }}
            - name: RECORDING_LABELS
              value: {{ join "," .Values.recording.labels | quote }}
            {{- end }}
            - name: HOME
              value: /tmp
            - name: OTEL_SERVICE_NAME
              value: veoveo-recording-hub
          ports:
            - name: ingest-api
              containerPort: 9878
          readinessProbe:
            httpGet:
              path: /readyz
              port: ingest-api
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ingest-api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.recording.hubResources | nindent 12 }}
          volumeMounts:
            - name: recordings
              mountPath: /recordings
            - name: recording-hub-tmp
              mountPath: /tmp
            - name: recording-hub-key
              mountPath: /var/run/veoveo/recording-hub
              readOnly: true
        {{- if include "veoveo.mcpServerEnabled" (list . "recording") }}
        - name: recording-mcp
          image: {{ include "veoveo.ownedImage" (list . .Values.recording.mcpImage) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --port
            - "8796"
            - --spool-dir
            - /recordings
            - --catalog-cache-dir
            - /recording-cache
            - --catalog-cache-managed-bytes
            - {{ printf "%.0f" .Values.recording.catalogCache.managedBytes | quote }}
            - --catalog-cache-minimum-free-bytes
            - {{ printf "%.0f" .Values.recording.catalogCache.minimumFreeBytes | quote }}
            - --projection-scratch-bytes
            - {{ printf "%.0f" .Values.recording.projection.aggregateScratchBytes | quote }}
            - --projection-minimum-free-bytes
            - {{ printf "%.0f" .Values.recording.projection.minimumFreeBytes | quote }}
            - --projection-concurrency
            - {{ .Values.recording.projection.concurrency | quote }}
            - --projection-deadline-ms
            - {{ .Values.recording.projection.deadlineMilliseconds | quote }}
            - --allowed-host
            - recording-mcp:8796
            - --artifact-service-url
            - http://artifact-service:8790
            - --live-history-seconds
            - {{ .Values.recording.liveHistorySeconds | quote }}
          env:
            {{- include "veoveo.commonEnv" . | nindent 12 }}
            - name: VEOVEO_GATEWAY_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.global.publicBaseUrl) | quote }}
            - name: VEOVEO_RECORDING_GATEWAY_TRANSPORT_URL
              value: {{ printf "%s/" (trimSuffix "/" .Values.recording.publication.gatewayTransportUrl) | quote }}
            - name: VEOVEO_RECORDING_PUBLICATION_RESOURCE
              value: {{ printf "%s/recordings/publish" (trimSuffix "/" .Values.global.publicBaseUrl) | quote }}
            - name: VEOVEO_RECORDING_PUBLICATION_PROFILE
              value: {{ .Values.recording.publication.profile | quote }}
            - name: VEOVEO_RECORDING_MCP_PUBLISHER_CLIENT_ID
              value: {{ .Values.recording.mcpPublisher.clientId | quote }}
            - name: VEOVEO_RECORDING_MCP_PUBLISHER_PRIVATE_KEY_PEM_FILE
              value: /var/run/veoveo/recording-mcp-publisher/private-key.pem
            - name: VEOVEO_RECORDING_MCP_PUBLISHER_KEY_ID
              value: {{ .Values.recording.mcpPublisher.keyId | quote }}
            - name: VEOVEO_RECORDING_MCP_PUBLISHER_SIGNING_ALGORITHM
              value: {{ .Values.recording.mcpPublisher.signingAlgorithm | quote }}
            - name: RECORDING_PLAYBACK_PUBLIC_URL
              value: {{ trimSuffix "/" .Values.global.publicBaseUrl | quote }}
            - name: RECORDING_PLAYBACK_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: recording-playback-token-key
            - name: OTEL_SERVICE_NAME
              value: veoveo-recording-mcp
          ports:
            - name: recording-mcp
              containerPort: 8796
          readinessProbe:
            httpGet:
              path: /readyz
              port: recording-mcp
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: recording-mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.recording.mcpResources | nindent 12 }}
          volumeMounts:
            - name: recordings
              mountPath: /recordings
              readOnly: true
            - name: recording-mcp-tmp
              mountPath: /tmp
            - name: recording-catalog-cache
              mountPath: /recording-cache
            - name: recording-mcp-publisher-key
              mountPath: /var/run/veoveo/recording-mcp-publisher
              readOnly: true
        {{- end }}
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: recording-spool
        - name: recording-hub-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if include "veoveo.mcpServerEnabled" (list . "recording") }}
        - name: recording-mcp-tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        - name: recording-hub-key
          secret:
            secretName: {{ .Values.recording.publication.privateKey.existingSecret }}
            items:
              - key: {{ .Values.recording.publication.privateKey.key }}
                path: private-key.pem
        {{- if include "veoveo.mcpServerEnabled" (list . "recording") }}
        - name: recording-mcp-publisher-key
          secret:
            secretName: {{ .Values.recording.mcpPublisher.privateKey.existingSecret }}
            items:
              - key: {{ .Values.recording.mcpPublisher.privateKey.key }}
                path: private-key.pem
        - name: recording-catalog-cache
          persistentVolumeClaim:
            claimName: recording-catalog-cache
        {{- end }}
{{- end }}
