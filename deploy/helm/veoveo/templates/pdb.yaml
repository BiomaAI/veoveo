{{- if .Values.podDisruptionBudget.enabled }}
{{- $workloads := list -}}
{{- if include "veoveo.componentEnabled" (list . "artifact-service") -}}
{{- $workloads = append $workloads (dict "name" "artifact-service" "component" "artifact-service") -}}
{{- end -}}
{{- if include "veoveo.componentEnabled" (list . "console") -}}
{{- $workloads = append $workloads (dict "name" "console-bff" "component" "console-bff") -}}
{{- end -}}
{{- range $workload := $workloads }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $workload.name }}
  labels:
    {{- include "veoveo.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "veoveo.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $workload.component }}
{{- end }}
{{- end }}
