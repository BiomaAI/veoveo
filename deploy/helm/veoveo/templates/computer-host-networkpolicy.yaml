{{- if and (eq .Values.computerCapacity "openshell-docker") .Values.networkPolicy.enabled -}}
{{- if not .Values.computers.host.registryEgress -}}
{{- fail "configured Computer host with NetworkPolicy requires computers.host.registryEgress CIDR/port rules" -}}
{{- end }}
{{- if not .Values.computers.host.issuerEgress -}}
{{- fail "configured Computer host with NetworkPolicy requires computers.host.issuerEgress: installation-supplied issuer and JWKS IPv4 CIDRs for HTTPS (TCP 443)" -}}
{{- end }}
{{- range .Values.computers.host.issuerEgress }}
{{- if not (regexMatch `^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(?:[1-9]|[12][0-9]|3[0-2])$` .) -}}
{{- fail "computers.host.issuerEgress requires valid explicit IPv4 CIDRs with prefix 1-32; catchall internet access is forbidden" -}}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veoveo.fullname" . }}-computer-host
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veoveo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: computer-host
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "veoveo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: computers-mcp
      ports:
        - protocol: TCP
          port: 8805
        - protocol: TCP
          port: 8806
  egress:
    {{- range .Values.computers.host.registryEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- range .Values.computers.host.issuerEgress }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
