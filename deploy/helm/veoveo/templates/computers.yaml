{{- if include "veoveo.mcpServerEnabled" (list . "computers") }}
{{- $configured := eq .Values.computerCapacity "openshell-docker" -}}
{{- $configName := "computers-configuration" -}}
{{- $configuration := "" -}}
{{- if $configured -}}
{{- $configName = required "configured Computers requires computers.existingConfigMap" .Values.computers.existingConfigMap -}}
{{- $_ := required "configured Computers requires computers.existingTrustSecret" .Values.computers.existingTrustSecret -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" .Values.computers.configurationRevision) -}}
{{- fail "configured Computers requires computers.configurationRevision (SHA-256 of computers.json)" -}}
{{- end -}}
{{- else -}}
{{- if gt (int .Values.computers.access.idleSeconds) (int .Values.computers.access.absoluteSeconds) -}}
{{- fail "Computers access.idleSeconds must not exceed access.absoluteSeconds" -}}
{{- end -}}
{{- if or .Values.computers.existingConfigMap .Values.computers.existingTrustSecret .Values.computers.configurationRevision -}}
{{- fail "Computers configuration and trust require computerCapacity=openshell-docker" -}}
{{- end -}}
{{- /* An RFC 9562 UUIDv8 identifies only this unconfigured control surface.
Configured provider identities belong to the installation's explicit JSON file. */ -}}
{{- $hash := printf "veoveo.io/computers-unconfigured/v1/%s/%s/%s" .Values.global.installationId .Release.Namespace .Release.Name | sha256sum -}}
{{- $identity := printf "%s-%s-8%s-a%s-%s" (substr 0 8 $hash) (substr 8 12 $hash) (substr 13 16 $hash) (substr 17 20 $hash) (substr 20 32 $hash) -}}
{{- $configuration = dict "schema" "veoveo.io/computers-service/v2" "listen" "0.0.0.0:8804" "allowedHosts" (list "computers-mcp:8804") "allowedOrigins" (list .Values.global.publicBaseUrl) "access" .Values.computers.access "providerInstanceId" $identity "capacity" (dict "kind" "unconfigured") | toJson -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configName }}
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: computers-mcp
data:
  computers.json: {{ $configuration | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: computers-mcp
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: computers-mcp
spec:
  selector:
    {{- include "veoveo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: computers-mcp
  ports:
    - name: http
      port: 8804
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computers-mcp
  labels:
    {{- include "veoveo.labels" . | nindent 4 }}
    app.kubernetes.io/component: computers-mcp
spec:
  replicas: {{ .Values.computers.replicas }}
  selector:
    matchLabels:
      {{- include "veoveo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: computers-mcp
  template:
    metadata:
      labels:
        {{- include "veoveo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: computers-mcp
      annotations:
        {{- include "veoveo.podAnnotations" . | nindent 8 }}
        checksum/computers-configuration: {{ ternary .Values.computers.configurationRevision ($configuration | sha256sum) $configured | quote }}
    spec:
      serviceAccountName: {{ include "veoveo.serviceAccountName" . }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- include "veoveo.podSecurityContext" . | nindent 8 }}
      containers:
        - name: computers-mcp
          image: {{ include "veoveo.ownedImage" (list . .Values.computers.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config", "/etc/veoveo/computers/config/computers.json"]
          env:
            {{- include "veoveo.commonEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8804
          readinessProbe:
            httpGet:
              path: /computers/healthz
              port: http
              httpHeaders:
                - name: Host
                  value: computers-mcp:8804
            periodSeconds: 5
            timeoutSeconds: 6
          securityContext:
            {{- include "veoveo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.computers.resources | nindent 12 }}
          volumeMounts:
            - name: configuration
              mountPath: /etc/veoveo/computers/config
              readOnly: true
            {{- if $configured }}
            - name: trust
              mountPath: /etc/veoveo/computers/trust
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: {{ $configName }}
            items:
              - key: computers.json
                path: computers.json
        {{- if $configured }}
        - name: trust
          secret:
            secretName: {{ .Values.computers.existingTrustSecret }}
            defaultMode: 0440
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
