    - --port
    - "8798"
    - --allowed-host
    - datasheet-mcp:8798
    - --artifact-service-url
    - http://artifact-service:8790
- name: duckdb-mcp
  image:
    repository: veoveo/duckdb-mcp
    tag: 0.1.0
    digest: ""
  port: 8791
  healthPath: /duckdb/healthz
  args:
    - --port
    - "8791"
    - --allowed-host
    - duckdb-mcp:8791
    - --database-dir
    - /var/lib/veoveo/duckdb/databases
    - --exchange-dir
    - /var/lib/veoveo/duckdb/exchange
    - --spill-dir
    - /var/lib/veoveo/duckdb/spill
    - --spatial-extension
    - /usr/local/lib/duckdb/extensions/spatial.duckdb_extension
    - --artifact-service-url
    - http://artifact-service:8790
    - --max-artifact-bytes
    - "536870912"
  duckdbSandbox: true
  persistence:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
- name: chart-mcp
  image:
    repository: veoveo/chart-mcp
    tag: 0.1.0
    digest: ""
  port: 8795
  healthPath: /health
  platformStore: false
  args:
    - --host
    - 0.0.0.0
    - --port
    - "8795"
    - --path
    - /mcp
    - --allowed-hosts
    - chart-mcp:8795
    - --disable-file-reference
- name: rerun-bridge
  image:
    repository: veoveo/mcp-stdio-bridge
    tag: 0.1.0
    digest: ""
  port: 8790
  healthPath: /healthz
  platformStore: false
  args:
    - --listen
    - 0.0.0.0:8790
    - --allowed-host
    - rerun-bridge:8790
    - --
    - rerun
    - viewer-mcp
