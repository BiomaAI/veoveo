- name: map-mcp
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 3
  image:
    repository: veoveo/map-mcp
    tag: 0.1.0
    digest: ""
  port: 8799
  healthPath: /map/healthz
  args:
    - serve
    - --port
    - "8799"
    - --allowed-host
    - map-mcp:8799
    - --artifact-service-url
    - http://artifact-service:8790
    - --map-database
    - /var/lib/veoveo/map/catalog.duckdb
    - --duckdb-spill-dir
    - /var/lib/veoveo/map/spill
    - --acquisition-scratch-root
    - /var/lib/veoveo/map/acquisitions
    - --authoring-task-root
    - /var/lib/veoveo/map/authoring-tasks
    - --release-root
    - /var/lib/veoveo/map/releases
    - --source-mount-root
    - /data/map-sources
    - --max-artifact-bytes
    - "536870912"
    - --max-routing-expanded-bytes
    - "17179869184"
  persistenceMountPath: /var/lib/veoveo/map
  sourceExchangeClaim: ""
  sourceSecretName: ""
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
