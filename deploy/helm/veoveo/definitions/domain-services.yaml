- name: map-mcp
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 3
  image:
    repository: veoveo/map-mcp
    tag: 0.1.0
    digest: ""
  port: 8799
  healthPath: /map/healthz
  args:
    - serve
    - --port
    - "8799"
    - --allowed-host
    - map-mcp:8799
    - --artifact-service-url
    - http://artifact-service:8790
    - --map-database
    - /var/lib/veoveo/map/catalog.duckdb
    - --duckdb-spill-dir
    - /var/lib/veoveo/map/spill
    - --acquisition-scratch-root
    - /var/lib/veoveo/map/acquisitions
    - --authoring-task-root
    - /var/lib/veoveo/map/authoring-tasks
    - --release-root
    - /var/lib/veoveo/map/releases
    - --source-mount-root
    - /data/map-sources
    - --max-artifact-bytes
    - "536870912"
    - --max-routing-expanded-bytes
    - "17179869184"
  persistenceMountPath: /var/lib/veoveo/map
  sourceExchangeClaim: ""
  sourceSecretName: ""
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
- name: time-mcp
  image:
    repository: veoveo/time-mcp
    tag: 0.1.0
    digest: ""
  port: 8800
  healthPath: /time/healthz
  args:
    - --port
    - "8800"
    - --allowed-host
    - time-mcp:8800
    - --acquisition-scratch-root
    - /var/lib/veoveo/time/acquisitions
    - --release-root
    - /var/lib/veoveo/time/releases
  persistenceMountPath: /var/lib/veoveo/time
  persistence:
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
- name: view-mcp
  runtimeClassName: nvidia
  image:
    repository: veoveo/view-mcp
    tag: 0.1.0
    digest: ""
  port: 8801
  healthPath: /view/readyz
  args:
    - --port
    - "8801"
    - --allowed-host
    - view-mcp:8801
    - --layer-catalog
    - /etc/veoveo/view/layers.json
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 16Gi
      nvidia.com/gpu: "1"
- name: datasheet-mcp
  image:
    repository: veoveo/datasheet-mcp
