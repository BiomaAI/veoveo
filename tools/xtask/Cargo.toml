[package]
name = "veoveo-xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio.workspace = true
veoveo-types.workspace = true
veoveo-testing-support = { path = "../../testing/support" }
veoveo-artifact-contract.workspace = true
veoveo-gateway-catalog.workspace = true
veoveo-agent-runtime = { workspace = true, features = ["contract"] }
veoveo-workspace = { workspace = true, features = ["app-contract"] }
veoveo-simulation-contract.workspace = true
veoveo-speech-contract = { path = "../../servers/speech-mcp/contract" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
protoc-bin-vendored = "=3.2.0"
rcgen.workspace = true
veoveo-console-bff = { path = "../../apps/console/bff", default-features = false, features = ["contract"] }
schemars.workspace = true
veoveo-recording-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"
url.workspace = true
uuid.workspace = true
veoveo-deploy-contract.workspace = true
veoveo-computers-contract = { path = "../../platform/computers/contract" }
veoveo-audit-contract = { path = "../../platform/audit/contract" }
veoveo-deploy-runtime.workspace = true
veoveo-image-build-control.workspace = true
veoveo-mcp-contract = { features = ["runtime"], workspace = true, default-features = false }
veoveo-mcp-conformance = { path = "../../mcp/conformance" }

# Reuse the workspace-qualified parser; source-file policy is qualified by native tests.
syn = { workspace = true, features = ["full", "visit", "parsing"] }

veoveo-view-mcp = { path = "../../servers/view-mcp", default-features = false, features = ["contract"] }
veoveo-stream-mcp = { path = "../../servers/stream-mcp", default-features = false, features = ["contract"] }
veoveo-timeseries-mcp = { path = "../../servers/timeseries-mcp", default-features = false, features = ["contract"] }
veoveo-uav-sim-mcp = { path = "../../servers/uav-sim-mcp", default-features = false, features = ["contract"] }
veoveo-map-mcp = { path = "../../servers/map-mcp", default-features = false, features = ["contract"] }
veoveo-mcp-apps-extension.workspace = true
