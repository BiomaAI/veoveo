[worker.oci]
  gc = true

# Release preflight retains 13% free space after projected build growth. BuildKit
# v0.33.0 resolves percentages with binary division followed by decimal
# multiplication; its 15% setting covers that reserve after rounding. The
# 80 GiB cache floor lets collection respond when other host users consume disk.
[[worker.oci.gcpolicy]]
  filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
  keepDuration = "168h"
  reservedSpace = "80GB"
  maxUsedSpace = "320GB"
  minFreeSpace = "15%"

[[worker.oci.gcpolicy]]
  all = true
  # The pressure sweep must not bypass the retention window above. Losing a
  # just-used Cargo target mount turns every source edit into a cold rebuild.
  filters = ["type!=exec.cachemount"]
  reservedSpace = "80GB"
  maxUsedSpace = "320GB"
  minFreeSpace = "15%"

# Retention is not an unlimited disk reservation. After ordinary image/source
# collection, compiler mounts remain reclaimable above the worker's hard budget
# or at critically low free space. Routine shared-host pressure uses the policy
# above; this final policy must not continuously evict a just-built target.
[[worker.oci.gcpolicy]]
  filters = ["type==exec.cachemount"]
  all = true
  reservedSpace = "80GB"
  maxUsedSpace = "320GB"
  minFreeSpace = "32GB"
