name: Local test report

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-test-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Informational local result
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install the repository Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Display the committed local test report
        run: cargo xtask test-report show --github-summary
