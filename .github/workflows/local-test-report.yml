name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-test-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Build status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Display the committed local test report
        run: cargo xtask test-report show --github-summary
