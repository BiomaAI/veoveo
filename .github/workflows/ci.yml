name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Select Rust toolchain
        run: rustup default 1.97.1
      - name: Run the canonical Rust gate
        run: cargo xtask enforce rust

  python:
    name: Python SDK release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13.14"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
      - name: Test source and isolated released-package consumption
        run: cargo xtask enforce python

  surrealdb:
    name: SurrealDB 3.2 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Exercise migrations and durable primitives
        run: cargo +1.97.1 run -p veoveo-smoke -- surreal-integration

  identity-keycloak:
    name: Keycloak OIDC/OAuth integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Select Rust toolchain
        run: rustup default 1.97.1
      - name: Build identity integration binaries
        run: |
          cargo build -p veoveo-mcp-conformance --bin conformance
          cargo build -p veoveo-mcp-gateway --bin gateway
      - name: Exercise HTTPS OIDC, PKCE, and refresh replay defense
        run: >-
          cargo run -p veoveo-smoke --bin smoke --
          gateway-keycloak
          --conformance-bin target/debug/conformance
          --gateway-bin target/debug/gateway
          --control-plane configs/gateway.smoke.json
          --realm configs/keycloak/veoveo-ci-realm.json

  console:
    name: Operations console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console/web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sumo-mcp:
    name: SUMO MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver: docker
          install: true
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo fmt -p veoveo-sumo-mcp --check
      - run: cargo clippy -p veoveo-sumo-mcp --all-targets -- -D warnings
      - run: cargo test -p veoveo-sumo-mcp
      - run: cargo run -p veoveo-smoke -- sumo-push
      - name: Build and execute the pinned SUMO runtime images
        run: |
          cargo xtask image builder ensure
          cargo xtask image build --group showcase-sumo
          docker run --rm --platform linux/amd64 \
            veoveo/sumo-mcp:0.1.0 --help >/dev/null
          docker run --rm --platform linux/amd64 --entrypoint sh \
            veoveo/sumo-mcp:0.1.0 -c \
            'test "$(id -u)" = 10001 && command -v curl && command -v netgenerate && command -v duarouter && command -v sumo'
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp --entrypoint sh \
            veoveo/sumo-sim:0.1.0 -c \
            'test "$(id -u)" = 10001 && test -r dua.actuated.sumocfg && test ! -w . && sumo --version >/dev/null'

  compose:
    name: Deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Exercise Compose and Caddy contracts through the Rust harness
        run: cargo run -p veoveo-smoke -- compose-config
      - name: Validate Helm schema and rendered resources
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            lint deploy/helm/veoveo-extension
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            lint deploy/helm/veoveo
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            lint showcase/uav-sim/deploy/helm
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            lint testing/fixtures/extension-helm-consumer
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template veoveo deploy/helm/veoveo >/dev/null
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm@sha256:e7ecbf4a200dea73d64bfb8cb0936829164945f2b4d02a0274093073ee8d264f \
            template separate-extension-release testing/fixtures/extension-helm-consumer >/dev/null
      - name: Verify offline bundle contract
        run: cargo test -p veoveo-smoke --test offline_contract
