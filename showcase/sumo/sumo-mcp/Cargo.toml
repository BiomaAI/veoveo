[package]
name = "veoveo-sumo-mcp"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_sumo_mcp"
path = "src/lib.rs"

[[bin]]
name = "sumo-mcp"
path = "src/bin/server.rs"

[dependencies]
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
re_sdk.workspace = true
re_sdk_types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
rustls.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower-http.workspace = true
traci-rs.workspace = true
tracing.workspace = true
uuid.workspace = true
veoveo-mcp-contract = { workspace = true, features = ["runtime"] }
veoveo-artifact-client = { path = "../../../platform/artifacts/client" }
veoveo-task-runtime = { path = "../../../platform/task-runtime" }

[dev-dependencies]
veoveo-mcp-contract = { workspace = true, features = ["runtime", "testing"] }
veoveo-gateway-catalog.workspace = true
tempfile = "3"
tower = { workspace = true, features = ["util"] }

[features]
