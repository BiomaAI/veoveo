global:
  production: false
  veoveoRegistry: ""
  veoveoTag: ""
  imageDigests: {}
  imagePullSecrets: []

images:
  pullPolicy: IfNotPresent
  runtime:
    repository: veoveo/uav-sim-runtime
    tag: 6.0.1
    digest: ""
  mcp:
    repository: veoveo/uav-sim-mcp
    tag: 0.1.0
    digest: ""
  forwarder:
    repository: veoveo/recording-forwarder
    tag: 0.1.0
    digest: ""
  agent:
    repository: veoveo/agent-kernel
    tag: 0.1.0
    digest: ""

platform:
  installationId: veoveo
  publicBaseUrl: http://localhost:8780
  installationSecret: veoveo-installation-secrets
  cesiumSecret: veoveo-uav-sim-secrets
  cesiumTokenKey: cesium-ion-access-token
  adapterSecret: veoveo-uav-sim-adapter
  adapterTokenKey: bearer-token
  surrealService: surrealdb
  surrealNamespace: veoveo
  surrealDatabase: platform
  surrealRuntimeSecret: veoveo-surreal-runtime
  recordingTenantKey: enterprise

recordingForwarder:
  gatewayTransportUrl: http://mcp-gateway:8788
  clientId: recording-producer
  keyId: recording-producer-2026
  signingAlgorithm: rs256
  privateKey:
    existingSecret: veoveo-recording-producer
    key: private-key.pem
  maximumQueueBytes: 4294967296
  batchMessageLimit: 4096
  grpcMemoryLimitBytes: 268435456
  persistence:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

recording:
  telemetryHz: 5
  queueCapacity: 256
  mapProvider: openStreetMap

world:
  source: google_photorealistic_3d_tiles
  cesiumIonAssetId: 2275207
  bootstrap:
    existingConfigMap: ""
    key: world.json
  streaming:
    maximumScreenSpaceError: 32
    maximumSimultaneousLoads: 20
    maximumCachedBytes: 2147483648
    preloadAncestors: true
    preloadSiblings: true
    forbidHoles: true

cache:
  policy: persistent
  version: isaac-6.0.1-cesium-0.29.0-v1
  size: 40Gi
  storageClass: ""
  accessMode: ReadWriteOnce

session:
  id: uav-showcase
  vehicleCount: 4
  physicsHz: 30
  renderingHz: 24
  tileReadyFrames: 30
  px4ConnectTimeoutSeconds: 180
  privacyConsent: false
  fleetLoop:
    relativeAltitudeM: 450
    verticalSeparationM: 15
    takeoffTimeoutSeconds: 420
    centerEastM: 1700
    centerNorthM: 3000
    eastRadiusM: 2500
    northRadiusM: 9000
    radialSeparationM: 100
    waypointCount: 32
    speedMps: 25
    holdSeconds: 0
  camera:
    vehicleId: uav-1
    width: 640
    height: 480
    fps: 2
    optics:
      focalLengthMm: 8.0
      clippingRangeM:
        near: 0.05
        far: 100000.0
    mount:
      translationM:
        x: 0.60
        "y": 0.0
        z: 0.05
      orientationWxyz:
        w: 0.7071067811865476
        x: 0.0
        "y": 0.0
        z: -0.7071067811865476

liveView:
  publicStreamUrl: ws://127.0.0.1:8803/uav-sim/live
  streamGatePort: 8803
  operatorRtspPortBase: 8560
  authorizationSeconds: 3600
  maximumFrameAgeMs: 2000
  streamIngress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  cameras:
    - cameraId: follow
      revision: 1
      rig:
        kind: follow_entity
        targetEntityId: uav-1
        eyeOffsetFluM: {x: -12.0, "y": 2.0, z: 4.0}
        targetOffsetFluM: {x: 0.0, "y": 0.0, z: 0.2}
        smoothing:
          translationHalfLifeMs: 150
          rotationHalfLifeMs: 120
          teleportDistanceM: 100.0
          resetAfterGapMs: 1000
      optics: &operatorOptics
        widthPx: 1280
        heightPx: 720
        frameRateHz: 16
        verticalFovDegrees: 60.0
        nearClipM: 0.1
        farClipM: 100000.0
      streamPolicy: continuous
    - cameraId: chase
      revision: 1
      rig:
        kind: chase_entity
        targetEntityId: uav-2
        distanceM: 15.0
        heightM: 4.0
        smoothing:
          translationHalfLifeMs: 120
          rotationHalfLifeMs: 100
          teleportDistanceM: 100.0
          resetAfterGapMs: 1000
      optics: *operatorOptics
      streamPolicy: continuous
    - cameraId: orbit
      revision: 1
      rig:
        kind: orbit
        targetEntityId: uav-3
        radiusM: 25.0
        azimuthDegrees: 225.0
        elevationDegrees: 20.0
        smoothing:
          translationHalfLifeMs: 160
          rotationHalfLifeMs: 140
          teleportDistanceM: 100.0
          resetAfterGapMs: 1000
      optics: *operatorOptics
      streamPolicy: continuous
    - cameraId: stabilized
      revision: 1
      rig:
        kind: stabilized_mounted_entity
        targetEntityId: uav-4
        mount:
          positionM: {x: 0.60, "y": 0.0, z: -0.20}
          orientationXyzw: {x: 0.0, "y": 0.0, z: 0.0, w: 1.0}
        smoothing:
          translationHalfLifeMs: 120
          rotationHalfLifeMs: 100
          teleportDistanceM: 100.0
          resetAfterGapMs: 1000
      optics: *operatorOptics
      streamPolicy: continuous
    - cameraId: formation
      revision: 1
      rig:
        kind: formation_overview
        targetEntityIds: [uav-1, uav-2, uav-3, uav-4]
        paddingM: 30.0
        smoothing:
          translationHalfLifeMs: 180
          rotationHalfLifeMs: 160
          teleportDistanceM: 150.0
          resetAfterGapMs: 1000
      optics: *operatorOptics
      streamPolicy: continuous

streamPublication:
  enabled: true
  endpointHost: stream-mcp
  endpointPort: 9000
  payloadType: 96
  sourceVehicleId: uav-1
  queueCapacity: 32

interactive:
  enabled: true
  progressDeadlineSeconds: 1800

agents:
  enabled: false
  tenant: enterprise
  workContext: operations
  gatewayUrl: http://localhost:8780
  gatewayTransportUrl: http://mcp-gateway:8788
  llmSecret:
    existingSecret: veoveo-uav-pilot-agents
    accountIdKey: cloudflare-account-id
    apiTokenKey: cloudflare-api-token
  privateKeySecret:
    existingSecret: veoveo-uav-pilot-agents
  persistence:
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  pilots:
    - agentId: uav-1-pilot
      displayName: UAV 1 Pilot
      clientId: uav-1-pilot
      privateKeyId: uav-1-pilot-2026
      privateKeySecretKey: uav-1-private-key-der-b64
      vehicleId: uav-1
    - agentId: uav-2-pilot
      displayName: UAV 2 Pilot
      clientId: uav-2-pilot
      privateKeyId: uav-2-pilot-2026
      privateKeySecretKey: uav-2-private-key-der-b64
      vehicleId: uav-2
    - agentId: uav-3-pilot
      displayName: UAV 3 Pilot
      clientId: uav-3-pilot
      privateKeyId: uav-3-pilot-2026
      privateKeySecretKey: uav-3-private-key-der-b64
      vehicleId: uav-3
    - agentId: uav-4-pilot
      displayName: UAV 4 Pilot
      clientId: uav-4-pilot
      privateKeyId: uav-4-pilot-2026
      privateKeySecretKey: uav-4-private-key-der-b64
      vehicleId: uav-4
service:
  port: 8802

resources:
  runtime:
    requests:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: 1
    limits:
      cpu: "16"
      memory: 64Gi
      nvidia.com/gpu: 1
  mcp:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  agent:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

scheduling:
  runtime:
    runtimeClassName: nvidia
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations: []
    affinity: {}
  mcp:
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations: []
    affinity: {}
  agent:
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations: []
    affinity: {}

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
