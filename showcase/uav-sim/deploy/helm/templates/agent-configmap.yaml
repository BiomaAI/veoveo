{{- if .Values.agents.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: uav-pilot-agent
  labels:
    {{- include "uav-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: uav-pilot-agent
data:
  manifest.json: |
{{ .Files.Get "files/agents/pilot/manifest.json" | indent 4 }}
  0001_mission_state.sql: |
{{ .Files.Get "files/agents/pilot/migrations/0001_mission_state.sql" | indent 4 }}
{{- end }}
