{{- if .Values.agents.enabled }}
{{- range $index, $pilot := .Values.agents.pilots }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pilot.agentId }}
  labels:
    {{- include "uav-sim.componentLabels" (dict "root" $ "name" "uav-sim" "component" "uav-pilot-agent") | nindent 4 }}
    veoveo.ai/agent-id: {{ $pilot.agentId | quote }}
spec:
  accessModes:
    - {{ $.Values.agents.persistence.accessMode }}
  {{- with $.Values.agents.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.agents.persistence.size }}
{{- end }}
{{- end }}
