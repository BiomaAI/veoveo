{{- if .Values.interactive.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: uav-sim-mcp
  labels:
    {{- include "uav-sim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "uav-sim.mcpSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: mcp
    - name: live-stream
      port: {{ .Values.liveView.streamGatePort }}
      targetPort: live-stream
---
apiVersion: v1
kind: Service
metadata:
  name: uav-sim-runtime
  labels:
    {{- include "uav-sim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "uav-sim.runtimeSelectorLabels" . | nindent 4 }}
  ports:
    - name: adapter
      port: 8810
      targetPort: adapter
{{- end }}
