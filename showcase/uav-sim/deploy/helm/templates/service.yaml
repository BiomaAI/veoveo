{{- if .Values.interactive.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: uav-sim-mcp
  labels:
    {{- include "uav-sim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "uav-sim.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: mcp
---
apiVersion: v1
kind: Service
metadata:
  name: uav-sim-media
  labels:
    {{- include "uav-sim.labels" . | nindent 4 }}
spec:
  type: {{ .Values.liveView.mediaService.type }}
  externalTrafficPolicy: {{ .Values.liveView.mediaService.externalTrafficPolicy }}
  {{- with .Values.liveView.mediaService.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "uav-sim.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.liveView.cameras }}
    {{- $slot := int .physicalSlot }}
    - name: {{ printf "media-%d" (int .physicalSlot) }}
      protocol: UDP
      port: {{ add $.Values.liveView.mediaPortBase (int .physicalSlot) }}
      targetPort: {{ printf "media-%d" (int .physicalSlot) }}
      {{- with $.Values.liveView.mediaService.nodePortBase }}
      nodePort: {{ add (int .) $slot }}
      {{- end }}
    {{- end }}
{{- end }}
