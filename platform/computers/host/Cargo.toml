[package]
name = "veoveo-computer-host"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
schemars.workspace = true
sha2.workspace = true
veoveo-types.workspace = true
veoveo-computers-contract = { path = "../contract" }
anyhow.workspace = true
clap.workspace = true
nix = { workspace = true, features = ["fs", "user", "mount", "sched", "process"] }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true, features = ["serde"] }
veoveo-computer-storage = { path = "../storage" }

x509-parser = { workspace = true, features = ["verify"] }

[dev-dependencies]
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tonic.workspace = true
uuid = { workspace = true, features = ["v7"] }
veoveo-computers-runtime = { path = "../../runtimes/computers" }
