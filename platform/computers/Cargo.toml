[package]
name = "veoveo-computers"
version.workspace = true
edition.workspace = true
publish = false

[features]
gateway = ["dep:veoveo-mcp-gateway", "dep:veoveo-computers-transport", "dep:veoveo-mcp-contract", "dep:rmcp", "dep:tokio"]
default = ["runtime"]
schema = ["dep:veoveo-modules"]
runtime = [
    "dep:futures",
    "dep:veoveo-types",
    "dep:veoveo-audit-contract",
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:chrono",
    "dep:hex",
    "dep:getrandom",
    "dep:hmac",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:surrealdb",
    "dep:thiserror",
    "dep:tokio",
    "dep:uuid",
    "dep:zeroize",
    "dep:veoveo-computer-execution",
    "dep:veoveo-computers-contract",
    "dep:veoveo-mcp-contract",
    "dep:veoveo-platform-store",
    "dep:veoveo-policy",
    "dep:veoveo-task-runtime",
]

[dependencies]
veoveo-mcp-gateway = { path = "../gateway", optional = true }
veoveo-computers-transport = { path = "transport", optional = true }
rmcp = { workspace = true, optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }
futures = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
veoveo-audit-contract = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"], optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "sync"], optional = true }
uuid = { workspace = true, features = ["serde", "v7"], optional = true }
zeroize = { workspace = true, optional = true }
veoveo-computer-execution = { path = "execution", optional = true }
veoveo-computers-contract = { path = "contract", optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-platform-store = { path = "../store", optional = true }
veoveo-policy = { path = "../policy", optional = true }
veoveo-task-runtime = { path = "../task-runtime", optional = true }

[dev-dependencies]
anyhow.workspace = true
rcgen.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt-multi-thread"] }

