[package]
name = "veoveo-workspace"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
gateway = ["dep:veoveo-gateway-contract", "dep:base64", "dep:veoveo-artifact-contract", "dep:jsonschema", "dep:anyhow", "dep:async-stream", "dep:axum", "dep:chrono", "dep:futures", "dep:hex", "dep:parking_lot", "dep:reqwest", "dep:rig", "dep:rmcp", "dep:secrecy", "dep:serde", "dep:serde_json", "dep:sha2", "dep:sse-stream", "dep:tokio", "dep:tokio-util", "dep:tower-http", "dep:tracing", "dep:url", "dep:uuid", "dep:veoveo-mcp-contract", "dep:veoveo-mcp-gateway", "dep:veoveo-platform-store", "dep:veoveo-types", "dep:veoveo-agent-runtime", "dep:veoveo-mcp-apps-extension"]
schema = ["dep:veoveo-modules"]

[dependencies]
veoveo-gateway-contract = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-stream = { version = "=0.3.6", optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json", "stream"] }
rig = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["set-header"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-mcp-gateway = { path = "../gateway", optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
veoveo-agent-runtime = { path = "../../agents/runtime", default-features = false, features = ["gateway"], optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
veoveo-recording-contract.workspace = true
veoveo-computers-contract.workspace = true
veoveo-gateway-contract.workspace = true
rustls.workspace = true
tower.workspace = true
veoveo-task-runtime = { path = "../task-runtime" }
surrealdb = { version = "=3.3.0", default-features = false }
