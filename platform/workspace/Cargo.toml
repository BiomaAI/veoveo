[package]
name = "veoveo-workspace"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
contract = ["dep:veoveo-gateway-contract", "dep:veoveo-artifact-contract", "dep:chrono", "dep:schemars", "dep:serde", "dep:serde_json", "dep:uuid", "dep:veoveo-types", "dep:veoveo-agent-runtime"]
app-contract = ["contract", "dep:rmcp", "rmcp/schemars"]
persistence = ["dep:futures", "contract", "schema", "veoveo-agent-runtime/persistence", "dep:surrealdb", "dep:thiserror", "dep:tokio", "dep:sha2", "dep:hex", "dep:veoveo-platform-store"]
gateway = ["persistence", "dep:veoveo-http", "app-contract", "veoveo-agent-runtime/gateway", "rmcp/client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest-tls-no-provider", "dep:veoveo-gateway-contract", "dep:base64", "dep:veoveo-artifact-contract", "dep:jsonschema", "dep:anyhow", "dep:async-stream", "dep:axum", "dep:chrono", "dep:futures", "dep:hex", "dep:parking_lot", "dep:reqwest", "dep:rig", "dep:rmcp", "dep:secrecy", "dep:serde", "dep:serde_json", "dep:sha2", "dep:sse-stream", "dep:tokio", "dep:tokio-util", "dep:tower-http", "dep:tracing", "dep:url", "dep:uuid", "dep:veoveo-mcp-contract", "dep:veoveo-mcp-gateway", "dep:veoveo-platform-store", "dep:veoveo-types", "dep:veoveo-agent-runtime", "dep:veoveo-mcp-apps-extension"]
schema = ["dep:veoveo-modules"]

[dependencies]
veoveo-http = { workspace = true, optional = true }
veoveo-gateway-contract = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-stream = { version = "=0.3.6", optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json", "stream"] }
rig = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["set-header"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-mcp-contract = { workspace = true, optional = true }
veoveo-mcp-gateway = { path = "../gateway", optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
veoveo-agent-runtime = { path = "../../agents/runtime", default-features = false, features = ["contract"], optional = true }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension", optional = true }
veoveo-modules = { workspace = true, default-features = false, optional = true }

surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"], optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
veoveo-audit-contract.workspace = true
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-recording-contract.workspace = true
veoveo-computers-contract.workspace = true
veoveo-gateway-contract.workspace = true
rustls.workspace = true
tower.workspace = true
veoveo-task-runtime = { path = "../task-runtime" }

[[test]]
name = "workspace"
required-features = ["persistence"]

[[test]]
name = "agent_catalog_integration"
required-features = ["persistence"]
