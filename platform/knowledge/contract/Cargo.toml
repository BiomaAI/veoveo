[package]
name = "veoveo-knowledge-contract"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
veoveo-types.workspace = true
veoveo-embedding-contract.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["contract"] }
