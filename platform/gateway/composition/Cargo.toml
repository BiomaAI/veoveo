[package]
name = "veoveo-gateway-composition"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[dependencies]
scraper = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
veoveo-deploy-contract = {workspace = true, optional = true}
tempfile = {workspace = true, optional = true}
bytes = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
image = { workspace = true, optional = true }
veoveo-testing-support = { path="../../../testing/support", optional=true, features=[] }
veoveo-duckdb-runtime = { path="../../runtimes/duckdb", optional=true, features=["smoke"] }
axum-server = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
veoveo-mcp-apps-extension = { optional = true, path = "../../../mcp/apps-extension" }
veoveo-mcp-conformance = { path = "../../../mcp/conformance", optional = true }
veoveo-console-bff = { workspace = true, default-features = false, features = ["contract"] }
veoveo-reason-mcp = { path = "../../../servers/reason-mcp", default-features = false, features = ["schema"] }
veoveo-stream-mcp = { path = "../../../servers/stream-mcp", default-features = false, features = ["schema"] }
veoveo-recording-store = { workspace = true }
veoveo-http.workspace = true
veoveo-recording-contract.workspace = true
veoveo-mcp-gateway = { path = ".." }
veoveo-gateway-contract.workspace = true
veoveo-gateway-catalog.workspace = true
veoveo-knowledge-contract.workspace = true
veoveo-audit.workspace = true
veoveo-audit-contract.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
veoveo-speech-mcp = { path = "../../../servers/speech-mcp", default-features = false, features = ["gateway"] }
anyhow.workspace = true
async-stream = "0.3.6"
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
zeroize.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { workspace = true, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
surrealdb = { version = "=3.3.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
vaultrs.workspace = true
veoveo-agent-runtime = { path = "../../../agents/runtime", features = ["schema", "gateway"] }
veoveo-artifact-client = { path = "../../artifacts/client" }
veoveo-computers-contract = { path = "../../computers/contract" }
veoveo-mcp-contract = { workspace = true, features = ["runtime"] }
veoveo-platform-store = { path = "../../store", features = ["schema"] }
veoveo-policy = { path = "../../policy" }
veoveo-recording-mcp = { path = "../../../servers/recording-mcp", default-features = false, features = ["contract", "schema", "gateway"] }
veoveo-task-runtime = { path = "../../task-runtime" }

veoveo-modules = { workspace = true, features = ["runner", "serialization"] }
veoveo-workspace = { workspace = true, features = ["schema", "gateway"] }
veoveo-computers = { path = "../../computers", default-features = false, features = ["schema", "gateway"] }
veoveo-map-mcp = { path = "../../../servers/map-mcp", default-features = false, features = ["schema"] }
veoveo-time-mcp = { path = "../../../servers/time-mcp", default-features = false, features = ["schema"] }
veoveo-uav-sim-mcp = { path = "../../../servers/uav-sim-mcp", default-features = false, features = ["schema"] }
veoveo-frames-mcp = { path = "../../../servers/frames-mcp", default-features = false, features = ["schema"] }
veoveo-media-mcp = { path = "../../../servers/media-mcp", default-features = false, features = ["schema"] }
veoveo-optimization-mcp = { path = "../../../servers/optimization-mcp", default-features = false, features = ["schema"] }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
base64.workspace = true
rcgen.workspace = true

[[bin]]
name = "gateway-smoke-support"
path = "src/smoke/gateway_smoke_support.rs"
required-features = ["smoke"]

[features]
smoke = ["veoveo-media-mcp/contract", "veoveo-frames-mcp/contract", "reqwest/cookies", "dep:scraper","dep:rcgen","dep:veoveo-deploy-contract","dep:tempfile","dep:bytes","dep:duckdb","dep:image","dep:veoveo-testing-support","dep:veoveo-duckdb-runtime","dep:axum-server",  "dep:jsonschema", "dep:schemars", "dep:veoveo-mcp-apps-extension", "dep:veoveo-mcp-conformance"]

[[bin]]
name="gateway-smoke"
path="src/smoke/gateway_smoke.rs"
required-features=["smoke"]
