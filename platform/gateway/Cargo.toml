[package]
name = "veoveo-mcp-gateway"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_mcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[dependencies]
veoveo-gateway-contract.workspace = true
veoveo-knowledge-contract.workspace = true
veoveo-audit.workspace = true
veoveo-audit-contract.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
veoveo-speech-contract = { path = "../../servers/speech-mcp/contract" }
anyhow.workspace = true
async-stream = "0.3.6"
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
zeroize.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
jsonschema.workspace = true
parking_lot.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rig.workspace = true
rmcp = { workspace = true, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sse-stream.workspace = true
surrealdb = { version = "=3.3.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
vaultrs.workspace = true
veoveo-agent-runtime = { path = "../../agents/runtime" }
veoveo-artifact-client = { path = "../artifacts/client" }
veoveo-computers-contract = { path = "../computers/contract" }
veoveo-computers-transport = { path = "../computers/transport" }
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension" }
veoveo-mcp-contract.workspace = true
veoveo-platform-store = { path = "../store" }
veoveo-policy = { path = "../policy" }
veoveo-recording-mcp = { path = "../../servers/recording-mcp", default-features = false, features = ["contract"] }
veoveo-recording-protocol.workspace = true
veoveo-task-runtime = { path = "../task-runtime" }

[dev-dependencies]
base64.workspace = true
rcgen.workspace = true
