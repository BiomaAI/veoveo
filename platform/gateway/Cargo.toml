[package]
name = "veoveo-mcp-gateway"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_mcp_gateway"
path = "src/lib.rs"

[dependencies]
veoveo-gateway-contract.workspace = true
veoveo-knowledge-contract.workspace = true
veoveo-audit.workspace = true
veoveo-audit-contract.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
veoveo-types.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
anyhow.workspace = true
async-stream = "0.3.6"
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body = "=1.1.0"
jsonwebtoken.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { workspace = true, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sse-stream.workspace = true
surrealdb = { version = "=3.3.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
vaultrs.workspace = true
veoveo-mcp-apps-extension = { path = "../../mcp/apps-extension" }
veoveo-mcp-contract.workspace = true
veoveo-platform-store = { path = "../store" }
veoveo-policy = { path = "../policy" }
veoveo-task-runtime = { path = "../task-runtime" }

veoveo-modules = { workspace = true, features = ["runner", "serialization"] }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
jsonschema.workspace = true
veoveo-computers-contract.workspace = true
veoveo-agent-runtime = { path = "../../agents/runtime", default-features = false, features = ["contract"] }
veoveo-recording-contract.workspace = true
base64.workspace = true
rcgen.workspace = true
