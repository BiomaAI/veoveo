[package]
name = "veoveo-task-runtime"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_task_runtime"
path = "src/lib.rs"

[dependencies]
veoveo-types.workspace = true
veoveo-modules.workspace = true
anyhow.workspace = true
async-stream = "0.3.6"
chrono.workspace = true
futures.workspace = true
rmcp.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }
veoveo-mcp-contract.workspace = true
veoveo-platform-store = { path = "../store" }

[dev-dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-platform-store = { path = "../store", features = ["schema"] }
tokio = { workspace = true, features = ["process", "io-util"] }
rmcp = { workspace = true, features = ["client"] }
