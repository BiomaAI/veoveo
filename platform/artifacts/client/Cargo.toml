[package]
name = "veoveo-artifact-client"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_artifact_client"
path = "src/lib.rs"

[dependencies]
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "json", "query", "stream"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["io"] }
veoveo-mcp-contract = { features = ["runtime"], workspace = true, default-features = false }
