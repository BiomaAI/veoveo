[package]
name = "veoveo-artifact-service"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_artifact_service"
path = "src/lib.rs"

[[bin]]
# Distinct from the domain servers' `server` bin so both can coexist in one
# `target/debug` (e.g. the smoke harness runs media + artifact-service together).
name = "artifact-service"
path = "src/bin/server.rs"

[dependencies]
veoveo-modules = { workspace = true, features = ["runner"] }
veoveo-testing-support = { path = "../../../testing/support", optional = true }
rmcp = { workspace = true, optional = true, features = ["client"] }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json"] }
clap = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
veoveo-mcp-conformance = { path = "../../../mcp/conformance", optional = true }
veoveo-http.workspace = true
veoveo-audit.workspace = true
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
object_store = { workspace = true, features = ["fs"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }
veoveo-mcp-contract = { workspace = true, default-features = false, features = ["runtime"] }
veoveo-platform-store = { path = "../../store" }

[dev-dependencies]
veoveo-gateway-contract.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
tempfile = "3"
veoveo-artifact-client = { path = "../client" }

[[bin]]
name = "artifact-smoke"
path = "src/smoke/artifact_smoke.rs"
required-features = ["smoke"]

[features]
smoke = ["dep:veoveo-testing-support", "dep:clap", "dep:jsonwebtoken", "dep:rustls", "dep:veoveo-mcp-conformance", "dep:rmcp", "dep:reqwest", "veoveo-mcp-contract/runtime"]
