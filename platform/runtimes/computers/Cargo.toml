[package]
name = "veoveo-computers-runtime"
version.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
futures.workspace = true
hex.workspace = true
prost.workspace = true
prost-reflect = { version = "=0.16.5", features = ["serde"] }
prost-types = "=0.14.4"
regress = "=0.12.0"
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = "=0.14.6"
uuid.workspace = true
zeroize.workspace = true

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
serde_json.workspace = true
sha2.workspace = true
tonic-prost-build = "=0.14.6"
typify = { version = "=0.8.0", default-features = false }

[dev-dependencies]
rcgen.workspace = true
tokio-stream = { version = "=0.1.19", features = ["net"] }
