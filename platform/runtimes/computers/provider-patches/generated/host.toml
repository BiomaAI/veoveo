[openshell]
version = 2
[openshell.gateway]
bind_address = "0.0.0.0:8805"
compute_driver = "docker"
log_level = "warn"
ssh_session_ttl_secs = 3600
[openshell.gateway.mtls_auth]
enabled = true
user_common_names = ["veoveo-computers-worker"]
[openshell.gateway.gateway_jwt]
signing_key_path = "/run/veoveo-computers/trust/jwt-key.pem"
public_key_path = "/run/veoveo-computers/trust/jwt-public.pem"
kid_path = "/run/veoveo-computers/trust/jwt-kid"
gateway_id = "private-computers"
ttl_secs = 3600
[openshell.drivers.docker]
socket_path = "/run/veoveo-computers/docker.sock"
default_image = "registry.internal:5000/computer@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
image_pull_policy = "never"
supervisor_image = "registry.internal:5000/provider@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
allow_driver_config = true
sandbox_label = "private-computers"
grpc_endpoint = "https://127.0.0.1:8805"
supervisor_bin = "/usr/local/bin/openshell-sandbox"
guest_tls_ca = "/run/veoveo-computers/trust/provider-ca.pem"
guest_tls_cert = "/run/veoveo-computers/trust/guest.pem"
guest_tls_key = "/run/veoveo-computers/trust/guest-key.pem"
sandbox_pids_limit = 256
enable_bind_mounts = false
