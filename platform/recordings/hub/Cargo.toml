[package]
name = "veoveo-recording-hub"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_recording_hub"
path = "src/lib.rs"

[[bin]]
name = "spooler"
path = "src/bin/spooler.rs"

[[bin]]
name = "sensor-sim"
path = "src/bin/sensor_sim.rs"

[[bin]]
name = "hub-smoke"
path = "src/bin/hub_smoke.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
fs4 = "=1.1.0"
hex.workspace = true
h264-reader.workspace = true
mp4.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["form", "json", "rustls-no-provider", "stream"] }
rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
veoveo-platform-store.workspace = true
veoveo-mcp-contract.workspace = true
veoveo-recording-forwarder = { path = "../forwarder" }
veoveo-recording-protocol.workspace = true
veoveo-rrd.workspace = true
tempfile = "3"
thiserror.workspace = true

re_sdk.workspace = true
re_sdk_types.workspace = true
re_types_core.workspace = true
re_byte_size.workspace = true
re_build_info.workspace = true
re_grpc_server.workspace = true
re_grpc_client.workspace = true
re_log_channel.workspace = true
re_log_encoding.workspace = true
re_log_types.workspace = true
re_uri.workspace = true
re_dataframe.workspace = true
re_chunk.workspace = true
re_chunk_store.workspace = true
re_entity_db.workspace = true

[dev-dependencies]
base64.workspace = true
futures.workspace = true
