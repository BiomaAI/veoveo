[package]
name = "veoveo-platform-store"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_platform_store"
path = "src/lib.rs"

[dependencies]
veoveo-types.workspace = true
veoveo-artifact-contract.workspace = true
async-stream = "=0.3.6"
chrono.workspace = true
futures.workspace = true
hex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb = { version = "=3.3.0", default-features = false, features = ["protocol-ws", "rustls"] }
thiserror = "2.0.20"
tokio = { workspace = true, features = ["time"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v5", "v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "net", "io-util", "sync"] }
