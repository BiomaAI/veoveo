[package]
name = "veoveo-deployment-smoke"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deployment-smoke"
path = "src/main.rs"

[[test]]
name = "gitops_convergence"
harness = false

[dependencies]
# OCI reference admission without registry/network clients; upstream v0.10.0 qualified by the owning harness.
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
oci-spec = { version = "=0.10.0", default-features = false, features = ["distribution"] }
veoveo-simulation-contract.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
veoveo-deploy-contract.workspace = true
veoveo-modules = { workspace = true, features = ["serialization"] }
veoveo-deploy-runtime.workspace = true
veoveo-image-build-control.workspace = true
veoveo-mcp-contract.workspace = true

[dev-dependencies]
veoveo-gateway-catalog.workspace = true
veoveo-agent-runtime = { path = "../../agents/runtime", default-features = false, features = ["gateway"] }
veoveo-recording-mcp = { path = "../../servers/recording-mcp", default-features = false, features = ["gateway"] }
veoveo-mcp-gateway = { path = "../../platform/gateway" }
