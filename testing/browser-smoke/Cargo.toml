[package]
name = "veoveo-browser-smoke"
version.workspace = true
edition.workspace = true

[dependencies]
veoveo-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
image = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

veoveo-testing-support = { path = "../support", optional = true }

[features]
default = ["runtime"]
contract = ["dep:anyhow", "dep:serde"]
runtime = ["contract", "dep:veoveo-types", "dep:anyhow", "dep:base64", "dep:chrono", "dep:futures", "dep:hex", "dep:image", "dep:reqwest", "dep:rustls", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tokio", "dep:tokio-tungstenite", "dep:url", "dep:uuid", "dep:veoveo-testing-support"]
