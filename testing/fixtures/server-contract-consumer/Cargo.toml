[package]
name = "veoveo-server-contract-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
knowledge = ["veoveo-map-mcp/knowledge", "veoveo-reason-mcp/knowledge"]

[dependencies]
veoveo-reason-mcp = { path = "../../../servers/reason-mcp", default-features = false, features = ["contract"] }
veoveo-stream-mcp = { path = "../../../servers/stream-mcp", default-features = false, features = ["contract"] }
veoveo-duckdb-mcp = { path = "../../../servers/duckdb-mcp", default-features = false, features = ["contract"] }
veoveo-optimization-mcp = { path = "../../../servers/optimization-mcp", default-features = false, features = ["contract"] }
veoveo-time-mcp = { path = "../../../servers/time-mcp", default-features = false, features = ["contract"] }
veoveo-view-mcp = { path = "../../../servers/view-mcp", default-features = false, features = ["contract"] }
veoveo-uav-sim-mcp = { path = "../../../servers/uav-sim-mcp", default-features = false, features = ["contract"] }
veoveo-recording-mcp = { path = "../../../servers/recording-mcp", default-features = false, features = ["contract"] }
veoveo-knowledge-mcp = { path = "../../../servers/knowledge-mcp", default-features = false, features = ["contract"] }
veoveo-map-mcp = { path = "../../../servers/map-mcp", default-features = false, features = ["contract"] }
veoveo-artifact-mcp = { path = "../../../servers/artifact-mcp", default-features = false, features = ["contract"] }
veoveo-computers-mcp = { path = "../../../servers/computers-mcp", default-features = false, features = ["contract"] }
veoveo-speech-mcp = { path = "../../../servers/speech-mcp", default-features = false, features = ["contract"] }
veoveo-frames-mcp = { path = "../../../servers/frames-mcp", default-features = false, features = ["contract"] }
veoveo-timeseries-mcp = { path = "../../../servers/timeseries-mcp", default-features = false, features = ["contract"] }
veoveo-media-mcp = { path = "../../../servers/media-mcp", default-features = false, features = ["contract"] }
veoveo-types = { path = "../../../platform/types" }

[dev-dependencies]
# Keep the independent consumer on the workspace-qualified error implementation.
thiserror = "=2.0.21"
jsonschema = { version = "=0.51.0", default-features = false }
serde_json = "=1.0.151"
serde = "=1.0.229"
schemars = "=1.2.2"
