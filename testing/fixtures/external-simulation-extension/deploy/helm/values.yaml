veoveo:
  installationId: veoveo
  production: false
  registry: ""
  sourceTag: ""
  imageDigests: {}
  imagePullSecrets: []
  installationSecret: veoveo-installation-secrets
  gpuPlacement:
    enabled: false
    claimName: ""
    runtimeClassName: nvidia
    evidenceDigest: ""
    workloadRequests: {}
    workloadReplicas: {}

image:
  repository: extensions/anonymous-simulation-mcp
  tag: 0.1.0
  digest: ""

service:
  port: 8812

liveView:
  publicSignalingUrl: ws://127.0.0.1:8812/anonymous-simulation/signaling
  publicMediaHost: 127.0.0.1
  publicMediaPort: 48030
  leaseSeconds: 120
  viewerSlots: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

networkPolicy:
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
