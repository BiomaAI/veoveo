global:
  publicBaseUrl: https://localhost:8785
gateway:
  auditRetentionDays: 365
  replicas: 1
artifactService:
  replicas: 1
ingress:
  host: localhost
  tls:
    enabled: true
    secretName: catalog-ingress-tls
surrealdb:
  persistence:
    size: 1Gi
objectStore:
  rustfs:
    persistence:
      size: 2Gi
recording:
  tenantKey: enterprise
  spoolMinimumFreeBytes: 1073741824
  persistence:
    size: 2Gi
  publication:
    keyId: catalog-producer
  mcpPublisher:
    keyId: catalog-producer
telemetry:
  enabled: false
podDisruptionBudget:
  enabled: false
