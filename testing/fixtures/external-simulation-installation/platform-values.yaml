global:
  publicBaseUrl: http://localhost:8782

objectStore:
  rustfs:
    publicEndpoint: http://objects.localhost:8782

simulationView:
  publicSignalingUrl: ws://localhost:8782/simulation-view/signaling
  publicMediaHost: localhost
  publicMediaIp: 127.0.0.1
  signaling:
    exposure: Ingress
  poseIngress:
    exposure: ClusterIP
  media:
    exposure: NodePort
    nodePortBase: 30998
  artifacts:
    size: 2Gi
  cache:
    sizeLimit: 12Gi
