[package]
name = "veoveo-console-bff"
version.workspace = true
edition.workspace = true

[[bin]]
name = "console-bff"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
contract = ["dep:veoveo-agent-runtime", "dep:veoveo-artifact-contract", "dep:veoveo-recording-contract", "dep:veoveo-task-contract"]
runtime = [
    "contract",
    "dep:veoveo-http",
    "dep:veoveo-agent-runtime",
    "dep:veoveo-workspace",
    "dep:veoveo-artifact-contract",
    "dep:veoveo-mcp-contract",
    "veoveo-mcp-contract/analytics",
    "dep:veoveo-recording-mcp",
    "dep:veoveo-speech-contract",
    "dep:anyhow",
    "dep:axum",
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:dotenvy",
    "dep:futures",
    "dep:getrandom",
    "dep:reqwest",
    "dep:rustls",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "dep:rmcp",
    "dep:veoveo-mcp-apps-extension",
    "dep:veoveo-computers-contract",
    "dep:veoveo-computers-transport",
]

[dependencies]
thiserror.workspace = true
veoveo-recording-contract = { workspace = true, optional = true }
veoveo-task-contract = { workspace = true, optional = true }
veoveo-http = { workspace = true, optional = true }
veoveo-agent-runtime = { workspace = true, default-features = false, features = ["contract"], optional = true }
veoveo-workspace = { workspace = true, features = ["app-contract"], optional = true }
veoveo-gateway-contract.workspace = true
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types.workspace = true
veoveo-recording-mcp = { path = "../../../servers/recording-mcp", default-features = false, features = ["contract"], optional = true }
veoveo-speech-contract = { path = "../../../servers/speech-mcp/contract", optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"], optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono.workspace = true
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["form", "json", "rustls-no-provider", "stream"], optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["set-header"], optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"], optional = true }
veoveo-mcp-apps-extension = { path = "../../../mcp/apps-extension", optional = true }
veoveo-mcp-contract = { workspace = true, default-features = false, optional = true }
veoveo-computers-contract = { path = "../../../platform/computers/contract", optional = true }
veoveo-computers-transport = { path = "../../../platform/computers/transport", optional = true }

schemars = { workspace = true, features = ["chrono04"] }

[dev-dependencies]
jsonschema.workspace = true
axum-server.workspace = true
rcgen.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
