[package]
name = "veoveo-mcp-task-extension"
version.workspace = true
edition.workspace = true

[features]
default = ["runtime"]
runtime = [
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
    "veoveo-task-contract/runtime",
]

[dependencies]
async-stream = "0.3.6"
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.18"
uuid = { workspace = true, features = ["serde", "v7"] }
veoveo-platform-store = { path = "../../platform/store", optional = true }
veoveo-task-contract.workspace = true
veoveo-task-runtime = { path = "../../platform/task-runtime", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
