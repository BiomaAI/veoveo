[package]
name = "veoveo-mcp-conformance"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "veoveo_mcp_conformance"
path = "src/lib.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "certify"
path = "src/bin/certify.rs"

[dependencies]
veoveo-gateway-catalog.workspace = true
veoveo-gateway-contract.workspace = true
veoveo-media-mcp = { path = "../../servers/media-mcp", default-features = false, features = ["contract"] }
veoveo-frames-mcp = { path = "../../servers/frames-mcp", default-features = false, features = ["contract"] }
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
jsonschema.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rmcp = { workspace = true, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
veoveo-mcp-apps-extension = { path = "../apps-extension" }
veoveo-mcp-contract.workspace = true

[dev-dependencies]
veoveo-modular-fixture-mcp = { path = "../../testing/fixtures/modular-mcp" }
