<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veoveo MCP App</title>
<style>
:root{color-scheme:light;--bg:#f4f2ed;--panel:#fffefa;--raised:#ebe8e1;--ink:#22211f;--muted:#706d67;--line:#d5d0c7;--accent:#376c5a;--good:#317051;--bad:#a44840;--shadow:0 14px 40px rgb(40 36 30/.12);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#101112;--panel:#171819;--raised:#202224;--ink:#ece9e2;--muted:#a19d95;--line:#343638;--accent:#87c4aa;--good:#79ba94;--bad:#e17d72;--shadow:0 14px 40px rgb(0 0 0/.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px}button{cursor:pointer;padding:7px 11px;font-weight:650}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}button:disabled{opacity:.5;cursor:default}header{display:flex;align-items:center;gap:18px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--panel)}header div:first-child{flex:1}h1,h2,h3,p{margin:0}h1{font-size:20px}h2{font-size:15px}h3{font-size:13px}.subtitle,.muted{color:var(--muted)}.subtitle{margin-top:2px}.status{font:12px ui-monospace,monospace;color:var(--muted)}.status.good{color:var(--good)}.status.bad{color:var(--bad)}main{display:grid;grid-template-columns:minmax(220px,310px) minmax(0,1fr);min-height:520px}.rail{padding:14px;border-right:1px solid var(--line)}.rail h2,.content h2{margin-bottom:9px}.resource-list,.tool-list{display:grid;gap:7px}.resource{width:100%;text-align:left;background:var(--panel)}.resource.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.content{min-width:0;padding:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.panel-head h2{flex:1;margin:0}.payload{margin:0;padding:14px;min-height:310px;max-height:560px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.tools{margin-top:14px}.tool{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}.tool-head{display:flex;align-items:center;gap:8px}.tool-head h3{flex:1}textarea{width:100%;min-height:92px;margin-top:8px;padding:9px;resize:vertical;font:12px/1.45 ui-monospace,monospace}.tool-output{display:none;margin-top:8px;padding:8px;background:var(--raised);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 ui-monospace,monospace}.tool-output.visible{display:block}.empty{padding:30px;color:var(--muted);text-align:center}@media(max-width:760px){main{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.payload{min-height:240px}}
</style>
</head>
<body>
<header><div><h1 id="title"></h1><p id="subtitle" class="subtitle"></p></div><span id="status" class="status">connecting</span><button id="refresh">Refresh</button></header>
<main>
  <aside class="rail"><h2>Resources</h2><div id="resources" class="resource-list"></div><section class="tools"><h2>Actions</h2><div id="tools" class="tool-list"></div></section></aside>
  <section class="content"><div class="panel"><div class="panel-head"><h2 id="resource-title">Resource</h2><button id="copy">Copy JSON</button></div><pre id="payload" class="payload"></pre></div></section>
</main>
<script>
const config=__VEOVEO_APP_CONFIG__,$=id=>document.getElementById(id);
let nextId=1,activeResource=config.resources[0]?.uri||null,activeValue=null,closed=false;
const pending=new Map(),handlers=new Map(),post=message=>parent.postMessage(message,"*");
addEventListener("message",event=>{const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&(message.result!==undefined||message.error!==undefined)){const waiter=pending.get(message.id);if(!waiter)return;pending.delete(message.id);message.error?waiter.reject(new Error(message.error.message||"host error")):waiter.resolve(message.result);return}const handler=handlers.get(message.method);if(handler)handler(message.params,message.id)});
const bridge={request(method,params){const id=nextId++;post({jsonrpc:"2.0",id,method,params});return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}))},notify(method,params){post({jsonrpc:"2.0",method,params})},on(method,handler){handlers.set(method,handler)}};
function structured(result){return result?.structuredContent??result?.structured_content??result}
function taskId(value){return value?.taskId??value?.task_id??value?._meta?.["io.modelcontextprotocol/task"]?.taskId??value?._meta?.["io.modelcontextprotocol/task"]?.task_id}
function taskState(value){return value?.status??value?.state??value?.task?.status??value?.task?.state}
function terminal(state){return ["completed","failed","cancelled"].includes(String(state||"").toLowerCase())}
function resultText(value){const normalized=structured(value);return JSON.stringify(normalized,null,2)}
function setStatus(text,kind=""){const node=$("status");node.textContent=text;node.className=`status ${kind}`}
function reportSize(){requestAnimationFrame(()=>bridge.notify("ui/notifications/size-changed",{height:Math.ceil(document.documentElement.scrollHeight)}))}
function applyTheme(context){const theme=context?.theme;document.documentElement.dataset.theme=theme==="light"?"light":"dark"}
async function read(uri){const result=await bridge.request("resources/read",{uri}),content=result?.contents?.[0];if(!content)throw new Error(`${uri} returned no content`);if(typeof content.text==="string"){try{return JSON.parse(content.text)}catch{return content.text}}return content}
async function selectResource(resource){activeResource=resource.uri;document.querySelectorAll(".resource").forEach(node=>node.classList.toggle("active",node.dataset.uri===resource.uri));$("resource-title").textContent=resource.label;$("payload").textContent="Loading…";setStatus("reading");try{activeValue=await read(resource.uri);$("payload").textContent=resultText(activeValue);setStatus("ready","good")}catch(error){activeValue=null;$("payload").textContent=`${resource.uri}\n\n${error.message}`;setStatus("resource unavailable","bad")}reportSize()}
async function awaitTask(created,output){const id=taskId(created);if(!id)return created;let snapshot=created;for(let attempt=0;attempt<240;attempt++){snapshot=await bridge.request("tasks/get",{taskId:id});output.textContent=`Task ${id}\n${resultText(snapshot)}`;if(terminal(taskState(snapshot)))return snapshot;await new Promise(resolve=>setTimeout(resolve,500))}throw new Error(`task ${id} did not finish within 120 seconds`)}
async function runTool(tool,textarea,output,button){button.disabled=true;output.classList.add("visible");output.textContent="Running…";setStatus(`running ${tool.name}`);try{const args=JSON.parse(textarea.value||"{}");const created=await bridge.request("tools/call",{name:tool.name,arguments:args});const result=await awaitTask(created,output);output.textContent=resultText(result);setStatus("ready","good");if(activeResource)await selectResource(config.resources.find(resource=>resource.uri===activeResource)||config.resources[0])}catch(error){output.textContent=error.message;setStatus("action failed","bad")}finally{button.disabled=false;reportSize()}}
function render(){document.title=config.title;$("title").textContent=config.title;$("subtitle").textContent=config.subtitle;const resources=$("resources");if(!config.resources.length)resources.innerHTML=`<div class="empty">${config.emptyMessage}</div>`;for(const resource of config.resources){const button=document.createElement("button");button.className="resource";button.dataset.uri=resource.uri;button.textContent=resource.label;button.onclick=()=>selectResource(resource);resources.append(button)}const tools=$("tools");if(!config.tools.length)tools.innerHTML=`<div class="muted">Read-only workspace</div>`;for(const tool of config.tools){const card=document.createElement("section");card.className="tool";const head=document.createElement("div");head.className="tool-head";const title=document.createElement("h3");title.textContent=tool.label;const run=document.createElement("button");run.className="primary";run.textContent="Run";const input=document.createElement("textarea");input.value=tool.argumentsJson;input.setAttribute("aria-label",`${tool.label} JSON input`);const output=document.createElement("pre");output.className="tool-output";run.onclick=()=>runTool(tool,input,output,run);head.append(title,run);card.append(head,input,output);tools.append(card)}reportSize()}
$("refresh").onclick=()=>{const resource=config.resources.find(item=>item.uri===activeResource)||config.resources[0];if(resource)selectResource(resource)};
$("copy").onclick=async()=>{if(activeValue!==null)await navigator.clipboard.writeText(resultText(activeValue))};
bridge.on("ui/notifications/host-context-changed",params=>applyTheme(params?.hostContext||params));
bridge.on("ui/notifications/tool-result",params=>{const value=structured(params?.result||params);if(value!==undefined){activeValue=value;$("payload").textContent=resultText(value)}});
bridge.on("ui/notifications/resource-updated",params=>{const uri=params?.uri||params;if(uri===activeResource)$("refresh").click()});
bridge.on("ui/resource-teardown",(_params,id)=>{closed=true;if(id!==undefined)post({jsonrpc:"2.0",id,result:{}})});
(async()=>{render();try{const initialized=await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:config.appId,version:"1.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});applyTheme(initialized?.hostContext);bridge.notify("ui/notifications/initialized",{});if(config.resources[0])await selectResource(config.resources[0]);const uris=config.resources.map(resource=>resource.uri);if(uris.length)bridge.request("subscriptions/listen",{notifications:{resourceSubscriptions:uris}}).catch(()=>{})}catch(error){if(!closed){setStatus("unavailable","bad");$("payload").textContent=`${config.emptyMessage}\n\n${error.message}`}}finally{reportSize()}})();
</script>
</body>
</html>
