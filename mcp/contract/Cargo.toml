[package]
name = "veoveo-mcp-contract"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_mcp_contract"
path = "src/lib.rs"

[features]
default = ["analytics"]
analytics = ["dep:duckdb"]
# In-process gateway for server tests: `hosting::testing`. Dev-dependencies only.
testing = ["dep:tower"]

[dependencies]
veoveo-knowledge-contract.workspace = true
veoveo-mcp-knowledge-extension = { workspace = true, features = ["mcp"] }
veoveo-knowledge-macros.workspace = true
veoveo-audit-contract.workspace = true
veoveo-artifact-contract.workspace = true
veoveo-types.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
duckdb = { workspace = true, optional = true }
futures.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower-http.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
tower.workspace = true
