[package]
name = "veoveo-mcp-contract"
version.workspace = true
edition.workspace = true

[lib]
name = "veoveo_mcp_contract"
path = "src/lib.rs"

[features]
default = ["runtime", "analytics"]
declaration = []
configuration = ["declaration", "dep:chrono", "dep:url", "dep:veoveo-knowledge-contract", "dep:veoveo-audit-contract", "dep:veoveo-artifact-contract"]
runtime = ["configuration", "dep:rmcp", "veoveo-mcp-knowledge-extension/mcp", "dep:veoveo-knowledge-contract", "dep:veoveo-audit-contract", "dep:veoveo-artifact-contract", "dep:anyhow", "dep:axum", "dep:base64", "dep:chrono", "dep:futures", "dep:hex", "dep:jsonwebtoken", "dep:opentelemetry", "dep:opentelemetry-appender-tracing", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:parking_lot", "dep:reqwest", "dep:tokio", "dep:tokio-util", "dep:tower-http", "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:url", "dep:uuid"]
analytics = ["runtime", "dep:duckdb"]
# In-process gateway for server tests: `hosting::testing`. Dev-dependencies only.
testing = ["runtime", "dep:tower"]

[dependencies]
veoveo-gateway-contract.workspace = true
veoveo-knowledge-contract = { workspace = true, optional = true }
veoveo-mcp-knowledge-extension = { workspace = true, default-features = false }
veoveo-macros.workspace = true
veoveo-audit-contract = { workspace = true, optional = true }
veoveo-artifact-contract = { workspace = true, optional = true }
veoveo-types.workspace = true
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { optional = true, workspace = true, features = ["blocking", "rustls-no-provider"] }
rmcp = { workspace = true, optional = true, features = ["server", "transport-streamable-http-server"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { optional = true, workspace = true, features = ["full"] }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { optional = true, workspace = true, features = ["v7"] }

[dev-dependencies]
veoveo-recording-contract.workspace = true
veoveo-computers-contract.workspace = true
veoveo-agent-runtime = { path = "../../agents/runtime", default-features = false, features = ["contract"] }
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
tower.workspace = true
