[workspace]
members = [
    "agents/kernel",
    "agents/manager",
    "agents/runtime",
    "apps/console/bff",
    "deploy/contract",
    "deploy/runtime",
    "examples/bioma/acceptance",
    "platform/runtimes/simulation/contract",
    "mcp/apps-extension",
    "mcp/bridges/legacy",
    "mcp/bridges/stdio",
    "mcp/conformance",
    "mcp/contract",
    "mcp/knowledge-extension",
    "platform/macros",
    "platform/modules",
    "platform/workspace",
    "platform/audit",
    "platform/audit/contract",
    "platform/artifacts/client",
    "platform/artifacts/contract",
    "platform/artifacts/service",
    "platform/computers",
    "platform/computers/contract",
    "platform/computers/execution",
    "platform/computers/host",
    "platform/computers/storage",
    "platform/computers/transport",
    "platform/frames/contract",
    "platform/knowledge/contract",
    "platform/gateway",
    "platform/gateway/composition",
    "platform/gateway/contract",
    "platform/gateway/catalog",
    "platform/policy",
    "platform/recordings/contract",
    "platform/recordings/forwarder",
    "platform/recordings/protocol",
    "platform/recordings/hub",
    "platform/recordings/rrd",
    "platform/recordings/reader",
    "platform/recordings/video",
    "platform/runtimes/duckdb",
    "platform/runtimes/embedding/contract",
    "platform/runtimes/embedding/client",
    "platform/runtimes/computers",
    "platform/store",
    "platform/task-runtime",
    "platform/types",
    "servers/knowledge-mcp",
    "servers/artifact-mcp",
    "servers/computers-mcp",
    "servers/frames-mcp",
    "servers/duckdb-mcp",
    "servers/media-mcp",
    "servers/map-mcp",
    "servers/optimization-mcp",
    "servers/stream-mcp",
    "servers/reason-mcp",
    "servers/speech-mcp",
    "servers/speech-mcp/contract",
    "servers/recording-mcp",
    "servers/timeseries-mcp",
    "servers/time-mcp",
    "servers/uav-sim-mcp",
    "servers/view-mcp",
    "templates/rust-mcp",
    "showcase/sumo/sumo-mcp",
    "testing/deployment-smoke",
    "testing/browser-smoke",
    "testing/flight-smoke",
    "testing/fixtures/modular-mcp",
    "testing/smoke",
    "tools/image-build/control",
    "tools/xtask",
]
exclude = ["testing/fixtures/module-schema-consumer"]
resolver = "3"

[workspace.metadata]
name = "veoveo"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
veoveo-embedding-contract = { path = "platform/runtimes/embedding/contract" }
veoveo-embedding-client = { path = "platform/runtimes/embedding/client" }
veoveo-knowledge-contract = { path = "platform/knowledge/contract" }
veoveo-mcp-knowledge-extension = { path = "mcp/knowledge-extension", default-features = false }
veoveo-macros = { path = "platform/macros" }
veoveo-audit-contract = { path = "platform/audit/contract" }
veoveo-audit = { path = "platform/audit" }
reqwest-websocket = { version = "=0.6.0", default-features = false }
anyhow = "=1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bevy = { version = "=0.19.1", default-features = false }
bytes = "1.12.1"
chacha20poly1305 = { version = "=0.11.0", features = ["alloc", "getrandom", "rand_core"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
draco-gltf = { version = "0.2.0", default-features = false, features = ["full"] }
flate2 = "1.1.9"
# Rust adapter 1.10505.0 with compatible comfy-table and download-version patches.
# Core/Spatial 1.5.6 qualification and fork retirement: platform/runtimes/duckdb/DESIGN.md.
duckdb = { git = "https://github.com/rozgo/duckdb-rs.git", rev = "3931d5bdafb490e46114c341aeb1873e910e7880", features = ["chrono"] }
futures = "0.3.34"
glam = { version = "0.33.4", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["extensions", "import", "KHR_materials_unlit", "names", "utils"] }
geo = { version = "0.32.0", features = ["serde"] }
geo-types = { version = "0.7.20", features = ["serde"] }
geographiclib-rs = "0.2.7"
geojson = { version = "1.0.0", features = ["geo-types"] }
getrandom = "0.4.3"
http = "1.5.0"
iri-string = { version = "=0.7.14", default-features = false, features = ["std"] }
hex = "=0.4.3"
hmac = "=0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
hifitime = { version = "4.3.1", default-features = false, features = ["std"] }
h264-reader = "=0.8.0"
jsonschema = "=0.51.0"
jiff = { version = "0.2.35", features = ["tz-system"] }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
memmap2 = "=0.9.11"
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
# Rerun's official Redap tests bring `re_perf_telemetry`, which enables the
# OTLP `hyper-client`. opentelemetry-otlp 0.32.0 cannot compile the combined
# blocking-reqwest + hyper feature set unless the higher-priority async
# reqwest client is also enabled.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-client", "trace", "logs", "metrics"] }
opentelemetry_sdk = "0.32.1"
mp4 = "=0.14.0"
nix = { version = "0.31.3", features = ["process", "signal"] }
notify = "8.2.0"
parking_lot = "0.12.5"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
polyline = "0.11.0"
proc-macro2 = "=1.0.107"
proj = { version = "0.31.0", default-features = false, features = ["geo-types", "bundled_proj"] }
quote = "=1.0.47"
rayon = "1.12.0"
rangemap = "1.8.0"
reqwest = { version = "=0.13.5", default-features = false }
# This fork pin carries acknowledged MCP 2026-07-28 resource subscriptions,
# governed resource reads, and request-boundary preflight not yet released upstream.
rig = { git = "https://github.com/rozgo/rig.git", rev = "4125e888edc7609413e9e9092a67ddbaf59422b5", features = ["rmcp"] }
prost = "=0.14.4"
re_dataframe = "=0.38.1"
re_chunk = "=0.38.1"
re_chunk_store = "=0.38.1"
re_entity_db = "=0.38.1"
rcgen = "0.14.9"
re_sdk = "=0.38.1"
re_sdk_types = "=0.38.1"
re_types_core = "=0.38.1"
re_byte_size = "=0.38.1"
re_grpc_server = "=0.38.1"
re_grpc_client = "=0.38.1"
re_log_channel = "=0.38.1"
re_log_encoding = { version = "=0.38.1", features = ["encoder", "decoder"] }
re_log_types = "=0.38.1"
re_auth = "=0.38.1"
re_protos = "=0.38.1"
re_server = "=0.38.1"
re_redap_tests = "=0.38.1"
re_tuid = "=0.38.1"
re_uri = "=0.38.1"
re_build_info = "=0.38.1"
# Stable RMCP 3.5.0 plus exact Task filters and typed HTTP rejections.
# Qualification and patch retirement: platform/gateway/DESIGN.md#sdk-transport-profile
rmcp = { version = "=3.5.0", git = "https://github.com/rozgo/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rstar = "0.13.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
scraper = "0.27.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sguaba = { version = "0.10.4", features = ["serde"] }
secrecy = "0.10.3"
sha2 = "=0.11.0"
subtle = "=2.6.1"
sse-stream = "=0.2.5"
syn = "=3.0.6"
tokio = "1.53.1"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = "0.7.19"
# Upstream stable is 2.0.21; retain the resolved, qualified error implementation
# while replacing owner plumbing so format parity is qualified independently.
thiserror = "=2.0.21"
tar = "0.4.46"
tempfile = "=3.27.0"
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
tower = "0.5.3"
tonic = "=0.14.6"
tonic-web = "=0.14.6"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
traci-rs = "0.2.0"
url = "=2.5.8"
percent-encoding = "=2.3.2"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5", "v7"] }
x509-parser = "=0.18.1"
zeroize = "=1.9.0"
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] }
veoveo-mcp-contract = { path = "mcp/contract", default-features = false }
veoveo-types = { path = "platform/types" }
veoveo-modules = { path = "platform/modules", default-features = false }
veoveo-gateway-contract = { path = "platform/gateway/contract" }
veoveo-computers-contract = { path = "platform/computers/contract" }
veoveo-gateway-catalog = { path = "platform/gateway/catalog" }
veoveo-workspace = { path = "platform/workspace", default-features = false }
veoveo-agent-runtime = { path = "agents/runtime", default-features = false }
veoveo-artifact-contract = { path = "platform/artifacts/contract" }
veoveo-deploy-contract = { path = "deploy/contract" }
veoveo-deploy-runtime = { path = "deploy/runtime" }
veoveo-simulation-contract = { path = "platform/runtimes/simulation/contract" }
veoveo-image-build-control = { path = "tools/image-build/control" }
veoveo-platform-store = { path = "platform/store" }
veoveo-frames-contract = { path = "platform/frames/contract" }
veoveo-recording-contract = { path = "platform/recordings/contract" }
veoveo-recording-protocol = { path = "platform/recordings/protocol" }
veoveo-rrd = { path = "platform/recordings/rrd" }
veoveo-recording-reader = { path = "platform/recordings/reader" }

# Image commands hash large pinned tools and source closures on every invocation.
# Optimize the hash implementation while retaining complete integrity checks.
[profile.dev.package.sha2]
opt-level = 3
